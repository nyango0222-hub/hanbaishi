<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>販売士1級 1問1答 ― 小売業の類型</title>
<style>
  :root{
    --ink:#1b2440;
    --ink-soft:#4a5473;
    --paper:#fafaf7;
    --line:#d9dbe3;
    --navy:#243b6b;
    --blank:#fff3bf;
    --blank-line:#e0a800;
    --ok:#1f7a4d;
    --ng:#b83227;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
  header h1{font-size:15px;font-weight:600;color:var(--navy);letter-spacing:.02em}
  header p{font-size:12px;color:var(--ink-soft);margin-top:4px}

  /* start */
  .sec-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .sec-list label{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    background:#fff;border-radius:var(--radius);font-size:14px;cursor:pointer
  }
  .sec-list label input{width:18px;height:18px;accent-color:var(--navy)}
  .sec-list .cnt{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .opt{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 18px;padding-left:2px}
  .opt input{width:18px;height:18px;accent-color:var(--navy)}
  .lead{font-size:13px;color:var(--ink-soft);line-height:1.6}

  /* buttons */
  button{
    font:inherit;border:0;cursor:pointer;border-radius:var(--radius);padding:14px 16px;font-size:15px;
    font-weight:600;transition:transform .08s ease, opacity .15s ease
  }
  button:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid #f0c040;outline-offset:2px}
  .btn-main{background:var(--navy);color:#fff;width:100%}
  .btn-sub{background:#fff;color:var(--navy);border:1px solid var(--navy);width:100%}
  .btn-ok{background:var(--ok);color:#fff;flex:1}
  .btn-ng{background:var(--ng);color:#fff;flex:1}
  .row{display:flex;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}

  /* quiz */
  .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .meta .num{font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:var(--navy);transition:width .25s ease}
  .sub{font-size:12px;color:var(--navy);font-weight:600;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--navy)}
  .q{
    font-size:17px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;min-height:140px
  }
  .blank{
    display:inline-block;min-width:4.5em;padding:0 .4em;margin:0 .1em;
    background:var(--blank);border-bottom:2px solid var(--blank-line);
    color:transparent;text-align:center;border-radius:3px;line-height:1.6;vertical-align:baseline;
    user-select:none
  }
  .blank.show{color:var(--ink);font-weight:700;background:#fff8dc;min-width:0}
  .ans{
    margin-top:14px;padding:14px 16px;border-radius:var(--radius);background:#eef1f8;
    font-size:14px;color:var(--ink-soft);line-height:1.6
  }
  .ans strong{display:block;font-size:19px;color:var(--navy);margin-top:2px}
  .hidden{display:none}
  .score-line{font-size:13px;color:var(--ink-soft);margin-top:14px;display:flex;gap:14px}
  .score-line b{color:var(--ink)}

  /* result */
  .result{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center}
  .result .big{font-size:48px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
  .result .big small{font-size:18px;color:var(--ink-soft);font-weight:500}
  .result p{font-size:14px;color:var(--ink-soft);margin-top:8px}
  .wrong{margin-top:20px}
  .wrong h2{font-size:14px;color:var(--ng);margin-bottom:8px}
  .wrong ol{padding-left:20px;font-size:13px;line-height:1.6}
  .wrong li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .wrong li b{color:var(--navy)}
  /* weak list */
  .weak-card{background:#fff;border:1px solid var(--ng);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .weak-head{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ng);font-weight:600;margin-bottom:10px}
  .weak-head b{font-size:22px;font-variant-numeric:tabular-nums}
  .weak-card .row button{padding:11px 10px;font-size:14px}

  /* review */
  .rv-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .rv-meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
  .rv-q{font-size:15px;line-height:1.85}
  .rv-a{margin-top:8px;font-size:14px;color:var(--navy);font-weight:700}
  .rv-del{background:#fff;color:var(--ink-soft);border:1px solid var(--line);font-size:12px;font-weight:500;padding:6px 10px;margin-top:10px;width:auto}
  .rv-empty{font-size:14px;color:var(--ink-soft);line-height:1.8;text-align:center;padding:30px 0}
  @media print{
    body{background:#fff}
    .app{max-width:none;padding:0}
    #start,#quiz,#result,.stack,.opt,.rv-del,.meta{display:none!important}
    #review{display:block!important}
    .rv-item{break-inside:avoid;page-break-inside:avoid;border:0;border-bottom:1px dashed #bbb;border-radius:0;padding:8px 0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>販売士1級 1問1答</h1>
    <p>小売業の類型（穴埋め）</p>
  </header>

  <!-- START -->
  <section id="start">
    <p class="lead">出題する節を選び、開始。空欄を頭の中で答えてから「答えを見る」→ 自己採点します。</p>
    <div class="weak-card hidden" id="weakCard">
      <div class="weak-head">苦手リスト <b id="weakCnt">0</b> 問</div>
      <div class="row">
        <button class="btn-sub" id="btnWeakReview">問題集を見る</button>
        <button class="btn-main" id="btnWeakQuiz">苦手だけ出題</button>
      </div>
    </div>
    <div class="sec-list" id="secList"></div>
    <label class="opt"><input type="checkbox" id="shuffle"> 出題順をシャッフルする（オフ＝教科書順）</label>
    <button class="btn-main" id="btnStart">開始する</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="meta"><span id="secName"></span><span class="num" id="counter"></span></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="sub" id="subName"></div>
    <div class="q" id="qText"></div>
    <div class="ans hidden" id="ansBox">正解<strong id="ansText"></strong></div>
    <div class="score-line"><span>正解 <b id="okCnt">0</b></span><span>不正解 <b id="ngCnt">0</b></span></div>
    <div class="stack">
      <button class="btn-main" id="btnReveal">答えを見る</button>
      <div class="row hidden" id="judgeRow">
        <button class="btn-ng" id="btnNg">× 不正解</button>
        <button class="btn-ok" id="btnOk">○ 正解</button>
      </div>
      <button class="btn-sub" id="btnQuit">中断してトップへ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="result">
      <div class="big"><span id="rOk">0</span><small> / <span id="rTotal">0</span></small></div>
      <p id="rRate"></p>
    </div>
    <div class="wrong" id="wrongBox"></div>
    <div class="stack">
      <button class="btn-main hidden" id="btnRetryWrong">間違えた問題だけ再挑戦</button>
      <button class="btn-sub" id="btnResultReview">苦手問題集を見る（<span id="rWeakCnt">0</span>問）</button>
      <button class="btn-sub" id="btnHome">トップへ戻る</button>
    </div>
  </section>
  <!-- REVIEW -->
  <section id="review" class="hidden">
    <div class="meta"><span>苦手問題集</span><span class="num" id="rvCnt"></span></div>
    <label class="opt"><input type="checkbox" id="rvShowAns" checked> 正解を表示する</label>
    <div id="rvList"></div>
    <div class="stack">
      <button class="btn-main" id="btnRvQuiz">この問題集で出題</button>
      <button class="btn-sub" id="btnRvPrint">印刷／PDFで保存</button>
      <button class="btn-sub" id="btnRvClear">苦手リストを全消去</button>
      <button class="btn-sub" id="btnRvHome">トップへ戻る</button>
    </div>
  </section>
</div>

<script>
// ---- DATA ----------------------------------------------------------
// s: 節, u: 小見出し, q: 問題文（___ が空欄）, a: 答え
const SECTIONS = {
  1:"第1章 第1節 流通政策の変遷",
  2:"第1章 第2節 循環型社会と流通",
  3:"第1章 第3節 グローバル小売競争の展開",
  4:"第1章 第4節 小売業主導のバリューチェーンの展開",
  5:"第2章 第1節 フランチャイズシステムの概念",
  6:"第2章 第2節 フランチャイズ組織の運営原則と加盟者の心構え",
  7:"第2章 第3節 フランチャイズシステムの組織と役割",
  8:"第2章 第4節 加盟金とロイヤリティの方式",
  9:"第3章 第1節 専門店の戦略的特性",
  10:"第3章 第2節 百貨店の戦略的特性",
  11:"第3章 第3節 総合品ぞろえスーパー（スーパーストア）の戦略的特性",
  12:"第3章 第4節 スーパーマーケットの戦略的特性",
  13:"第3章 第5節 ホームセンターの戦略的特性",
  14:"第3章 第6節 ドラッグストアの戦略的特性",
  15:"第3章 第7節 コンビニエンスストアの戦略的特性",
  16:"第3章 第8節 スーパーセンターの戦略的特性",
  17:"第4章 第1節 チェーンストアの戦略的特性",
  18:"第4章 第2節 チェーンストアのオペレーション特性",
  19:"第4章 第3節 チェーンストアの戦略的マネジメントシステム",
  20:"第5章 第1節 商店街の活性化戦略",
  21:"第5章 第2節 商店街のマーケティングへの取組み視点",
  22:"第5章 第3節 ショッピングセンター概論とマネジメント戦略",
  23:"第5章 第4節 SCにおけるディベロッパーの役割とテナント管理の視点"
};
const Q = [
// ===== 第1節 =====
{s:1,u:"1-1 流通政策の変遷と特徴",q:"1980年代までの流通政策は、中小企業を競争から___する観点で展開される傾向にあった。",a:"保護"},
{s:1,u:"1-1 流通政策の変遷と特徴",q:"1980年代後半から、日本市場の___が欧米諸外国から問題とされるようになった。",a:"閉鎖性"},
{s:1,u:"1-1 流通政策の変遷と特徴",q:"流通の分野では日本的___が競争を抑制し、消費者や新規参入者の利益を妨げているという点で国際的に批判が高まった。",a:"商慣行"},
{s:1,u:"1-1 流通政策の変遷と特徴",q:"市場競争の重視や経済的規制の緩和が消費生活の向上に役割を果たした一方で、社会的観点からみた___が重視されるようになった。",a:"社会的規制"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"百貨店法による出店規制は、企業ごとに出店面積を許可する___を採用していた。",a:"企業主義"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"スーパーマーケットの出店増加と中小小売業の反対運動を受け、1973年、百貨店法に代わり___が制定された。",a:"大規模小売店舗法（大店法）"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"大店法は、出店する店舗の面積を調整しようとする___を採用した。",a:"店舗主義"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"大店法は、中小小売業の___の確保を目的とし、一定の店舗面積以上の大型店の出店を規制した。",a:"事業機会"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"百貨店法の許可制に対し、大店法は届出制（___付き届出制）を採用した。",a:"事前審査"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"商業活動調整協議会における「調整4項目」とは、店舗面積、開店日、閉店時刻、___である。",a:"休業日数"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"1980年代後半から___などにおいて大店法に関する議論が高まり、大型店の新規参入を阻害しているとして国内外から強い批判を浴びた。",a:"日米構造協議"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"1990年代に規制緩和が段階的に進められ、___の制定に伴って、2000年6月に大店法が廃止された。",a:"大規模小売店舗立地法（大店立地法）"},
{s:1,u:"1-2 大型店出店規制の変遷と中小小売業政策",q:"中心市街地や商店街の活性化は、商業問題としてだけでなく、___として取り組むことが求められるようになった。",a:"都市問題"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"1998年5月、___、大店立地法、改正都市計画法の3つからなる「まちづくり三法」が制定された。",a:"中心市街地活性化法"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"まちづくり三法とは、中心市街地活性化法、大店立地法、___の3つである。",a:"改正都市計画法"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"中心市街地活性化法は、___などが中心市街地の活性化を目的とした関連施策を総合的に実施するための諸制度を体系化した法律である。",a:"市町村"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"大店立地法は、大型店の出店を「周辺の___の保全」という観点から調整する法律である。",a:"生活環境"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"大店立地法の対象は、店舗面積___を超える大型店である。",a:"1,000㎡"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"改正都市計画法は、国土の均衡ある発展と___の増進に寄与することを目的とした法律である。",a:"公共の福祉"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"改正都市計画法では、市町村が独自に___の用途地域に特別用途地区を重ねて“指定”できるようになった。",a:"都市計画区域"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"改正都市計画法では、市町村が独自に都市計画区域の用途地域に___を重ねて“指定”できるようになった。",a:"特別用途地区"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"改正都市計画法では、市町村が都市計画区域外に___を決定できるようになった。",a:"準都市計画区域"},
{s:1,u:"1-3 まちづくり三法の制定とその効果",q:"まちづくり三法は大きな成果が得られなかったため、市町村レベルでは「まちづくり条例」や「___」を制定する動きが活発化した。",a:"景観条例"},
{s:1,u:"1-4 まちづくり三法の改正",q:"まちづくり三法施行後も、市街地の機能が___へ拡散する動きは止まらなかった。",a:"郊外"},
{s:1,u:"1-4 まちづくり三法の改正",q:"都市機能を中心市街地にコンパクトに集約させ、併せて___の魅力を向上させて中心市街地の賑わいを回復させる考え方が提唱された。",a:"コミュニティ"},
{s:1,u:"1-4 まちづくり三法の改正",q:"都市機能の郊外への拡散を抑制し、中心市街地にコンパクトに集約させる考え方を___という。",a:"コンパクトシティ"},
{s:1,u:"1-4 まちづくり三法の改正",q:"2006年改正の中心市街地活性化法では、内閣に___を本部長とする中心市街地活性化本部を設置した。",a:"内閣総理大臣"},
{s:1,u:"1-4 まちづくり三法の改正",q:"2006年改正の中心市街地活性化法では、内閣に内閣総理大臣を本部長とする___を設置した。",a:"中心市街地活性化本部"},
{s:1,u:"1-4 まちづくり三法の改正",q:"中心市街地活性化の総合的かつ一体的な推進について必要な事項を協議するために、中心市街地ごとに___を組織することになった。",a:"中心市街地活性化協議会"},
{s:1,u:"1-4 まちづくり三法の改正",q:"中心市街地活性化協議会は、商工会議所・商工会、___、まちづくり会社などが共同で組織する機関である。",a:"中心市街地整備推進機構"},
{s:1,u:"1-4 まちづくり三法の改正",q:"中心市街地活性化法による支援措置を受けるためには、市町村が国の基本方針にもとづいて___を策定し、内閣総理大臣の認定を受けなければならない。",a:"中心市街地活性化基本計画"},
{s:1,u:"1-4 まちづくり三法の改正",q:"中心市街地への大型店出店の促進策として、都道府県による___の指定が拡充された。",a:"特例区域"},
{s:1,u:"1-4 都市計画法の改正（2007年11月全面施行）",q:"都市計画法改正の焦点は、大規模集客施設（延べ床面積が___を超える施設）の立地地域を制限することにあった。",a:"10,000㎡"},
{s:1,u:"1-4 都市計画法の改正（2007年11月全面施行）",q:"大規模集客施設が立地できる用途地域は、___の3つに限定された（建築基準法の改正による）。",a:"商業地域、近隣商業地域、準工業地域（順不同）"},
{s:1,u:"1-4 都市計画法の改正（2007年11月全面施行）",q:"3大都市圏と政令指定都市を除く地方都市では、___における大規模集客施設の立地を抑制することが、中心市街地活性化基本計画の認定を受ける条件となった。",a:"準工業地域"},

// ===== 第2章 第1節 フランチャイズシステムの概念 (s:5) =====
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイズとは、事業者（「___」と呼ぶ）が、他の事業者（「フランチャイジー」と呼ぶ）との間に契約を結び、事業を行う権利を与える両者の継続的関係をいう。",a:"フランチャイザー"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイズとは、事業者（「フランチャイザー」と呼ぶ）が、他の事業者（「___」と呼ぶ）との間に契約を結び、事業を行う権利を与える両者の継続的関係をいう。",a:"フランチャイジー"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイザーは、自己の___、サービスマーク、トレードネームその他の営業の象徴となる標識、および経営のノウハウを用いて事業を行う権利を与える。",a:"商標"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイザーは、自己の商標などの標識、および経営の___を用いて、同一のイメージの下に商品の販売その他の事業を行う権利を与える。",a:"ノウハウ"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイザーは、同一のイメージの下に商品の販売その他の事業を行う___を与える。",a:"権利"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイジーはその見返りとして一定の___を支払い、事業に必要な資金を投下してフランチャイザーの指導および援助の下に事業を行う。",a:"対価"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"本部（フランチャイザー）と加盟者（フランチャイジー）は各々独立した事業体であり、___にもとづく共同事業を行う。",a:"契約（フランチャイズ契約）"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"本部から加盟者に___が提供され、その見返りとして加盟者は本部に一定の対価を支払う。",a:"フランチャイズパッケージ"},
{s:5,u:"1 フランチャイズシステムの仕組み",q:"フランチャイズビジネスの基本は、契約と___の原則である。",a:"自己責任"},
{s:5,u:"1 フランチャイズシステムの特徴",q:"フランチャイズシステムの特徴 ⅰ）統一ブランド使用による___の拡大…各フランチャイジーが統一したブランドの下で統一的な活動を行うことで、より多くの消費者から当該ブランドが認知され、その信用力を増していく。",a:"信用"},
{s:5,u:"1 フランチャイズシステムの特徴",q:"フランチャイズシステムの特徴 ⅱ）相互の経営資源活用による___分散",a:"リスク"},
{s:5,u:"1 フランチャイズシステムの特徴",q:"フランチャイジー（加盟者）は、フランチャイザーが開発した経営ノウハウや商品・サービスを活用できるため、___の負担を軽減できる。",a:"事業開発投資"},
{s:5,u:"1 フランチャイズシステムの特徴",q:"フランチャイザー（本部）は、営業拠点の拡大に伴い発生する投資（___、設備、運転資金）などをフランチャイジーが主に負担するため、事業拡大のための投資（資金）負担を軽減できる。",a:"人（ヒト）"},
// ===== 第2章 第2節 フランチャイズ組織の運営原則と加盟者の心構え (s:6) =====
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイズ事業は、個々の経営体が独立して運営を行う一方、本部（フランチャイザー）と加盟店（フランチャイジー）との___でもある。",a:"経営理念共同体"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイズシステムが、統一のイメージ戦略や統一した販売活動など、すべてのフランチャイジーの間に乱れのない行動によって消費者からの信頼を高めていく原則を「___の原則」という。",a:"統一性"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイズシステムは、統一のイメージ戦略や統一した販売活動など、乱れのない行動によって消費者からの信頼を高めていく___の一環として機能する。",a:"マーケティング戦略"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"統率は、多くの人を1つにまとめて一定の方向を持たせることであり、指導者には___が要求される。",a:"リーダーシップ"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイザーとフランチャイジーとの関係は、組織全体としては___組織と位置づけることができる（機能分担の原則）。",a:"機能分担"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイズシステムでは、___が戦略立案機能を担当し、フランチャイジーが実施機能を担当する。",a:"フランチャイザー"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイズシステムでは、フランチャイザーが戦略立案機能を担当し、___が実施機能を担当する。",a:"フランチャイジー"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"独立経営者であるフランチャイジーは、その成長意欲や___が直営店の組織以上に事業を推進する力となり得る（独立経営の原則）。",a:"企業家精神"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイザーとフランチャイジーは、良きパートナーとして助け合いながら成長していく共同体であり、「___と独立性の同時達成」を有効に活かしていく必要がある。",a:"統一性"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイザーとフランチャイジーは、「両者の適度な緊張の中での___」を有効に活かしていく必要がある。",a:"協調"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイズシステムは、フランチャイザーとフランチャイジーが相互に発展するための協働組織である。この原則を「___の原則」という。",a:"相互発展"},
{s:6,u:"2-1 フランチャイズ組織の運営原則",q:"フランチャイザーはフランチャイジーの繁栄を実現するために努力し、フランチャイジーは自ら業績を向上させることによってフランチャイザーの___をはかる。",a:"機能強化"},
{s:6,u:"2-2 加盟者の心構え",q:"中小企業庁のパンフレットによる加盟者の心構え：加盟店は「___した事業者」である。",a:"独立"},
{s:6,u:"2-2 加盟者の心構え",q:"中小企業庁のパンフレットによる加盟者の心構え：事業であるからには、___があることを十分に認識する（「すぐに利益が上がる」という楽観的な見通しは持つべきではない）。",a:"リスク"},

{s:7,u:"3 本部に必要な組織と機能",q:"フランチャイズチェーンの本部を設立するには、___を生み出せる優れたビジネスモデルを構築する必要がある。",a:"利益"},
{s:7,u:"3 本部に必要な組織と機能",q:"フランチャイズシステムを運営するには、ヒト、モノ、カネ、情報、ノウハウなどの___が必要である。",a:"経営資源"},
{s:7,u:"3 本部に必要な組織と機能",q:"フランチャイズシステムの運営に必要な経営資源（ヒト、モノ、カネ、情報、ノウハウ）のうち、最も重要なのは___である。",a:"ヒト"},
{s:7,u:"3 本部に必要な組織と機能",q:"商品・サービス開発機能：ユニークまたは品質の良い商品やサービスを開発し、適正な___と独自の販売方法を加盟店に提供できる機能。",a:"価格"},
{s:7,u:"3 本部に必要な組織と機能",q:"教育・訓練・指導機能：加盟店に提供する商品やサービス、販売方法などを正しく理解させ、加盟店を指導する人材（___）を育成する機能。",a:"スーパーバイザー"},
{s:7,u:"3 本部に必要な組織と機能",q:"フランチャイズチェーンのイメージ向上や新商品の普及などの目的で、各種キャンペーンなどを実施する機能を___機能という。",a:"販売促進"},
{s:7,u:"3 本部に必要な組織と機能",q:"加盟後の運転資金、改装資金、リースといった資金需要に対して応じることのできる機能を___機能という。",a:"金融"},
{s:7,u:"3 直営店の運営",q:"成功したビジネスの原型、つまり、フランチャイズ展開を行ううえでのモデル店舗のことを___という。",a:"プロトタイプモデル"},
{s:7,u:"3 直営店の運営",q:"モデル店舗の設置にあたっては、最低でも___店以上の成功体験を導入・実践することが必要といわれている。",a:"3"},
{s:7,u:"3 直営店の運営",q:"フランチャイズ化の条件は、特色のある商品やサービスを開発しており、それらを販売するための特異な技術・ノウハウを___で実証していることである。",a:"直営店"},
{s:7,u:"3 直営店の運営",q:"直営店の役割 ⅰ）___の場としての役割",a:"実験"},
{s:7,u:"3 直営店の運営",q:"直営店の役割 ⅲ）___づくりの場としての役割（ⅱは人材育成の場）",a:"経営モデル"},
{s:7,u:"3 直営店の運営",q:"直営店の役割 ⅳ）___の確立の場としての役割",a:"リーダーシップ"},
{s:7,u:"3 フランチャイジーに対するスーパーバイザーの役割",q:"スーパーバイザーの役割は、フランチャイジーに対する本部の方針や施策の促進、そして___に沿ってフランチャイジーを指導することである。",a:"マニュアル"},
{s:7,u:"3 フランチャイジーに対するスーパーバイザーの役割",q:"スーパーバイザーの実際の業務としては、訪問前に本部で店舗の問題点と解決策について___を立て、店舗訪問時は、マニュアルに記載された事項やレベルについてチェックする。",a:"仮説"},
// ===== 第2章 第4節 加盟金とロイヤリティの方式 (s:8) =====
{s:8,u:"4-1 フランチャイズ本部への支払い",q:"フランチャイズ契約締結の際にフランチャイザーからフランチャイジーに提供される商標利用権などの対価として支払うものが___である。",a:"加盟金（加盟料、契約金）"},
{s:8,u:"4-1 フランチャイズ本部への支払い",q:"最近では、加盟の意思表示をした段階で加盟金の一部を___として徴収するケースが増えてきている。",a:"加盟申込金"},
{s:8,u:"4-1 フランチャイズ本部への支払い",q:"商品などの仕入債務やロイヤリティの支払いなどを担保するために、フランチャイジーがフランチャイズ契約時にフランチャイザーに預け入れる金銭が___である。",a:"保証金"},
{s:8,u:"4-1 フランチャイズ本部への支払い",q:"著作権、商標権などの“権利使用料”を意味する用語として使われる___は、フランチャイズチェーン業界などにおける権利者に対して支払うライセンス料や著作権使用料を指す。",a:"ロイヤリティ"},
{s:8,u:"4-1 フランチャイズ本部への支払い",q:"ロイヤリティは、フランチャイジーがFCに加盟後、フランチャイザーに対して、定期的（通常は___）に支払う金銭である。",a:"毎月"},
{s:8,u:"4-1 主なロイヤリティの算出方法",q:"売上高に一定割合を掛けて算出する方式。経営ノウハウの効果が最も端的に数字で表れるとする考え方で、ハンバーガーチェーンなど多くの外食産業が採用している。→___方式",a:"売上高比例"},
{s:8,u:"4-1 主なロイヤリティの算出方法",q:"売上総利益に一定割合を掛けて算出する方式。フランチャイジーの最低限の収益を保証しようという考え方で、コンビニエンスストア業界の大手チェーンが採用している。→___方式",a:"粗利益分配"},
{s:8,u:"4-1 主なロイヤリティの算出方法",q:"業績の良し悪しにかかわらず、あらかじめ設定した一定金額を徴収する方式。フランチャイジーを指導するための本部運営費用は一定であるとする考え方。→___方式",a:"定額"},
{s:8,u:"4-1 主なロイヤリティの算出方法",q:"店舗面積や客席数、車の保有台数など、その業種の規模を表す大きさや数量によって算定する方式。本部の指導コストは規模に比例するという考え方。→___方式",a:"営業規模比例"},
{s:8,u:"4-1 主なロイヤリティの算出方法",q:"フランチャイジーに供給する商品などの価格にロイヤリティが含まれている方式。→___方式",a:"商品供給代替"},
{s:8,u:"4-2 フランチャイズ本部以外への支払い",q:"店舗賃貸借契約時に発生する代表的な費用として、___（家賃の不払いが生じたときなどの担保として貸主に預け入れられる金銭）、礼金・仲介手数料、前払い家賃などがある。",a:"敷金"},
{s:8,u:"4-3 投資回収期間の考え方",q:"一般に投資回収期間は、加盟金や設備投資をはじめとした___を年間で稼いだキャッシュフローの額で割ることにより算出できる。",a:"初期投資額"},
{s:8,u:"4-3 投資回収期間の考え方",q:"一般に投資回収期間は、初期投資額を年間で稼いだ___の額で割ることにより算出できる。",a:"キャッシュフロー"},
{s:8,u:"4-3 投資回収期間の考え方",q:"初期投資額をすべて自己資金でまかなった場合と、金融機関などから借入をした場合とでは、借入を行った場合の___分だけ投資回収期間が長くなる。",a:"利息負担"},
// ===== 第3章 第1節 専門店の戦略的特性 (s:9) =====
{s:9,u:"1-1 デモグラフィックとライフスタイルの変化への対応",q:"近年、国内のデモグラフィックは、___の高齢化と、現在の世代別人口で団塊世代に次ぐ第2の山を構成する団塊ジュニア市場の拡大化という二極分化の傾向が表れている。",a:"団塊の世代"},
{s:9,u:"1-1 デモグラフィックとライフスタイルの変化への対応",q:"近年、国内のデモグラフィックは、団塊の世代の高齢化と、現在の世代別人口で団塊世代に次ぐ第2の山を構成する___市場の拡大化という二極分化の傾向が表れている。",a:"団塊ジュニア"},
{s:9,u:"1-1 デモグラフィックとライフスタイルの変化への対応",q:"ライフスタイルの変化についても、___の進展と、ディスカウント業態での買物に多くの消費者が抵抗を示さなくなっている傾向が顕著になっている。",a:"カジュアル化"},
{s:9,u:"1-2 マーケットセグメンテーションの実施",q:"今日、市場を___（マーケットセグメンテーション）し、その層へ集中攻撃をかける動きが活発化しており、これを戦略として実践している代表例が衣料品専門店チェーンである。",a:"細分化"},
{s:9,u:"1-2 マーケットセグメンテーションの実施",q:"衣料品専門店チェーンは、セグメントしたターゲットの___に合わせた商品カテゴリーをミックスしている点が特徴であり、新しいテクノロジーを活用し、個々の顧客ニーズ、好み、テイスト、___、サイズなどを網羅したデータベースの構築が、顧客密着型の小売業態を確立させたといえる。",a:"ライフスタイル"},
{s:9,u:"1-2 マーケットセグメンテーションの実施",q:"個々の顧客ニーズ、好み、テイスト、ライフスタイル、サイズなどを網羅したデータベースの構築が、___型の小売業態を確立させたといえる（人口構造のボリュームゾーンを形成する消費者層に焦点を当てることが___型小売業経営の基本）。",a:"顧客密着"},
{s:9,u:"1-3 テクノロジー活用によるカスタムメイドの実現",q:"テクノロジーの進化は、個々の顧客に合わせた___の商品を提供することができる。",a:"カスタムメイド"},
{s:9,u:"1-3 テクノロジー活用によるカスタムメイドの実現",q:"テクノロジー活用の例：大容量で使いやすいデータベースの構築、ネットから実店舗に誘客する___の取組み（オンラインとオフラインの連携）、顧客カードの高度活用、ネットショップの開設。",a:"O2O"},
{s:9,u:"1-3 テクノロジー活用によるカスタムメイドの実現",q:"商品でなく、顧客へのサービスこそが専門店の___戦略を展開するうえで最も重要なポイントである。",a:"個性化"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"専門店の強さの本質は、品ぞろえのスペシャルティ（専門性）ではなく、___のスペシャルティにある。",a:"コンセプト"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"これからの時代における専門店とは、ライフスタイル面や___面などから絞り込んだ主要顧客層に向けて設定したストアコンセプトにもとづき、マーケティングセオリーの4P戦略（立地、品ぞろえ、価格、販売促進）を推進する業態と位置づけることができる。",a:"サイコグラフィック"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"これからの時代における専門店とは、ライフスタイル面やサイコグラフィック面などから絞り込んだ主要顧客層に向けて設定した___にもとづき、マーケティングセオリーの4P戦略を推進する業態と位置づけることができる。",a:"ストアコンセプト"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"これからの時代における専門店とは、絞り込んだ主要顧客層に向けて設定したストアコンセプトにもとづき、マーケティングセオリーの___（立地、品ぞろえ、価格、販売促進）を推進する業態と位置づけることができる。",a:"4P戦略"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"セルフサービスの専門店であっても、サービス＆___（高度な対話方式による専門販売員の接客）という人的販売の専門性が強く要求されてくる。",a:"クオリティ"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"専門店は、セグメント別に識別・分類した顧客の抱く悩みを解決する策（___ビジネス）を提供したり、顧客のウォンツを満たす生活シーンを提案したりする行為を独自にプログラム化し、顧客を維持していくことが要請されてくる。",a:"ソリューション"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"専門店は顧客の組織化（囲い込み）に邁進しなければならず、囲い込んだ顧客を___していくためにCRM（顧客関係性マネジメント）を志向し、顧客生涯価値（LTV）の創造をはかることが求められてくる。",a:"維持"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"専門店は顧客の組織化（囲い込み）に邁進しなければならず、囲い込んだ顧客を維持していくために___（顧客関係性マネジメント）を志向し、顧客生涯価値（LTV）の創造をはかることが求められてくる。",a:"CRM"},
{s:9,u:"1-4 マーケティング＆ソリューション型業態の確立",q:"___＝（顧客1人当たり粗利益額－顧客1人当たり販売諸経費）×生涯来店回数。専門店は、顧客維持率（リピート率）、顧客単価、1人当たり顧客維持費用など、相互の関連性を注視して___を高めていくべきである。",a:"顧客生涯価値（LTV）"},
// ===== 第3章 第2節 百貨店の戦略的特性 (s:10) =====
{s:10,u:"2-1 委託・返品制度への依存",q:"百貨店は、1960年代から80年代まで、流行をつくり出す「___（孵化器）」の機能を発揮すると同時に、「都市消費文化」の創造という役割を担ってきた。",a:"インキュベータ"},
{s:10,u:"2-1 委託・返品制度への依存",q:"百貨店業界の構造的な高コスト・低収益性の主要因は、業界特有の___制度や派遣社員制度に依存した取引制度にあるといえる。",a:"委託・返品"},
{s:10,u:"2-1 委託・返品制度への依存",q:"百貨店は、高価格帯商品の___（総合型品ぞろえ）によるマルチターゲット（不特定多数の顧客対象）政策を余儀なくされている。",a:"フルラインマーチャンダイジング"},
{s:10,u:"2-1 委託・返品制度への依存",q:"百貨店は、高価格帯商品のフルラインマーチャンダイジング（総合型品ぞろえ）による___（不特定多数の顧客対象）政策を余儀なくされている。",a:"マルチターゲット"},
{s:10,u:"2-1 委託・返品制度への依存",q:"委託・返品制度では、売れ残った商品はサプライヤーが引き取るため、百貨店は商品ロスや___は負わないが、その分、利益率は低くなる。",a:"在庫リスク"},
{s:10,u:"2-1 委託・返品制度への依存",q:"今日、百貨店においては、自らの努力次第で利益率の向上が見込める___による仕入方式が増加基調にある。",a:"買取り（買取仕入）"},
{s:10,u:"2-1 委託・返品制度への依存",q:"百貨店が委託・返品制度に依存する主な理由 ⅰ）___制度の活用の弊害：買取仕入による専門性の高い高価格帯商品を主体に販売する優秀な販売員が不足している／販売の主体を___に任せきりにしてきた。ⅱ）多くの問屋やメーカーの問題：百貨店における販売価格をコントロールすることができる／買取りによる商品の安売り合戦の危険性から、ブランドイメージが低下する。",a:"派遣社員"},
{s:10,u:"2-2 派遣社員制度による販売協力",q:"売場をメーカーなどに切貸しする___（納入先企業スペースの割当）も、百貨店の構造的問題の1つである。",a:"ベンダーアロケーション"},
{s:10,u:"2-2 派遣社員制度による販売協力",q:"委託・返品制度では、派遣社員制度がセットになっている（問屋やメーカー側が販売の協力を前提として自社の販売員を無料で派遣している）。派遣社員（派遣店員）制度のメリットは、問屋やメーカー側…自社商品（ブランド）の販売比率の向上、百貨店側…自社の___削減や教育研修に要するコストと時間の節約。",a:"人件費"},
{s:10,u:"2-3 業態としての百貨店の確立とホスピタリティ経営",q:"アメリカのデパートメントストアは、「何でもそろい、誰にでも売るよろず屋」としての総合化ではなく、むしろ___を基本とする専門型品ぞろえ小売業態といえる。",a:"ターゲットマーケティング"},
{s:10,u:"2-3 業態としての百貨店の確立とホスピタリティ経営",q:"今日、百貨店に求められているのは、ファッション領域主体の___創造であり、専門業態を取り込んだワンストップショッピングの利便性やエンターテインメント性を持ったスペシャルティ・マーチャンダイジングを展開していくべきである。",a:"ライフスタイル"},
{s:10,u:"2-3 業態としての百貨店の確立とホスピタリティ経営",q:"今日、百貨店に求められているのは、ファッション領域主体のライフスタイル創造であり、専門業態を取り込んだ___の利便性やエンターテインメント性を持ったスペシャルティ・マーチャンダイジングを展開していくべきである。",a:"ワンストップショッピング"},
{s:10,u:"2-3 業態としての百貨店の確立とホスピタリティ経営",q:"今後の百貨店経営において最も重要な顧客サービスのコンセプトになるのが___（もてなし）である。",a:"ホスピタリティ"},

{s:11,u:"3-1 日本型GMSはモノ不足時代の販売システム",q:"総合品ぞろえスーパーは、衣食住の分野にわたる多くの部門を集めた総合的な品ぞろえの量販店としての機能を担うため、アメリカの___のチェーンオペレーション・システムを導入した。",a:"スーパーマーケット"},
{s:11,u:"3-1 日本型GMSはモノ不足時代の販売システム",q:"【アメリカのGMS】中流階級所得者層を対象に、日常生活に必要な___を、一定のストアコンセプトにもとづいて取りそろえた店舗形態。",a:"非食品"},
{s:11,u:"3-1 日本型GMSはモノ不足時代の販売システム",q:"【日本型GMS】食料品から衣料品、家電までさまざまな業種を単に1か所に集約させただけの店舗形態（___的大型店舗）。",a:"よろず屋"},
{s:11,u:"3-1 日本型GMSはモノ不足時代の販売システム",q:"日本型GMSは、大衆向け商品を大量販売するために、___仕入を主体として各種政策の展開から店づくりまでを画一化、標準化するチェーンオペレーション方式の運営形態を採用し、集中的運営による規模のメリットを追求してきた。",a:"一括集中"},
{s:11,u:"3-1 日本型GMSはモノ不足時代の販売システム",q:"日本型GMSは、大衆向け商品を大量販売するために、一括集中仕入を主体として各種政策の展開から店づくりまでを画一化、___するチェーンオペレーション方式の運営形態を採用してきた（モノ不足時代における大量生産に合致した大量販売方式）。",a:"標準化"},
{s:11,u:"3-1 日本型GMSはモノ不足時代の販売システム",q:"衰退期に入ったといわれる日本の総合品ぞろえスーパー業界は、成長期に名づけられた「日本型GMS」から本格的「___」へと進化すべく、構造改革に取り組んでいる（スーパーマーケットの売場面積を拡大し、そこに衣料品などの非食品をプラスして同時購買させようとした大型の店舗形態）。",a:"スーパーストア"},

{s:11,u:"3-2 スーパーストアへの転換の必要性",q:"スーパーストア各社は収益構造を支える大きな柱として、専門店などの___を募り、賃貸収入を確保してきた。",a:"テナント"},
{s:11,u:"3-2 スーパーストアへの転換の必要性",q:"スーパーストアは、バブル経済破綻後には輸入商品の拡大や、自社だけで販売する___商品の開発などによって生活支援価格の形成に努力してきた。",a:"ストアブランド"},
{s:11,u:"3-2 スーパーストアへの転換の必要性",q:"スーパーストアは、消費者の___（買物時間の節約）ニーズを阻害する要因を内包しているため、機能喪失現象に陥っている。",a:"タイムセービング"},

{s:11,u:"3-3 専門大型化小売業との比較にみる勢力差",q:"専門大型化小売業は、生活者の特定の___に必要な商品カテゴリーを専門的に扱い、それらの品目を深く取りそろえながら、スーパーストアよりも低価格販売を実現している。",a:"生活シーン"},

{s:11,u:"3-3 専門大型化小売業との比較にみる勢力差",q:"今日ではショッピングセンターにおけるキーテナント（核店舗）として、___型専門店チェーンが伝統的な日本型GMSに取って代わる新旧交代劇が顕著となっている。",a:"ライフスタイル提案"},

{s:11,u:"3-4 マスマーチャンダイジングの確立",q:"ほとんどのスーパーストアでは、___を活用して死に筋商品を確定（検証）した場合、在庫を早めに値下することで処分しようとするが、それは商品を売り切る仕組みとはいえない。",a:"POSデータ"},
{s:11,u:"3-4 マスマーチャンダイジングの確立",q:"ほとんどのスーパーストアでは、POSデータを活用して死に筋商品を確定（検証）した場合、在庫を早めに___することで処分しようとするが、それは商品を売り切る仕組みとはいえない。",a:"値下"},

{s:11,u:"3-5 マーケティング志向へ",q:"これまでの販促方法は、特売や目玉商品による大量販売政策であり、「___を割っての安売りで集客をはかり、ほかの定番商品を消費者に買わせることで売上の拡大と___割れ特売商品のマイナスを補う」という方法である。",a:"原価"},

{s:17,u:"1-2 チェーンストアの社会的役割",q:"チェーンストアは、店舗の連鎖化による規模の経済性ならびに店舗の信頼性を発揮することによって、地域社会への貢献をはかることを目的としている。多くのチェーンストアでは、店舗の___および信頼性の向上をはかることを目標としている。",a:"認知度"},

{s:17,u:"1-2 チェーンストアの社会的役割",q:"チェーンストアは、画一化された店舗で、統一化された品ぞろえやサービスを、___されたチェーンオペレーションによって提供していくことを原則としている。",a:"標準化"},

{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"チェーンストア理論は、画一化、統一化、標準化の原則に従い、多数の店舗を鎖状に連結し、本部が一元管理することによって効率的な経営をするための方法論である。このうち、店舗の立地、商圏、規模、内外装と仕様、顧客導線およびフロアゾーニング、フロアレイアウトなどを対象とする原則は何か。",a:"画一化"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"＜一元管理の原則＞地域性や個々の店舗の事情を考慮に入れたうえで、各店舗の大部分の品ぞろえを___することで、本部一括大量仕入によるバイングパワーを高め、各店舗への商品の効率的配分を実現する。",a:"統一化"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"＜一元管理の原則＞店舗の運営システム、従業員の役割、具体的作業などをマニュアルによって___するとともに、スーパーバイザーの派遣などにより各店舗を画一的に稼働させる。",a:"標準化"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"チェーンストア理論は、画一化、統一化、標準化の原則に従い、多数の店舗を鎖状に連結し、本部が___することによって効率的な経営をするための方法論である。",a:"一元管理"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"品ぞろえの統一化により、本部一括大量仕入による___を高め、各店舗への商品の効率的配分を実現する。",a:"バイングパワー"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"店舗の運営システム、従業員の役割、具体的作業などを___によって標準化する。",a:"マニュアル"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"オペレーションの標準化では、___の派遣などにより各店舗を画一的に稼働させる。",a:"スーパーバイザー"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"本来、各店舗が行う仕入や販促企画などの業務を本部が一括して担当し、各店舗は本部主導のもと、___業務に特化することで全体の効率を高める運営方法がチェーンオペレーションである。",a:"販売"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"＜チェーンオペレーションのメリット＞フラットな組織による迅速な___の実現",a:"意思決定"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"＜チェーンオペレーションのデメリット＞オペレーションの___化",a:"硬直"},
{s:18,u:"2-1 チェーンストア理論とチェーンオペレーション",q:"＜チェーンオペレーションのデメリット＞現場社員の___の低下",a:"モラール（士気）"},
{s:18,u:"2-2 チェーンオペレーションの本質",q:"チェーンオペレーションとは、画一化された店舗を、ある限定したエリアに他の資本が参入できないほどの店舗数による___形成が可能になるよう、集中的、かつ、継続的に出店を行い、規模の経済性にもとづく原価の低減とローコストオペレーションによって収益の増大をはかる仕組みである。",a:"ドミナント"},
{s:18,u:"2-2 チェーンオペレーションの本質",q:"チェーンオペレーションでは、ドミナント形成が可能になるよう、集中的、かつ、___に出店を行う。",a:"継続的"},
{s:18,u:"2-2 チェーンオペレーションの本質",q:"チェーンオペレーションは、規模の経済性にもとづく___の低減とローコストオペレーションによって収益の増大をはかる仕組みである。",a:"原価"},
{s:18,u:"2-2 チェーンオペレーションの本質",q:"チェーンオペレーションは、規模の経済性にもとづく原価の低減と___によって収益の増大をはかる仕組みである。",a:"ローコストオペレーション"},
{s:18,u:"2-2 チェーンオペレーションの本質",q:"チェーンオペレーションは、本部に___機能を集中させることによって、多数の店舗を組織的に統合し、さらに専門的な管理と標準化された運営システムのもとで戦略が展開される運営方法である。",a:"一括仕入"},
{s:18,u:"2-2 チェーンオペレーションの本質",q:"チェーンオペレーションは、本質的には小売（セールス）機能と卸売（___）機能との統合と分業によって展開されるシステムといえる。",a:"アソートメント"},
{s:18,u:"2-3 ロジスティクスの構築による物流の効率化",q:"チェーンオペレーションのもとで展開されるロジスティクスの目標は、___を稼働させて単品大量輸送と、そこから店舗の品ぞろえに合わせた個別品ぞろえ配送とを効率的、かつ、効果的に結節できるシステムの構築にある。",a:"物流センター"},
{s:18,u:"2-3 ロジスティクスの構築による物流の効率化",q:"物流センターから店舗までの個別品ぞろえ配送においては、多品種少量型の___システムによる配送の効率化が重要となる。",a:"ジャストインタイム（JIT）物流"},
{s:18,u:"2-3 ロジスティクスの構築による物流の効率化",q:"チェーンオペレーションの成功の鍵は、___化にもとづく店舗運営のもとでロジスティクスを展開していくことにある。",a:"情報システム"},
{s:18,u:"2-3 ロジスティクスの構築による物流の効率化",q:"コンビニエンスストアなどにみられる___システムは、チェーンオペレーションのロジスティクスの考え方を応用したものである。",a:"共同配送"},

{s:19,u:"3-2 地域の需要創造活動の強化とストアロイヤルティの形成",q:"今日では、個々の店舗においてエリアの特性と消費者のニーズを十分にくみ取り、従業員の知恵を結集して魅力的な___や販売促進策、利益計画などを企画・実践・調整していかなければならない。",a:"品ぞろえ"},
{s:19,u:"3-2 地域の需要創造活動の強化とストアロイヤルティの形成",q:"地域の___活動の強化が重要である。",a:"需要創造"},

{s:20,u:"1-1 商店街の役割と課題",q:"＜空き店舗が埋まらない理由：テナント等借り手側の都合＞第1位は「___の折り合いがつかない（36.1％）」である。",a:"家賃"},
{s:20,u:"1-1 商店街の役割と課題",q:"「経営者の高齢化による後継者問題」については、自治体や___などの協力を得ながら、地域活性化などに取り組むことにより、空き店舗の解消と若者の商店街への出店を促進した事例がある。",a:"商工会・商工会議所"},
{s:20,u:"1-1 商店街の役割と課題",q:"「店舗等の老朽化」「集客力が高い・話題性のある店舗／業種が少ない又は無い」については、長期間老朽化して空き店舗となっていたビルを___として改装し、1階に知名度の高い海外輸入食材店を入居させたことで新たな集客が生まれ、商店街の活性化につながった事例がある。",a:"賃貸ビル"},
{s:20,u:"1-1 商店街の役割と課題",q:"特定の地区内で資産所有者や事業者など一定の主体を対象に合意形成がなされ、それらの者の負担を財源に地区管理や活性化事業を行う仕組みである___制度を活用して、商店街のマネジメントを強化していくことが考えられる。",a:"BID"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"近年、社会構造の変化が続く中で、外国人観光客とその___は大幅に増加しており、いまやインバウンド需要の取込みにより地方を活性化することは、重要な施策の1つとなっている。",a:"旅行消費額"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"現在、商店街にどのくらい外国人観光客がいるかを尋ねた結果、約___割の商店街において外国人観光客が来訪している状況である。",a:"4"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"来訪する外国人観光客の国籍・地域は、「___（76.4％）」が最も多く、次いで「韓国（50.8％）」「台湾（44.1％）」の順となっており、アジア圏からの来訪が多くなっている。",a:"中国"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜外国人観光客が訪れる主な理由（商店街側）＞「商店街内または周辺に___があるため（46.4％）」",a:"宿泊施設"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜外国人観光客が商店街で購入する主な商品＞「___・健康グッズ・トイレタリー（22.3％）」",a:"医薬品"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜外国人観光客が不便に感じていること（商店街側）＞第1位は「___がとれない（36.6％）」である。",a:"コミュニケーション"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜外国人観光客が不便に感じていること（商店街側）＞「___に対応していない（25.3％）」",a:"免税"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜訪日外国人旅行者が旅行中に困ったこと＞「施設などのスタッフと___がとれない（32.9％）」",a:"コミュニケーション"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜訪日外国人旅行者が旅行中に困ったこと＞「___の少なさ・わかりにくさ（23.6％）」",a:"多言語表示"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"外国人観光客受け入れのための取組み（インバウンド事業）の実施状況についてみると、「取組みを行っていない上、今後も実施する予定はない」との回答が約___割を占めている。",a:"7"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜具体的な取組み内容＞第1位は「___の設置（62.4％）」である。",a:"Wi-Fi"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"外国人観光客の買物時の利便性向上策として、「クレジットカード等___の導入」、「免税手続一括カウンターの設置」などが行われている。",a:"決済端末"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"2015年4月の制度改正（免税手続きに関する規制緩和）により、免税手続一括カウンターを運営する第三者にまとめて免税手続を委託できる「手続委託型___制度」が創設された。",a:"輸出物品販売場"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"商店街やショッピングセンター（SC）などの「特定商業施設」内で外国人観光客などの国内非居住者に対して物品などを販売する場合、___は、その免税手続きを、免税手続カウンターを設置する事業者に代理させることができる。",a:"手続委託型消費税免税店"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"特定商業施設とは、___（商店街）、事業協同組合（同）、大規模小売店舗（SC等）、一棟の建物（テナントビル等）の4つである。",a:"商店街振興組合"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"＜免税手続一括カウンター導入のメリット：商店街内の店舗＞複数店舗での購買分が一括して処理できる（外国人観光客の___が期待できる）。",a:"買い回り"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"平成31年度税制改正において「___制度」が創設され、免税店を経営する事業者が、7か月以内の期間を定めて___（販売場）を設置する場合、届出により免税販売を行うことができるようになった。",a:"臨時免税店"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"中小企業庁「平成28年度商店街インバウンド実態調査」によれば、商店街独自でインバウンド事業を行っているところは___％である。",a:"20.0"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"多くの商店街では、行政機関のほか、___、まちづくり会社・NPO、近隣の商店街など他の機関や団体と連携してインバウンド事業を実施している。",a:"商工会・商工会議所"},
{s:20,u:"1-2 商店街におけるインバウンド需要の取込み",q:"国やさまざまな自治体で、___設置の補助などさまざまなインバウンド事業に補助金が支給されており、実際に4割近い商店街が補助金による財政支援を受けている。",a:"Wi-Fi"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"地方圏を中心として、人口減少に伴う需要の縮小に加え、郊外の大型商業施設との競争や___（EC）の普及などに対応できない多くの商店街は衰退しており、商店街への商業機能に対する期待は相対的に低下している。",a:"電子商取引"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"地域の住民やコミュニティは、身近なところでアクセスしやすい商店街に対し、高齢化・少子化、___・医療に関連したサービスの提供など、商業機能以外の機能を担うことを期待する声が高まっている。",a:"介護"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"地域住民は、地方自治体、地域内の小規模事業者、公的支援機関（___等）に中心的な役割を期待している。",a:"商工会・商工会議所"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"今日、地域の住民は、商店街に対し、「きめ細やかなサービス」や「人とのふれあい」が提供される、気軽にアクセス可能な“___な交流が得られる場”としての機能を期待している。",a:"リアル"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"近年、自動車の運転が困難な高齢者の増加、___世帯の増加、創業希望者・副業・兼業・フリーランスの増加、外国人観光客の増加など、社会構造の変化が続いている。",a:"共働き"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"＜商店街の3分類：複合型＞【定義】商業需要に加えて、住民の多様な___に対応する形で運営する地域コミュニティ支援機能との複合型の商店街。",a:"サービス需要"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"＜商店街の3分類：複合型＞【対応の方向性】商業需要以外の多様な___も取り込む対応。",a:"サービス需要"},
{s:20,u:"1-3 地域コミュニティにおける商店街に期待される新たな役割",q:"＜商店街の3分類：転換型＞【課題】少ない住民にとって必要な商業機能を維持するための域外の事業者（___）との広域的な連携。",a:"アグリゲーター"},

{s:21,u:"本節の要点",q:"地域にとって商店街の活性化は大きな課題となっており、商店街には、___の減少に歯止めをかけるような、商店街の魅力を向上させる取組みが求められる。",a:"来街者"},
{s:21,u:"本節の要点",q:"魅力ある店舗が増えれば、商店街の役割として期待されている「地域住民への身近な___の提供」や「地域の賑わいの創出」が実現できる。",a:"購買機会"},
{s:21,u:"本節の要点",q:"魅力ある店舗が増えれば、商店街の役割として期待されている「地域住民への身近な購買機会の提供」や「___の創出」が実現できる。",a:"地域の賑わい"},
{s:21,u:"本節の要点",q:"国は、地域の活力の再生を総合的、かつ、効果的に推進するために、___を改正した（2018年6月施行）。",a:"地域再生法"},
{s:21,u:"本節の要点",q:"地域再生法の改正点の1つに、___の創設があり、市町村が空き店舗等の活用や商店街の活性化の取組みを重点的に支援することが盛り込まれている。",a:"商店街活性化促進事業"},
{s:21,u:"2-1 空き店舗の解消",q:"チャレンジショップは、___を目指す女性や若手男性などに空き店舗を一定期間、安価で貸し出し、開業準備をサポートする事業である。",a:"新規開業"},
{s:21,u:"2-1 空き店舗の解消",q:"チャレンジショップは、入居者の対象を商売の経験が少なく、はじめから独立店舗での開業が困難な人とし、これをきっかけに___する事業者を創出し、地域に根付く店舗を増やすことで街の賑わいの復活をはかることが目的である。",a:"独立開業"},
{s:21,u:"2-1 空き店舗の解消",q:"＜チャレンジショップ運営のポイント ⅱ）ブース面積、ブース数の決定＞近隣店舗の規模や年商、前面道路の___などを勘案し、あまり過大なものにならないよう留意する。",a:"通行量"},
{s:21,u:"2-1 空き店舗の解消",q:"＜チャレンジショップ運営のポイント ⅱ）ブース面積、ブース数の決定＞___など1つの建物に複数のブースがあるほうが望ましい。",a:"共同店舗"},
{s:21,u:"2-1 空き店舗の解消",q:"アンテナショップとは、地域の___を発信するとともに地元または他の地域の物産（名産品や特産物など）を集めて販売する店舗のことである。",a:"情報"},
{s:21,u:"2-1 空き店舗の解消",q:"アンテナショップは、新商品の___やマーケティングを展開するうえで有効な場を提供してくれる。",a:"試験販売"},
{s:21,u:"2-1 空き店舗の解消",q:"消費者がわざわざその商店街に行きたくなるように動機づけるには、商圏内の消費者ニーズを把握し、ニーズを満たせる___を決定し、商店街全体をその___に沿ってまとめ上げていくことが重要である。",a:"コンセプト"},
{s:21,u:"2-1 空き店舗の解消",q:"商店街のコンセプトに合った業種、店舗を意図的に集めること（___）によって、より商店街全体の魅力を高めることができる。",a:"テナントミックス"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"今日の商店街は、単なる商品・サービスの提供だけでなく、地域住民の生活利便性や高齢者・子育て世代などへの___の提供、介護・医療関連サービスの提供など、地域コミュニティの担い手としての新たな役割が求められている。",a:"福祉"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"今日の商店街は、地域住民の生活利便性や高齢者・子育て世代などへの福祉の提供、介護・医療関連サービスの提供など、___の担い手としての新たな役割が求められている。",a:"地域コミュニティ"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"地域の___や福祉団体、医療機関、NPO団体など、さまざまな組織との連携をはかり、地域コミュニティへの貢献を目指すことにより、地域住民を巻き込んだコミュニティの創出が可能となる。",a:"ボランティア"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"＜地域住民が求める主なコミュニティ機能：子育て支援の充実＞女性の社会進出が進み、___世帯が増える状況の中、安心して子育てができるような仕組みづくりとして、空き店舗などを活用した地域子育て支援拠点の設置や子育てサポート体制の整備などが考えられる。",a:"共働き"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"＜地域住民が求める主なコミュニティ機能：高齢者支援の充実＞商店街が買物支援を兼ねて地域の高齢者を見守り、気がかりな人を発見したときに___に連絡を行うなど、「お年寄りにやさしいまちづくり」に取り組む商店街が台頭している。",a:"地域包括支援センター"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"＜地域住民が求める主なコミュニティ機能：買物弱者対策＞人口減少や___などを背景とした流通機能や交通網の弱体化とともに、食料品などの日常の買物が困難な状況に置かれている。",a:"少子高齢化"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"＜地域住民が求める主なコミュニティ機能＞食料品などの日常の買物が困難な状況に置かれている、いわゆる「___」への対策が必要となっており、商店街としては、___の受け皿としての役割が求められる。",a:"買物弱者"},
{s:21,u:"2-2 コミュニティ機能の強化",q:"＜地域住民が求める主なコミュニティ機能：買物弱者対策＞商店街としては、買物弱者の受け皿として、___や移動販売、買物補助といった対策に取り組むことが求められる。",a:"宅配"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"地域固有の資源を活用した商品・サービスを開発し、その高付加価値化を通して地域イメージを高める「___化」が地域活性化の有効策として注目されている。",a:"地域ブランド"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"経済産業省によれば、「地域のブランド化とは、（Ⅰ）地域発の商品・サービスのブランド化と、（Ⅱ）___のブランド化を結び付けることで…」とある。",a:"地域イメージ"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"経済産業省によれば、地域のブランド化とは、地域発の商品・サービスのブランド化と地域イメージのブランド化を結び付けることで、他にない___を与え、地域外の資金・人材を呼び込むという好循環を生み出すことである。",a:"付加価値"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"経済産業省によれば、地域のブランド化とは、好循環を生み出し、___な地域経済の活性化をはかることである。",a:"持続的"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"その地域に存在する地域資源の付加価値を高め、他地域との___をはかろうとする取組みが地域ブランド化である。",a:"差異化"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"ブランド化においては、___（継続的に顧客を魅了して、自社（自店）の売上を伸ばし続けるために必要不可欠な考え方）を構築し、明確化することが重要である。",a:"ブランドコンセプト"},
{s:21,u:"2-3 地域資源の活用、地域ブランドの構築",q:"街並みや商業集積、産業集積などのさまざまな地域資源を含む___をブランド化する取組みを進めている商店街が注目されている。",a:"地域全体"},
{s:21,u:"2-4 集客活動の強化",q:"「平成30年度商店街実態調査」でも、商店街が実施しているソフト事業として「___」が最も多くなっているが、集客の効果は一時的である。",a:"祭り・イベント"},

// ---- STATE ---------------------------------------------------------
let deck = [], idx = 0, ok = 0, ng = 0, wrong = [];
const $ = id => document.getElementById(id);
const show = (...ids) => { ["start","quiz","result","review"].forEach(i => $(i).classList.add("hidden")); ids.forEach(i => $(i).classList.remove("hidden")); window.scrollTo(0,0); };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


// ---- START ---------------------------------------------------------
(function buildStart(){
  const box = $("secList");
  Object.keys(SECTIONS).forEach(k=>{
    const n = Q.filter(q=>q.s==k).length;
    box.insertAdjacentHTML("beforeend",
      `<label><input type="checkbox" name="sec" value="${k}" checked>${SECTIONS[k]}<span class="cnt">${n}問</span></label>`);
  });
})();

$("btnStart").onclick = () => {
  const secs = [...document.querySelectorAll('input[name=sec]:checked')].map(e=>+e.value);
  if(!secs.length){ alert("節を1つ以上選択してください。"); return; }
  let list = Q.filter(q=>secs.includes(q.s));
  startQuiz(list, $("shuffle").checked);
};

function startQuiz(list, shuffle){
  deck = list.slice();
  if(shuffle){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; } }
  idx=0; ok=0; ng=0; wrong=[];
  show("quiz"); render();
}

// ---- QUIZ ----------------------------------------------------------
function render(){
  const q = deck[idx];
  $("secName").textContent = SECTIONS[q.s];
  $("counter").textContent = `${idx+1} / ${deck.length}`;
  $("barFill").style.width = `${(idx/deck.length)*100}%`;
  $("subName").textContent = q.u;
  $("qText").innerHTML = esc(q.q).replace(/___/g, `<span class="blank">${esc(q.a)}</span>`);
  $("ansBox").classList.add("hidden");
  $("judgeRow").classList.add("hidden");
  $("btnReveal").classList.remove("hidden");
  $("okCnt").textContent = ok; $("ngCnt").textContent = ng;
}

$("btnReveal").onclick = () => {
  document.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
  $("ansText").textContent = deck[idx].a;
  $("ansBox").classList.remove("hidden");
  $("btnReveal").classList.add("hidden");
  $("judgeRow").classList.remove("hidden");
};
$("btnOk").onclick = () => judge(true);
$("btnNg").onclick = () => judge(false);
function judge(correct){
  if(correct){ ok++; removeWeak(deck[idx]); }
  else { ng++; wrong.push(deck[idx]); addWeak(deck[idx]); }
  idx++;
  if(idx >= deck.length) finish(); else render();
}
$("btnQuit").onclick = () => { if(confirm("中断してトップに戻りますか？")) show("start"); };


// ---- RESULT --------------------------------------------------------
function finish(){
  $("rOk").textContent = ok; $("rTotal").textContent = deck.length;
  $("rRate").textContent = `正答率 ${Math.round(ok/deck.length*100)}%`;
  const wb = $("wrongBox");
  if(wrong.length){
    wb.innerHTML = `<h2>間違えた問題（${wrong.length}問）</h2><ol>` +
      wrong.map(q=>`<li>${esc(q.q).replace(/___/g,"【　　】")}<br><b>→ ${esc(q.a)}</b></li>`).join("") + `</ol>`;
    $("btnRetryWrong").classList.remove("hidden");
  } else {
    wb.innerHTML = `<p class="lead" style="text-align:center;margin-top:16px">全問正解。</p>`;
    $("btnRetryWrong").classList.add("hidden");
  }
  $("rWeakCnt").textContent = weak.length;
  refreshWeak();
  show("result");
}
$("btnRetryWrong").onclick = () => startQuiz(wrong, false);
$("btnHome").onclick = () => show("start");


// ---- WEAK LIST（間違えた問題の蓄積）--------------------------------
const WKEY = "hanbaishi_weak_v1";
const qid = q => q.s + "|" + q.q;
let weak = (function(){ try{ return JSON.parse(localStorage.getItem(WKEY)) || []; }catch(e){ return []; } })();
function saveWeak(){ try{ localStorage.setItem(WKEY, JSON.stringify(weak)); }catch(e){} }
function addWeak(q){ const id = qid(q); if(!weak.includes(id)){ weak.push(id); saveWeak(); } }
function removeWeak(q){ const i = weak.indexOf(qid(q)); if(i >= 0){ weak.splice(i,1); saveWeak(); } }
const weakQs = () => Q.filter(q => weak.includes(qid(q)));

function refreshWeak(){
  const n = weakQs().length;
  $("weakCnt").textContent = n;
  $("weakCard").classList.toggle("hidden", n === 0);
  $("rWeakCnt").textContent = n;
}

// ---- REVIEW（苦手問題集ページ）-------------------------------------
function renderReview(){
  const list = weakQs();
  const showAns = $("rvShowAns").checked;
  $("rvCnt").textContent = `${list.length} 問`;
  if(!list.length){
    $("rvList").innerHTML = `<p class="rv-empty">苦手リストは空です。<br>出題中に「× 不正解」を押した問題が、ここに自動でたまります。</p>`;
    $("btnRvQuiz").classList.add("hidden");
    $("btnRvPrint").classList.add("hidden");
    $("btnRvClear").classList.add("hidden");
  } else {
    $("rvList").innerHTML = list.map((q,i) =>
      `<div class="rv-item">
         <div class="rv-meta">${esc(SECTIONS[q.s])}／${esc(q.u)}</div>
         <div class="rv-q">${esc(q.q).replace(/___/g,"【　　】")}</div>
         ${showAns ? `<div class="rv-a">→ ${esc(q.a)}</div>` : ``}
         <button class="rv-del" data-i="${i}">覚えた（リストから外す）</button>
       </div>`).join("");
    $("btnRvQuiz").classList.remove("hidden");
    $("btnRvPrint").classList.remove("hidden");
    $("btnRvClear").classList.remove("hidden");
    $("rvList").querySelectorAll(".rv-del").forEach(b => {
      b.onclick = () => { removeWeak(list[+b.dataset.i]); renderReview(); refreshWeak(); };
    });
  }
}
function openReview(){ renderReview(); show("review"); }

$("btnWeakReview").onclick = openReview;
$("btnResultReview").onclick = openReview;
$("btnWeakQuiz").onclick = () => {
  const list = weakQs();
  if(!list.length){ alert("苦手リストは空です。"); return; }
  startQuiz(list, $("shuffle").checked);
};
$("btnRvQuiz").onclick = () => startQuiz(weakQs(), false);
$("rvShowAns").onchange = renderReview;
$("btnRvPrint").onclick = () => window.print();
$("btnRvClear").onclick = () => {
  if(confirm(`苦手リスト（${weakQs().length}問）をすべて消去しますか？`)){
    weak = []; saveWeak(); renderReview(); refreshWeak();
  }
};
$("btnRvHome").onclick = () => show("start");

refreshWeak();
</script>
</body>
