<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>販売士1級 1問1答 ― マーケティング</title>
<style>
  :root{
    --ink:#1b2440;
    --ink-soft:#4a5473;
    --paper:#fafaf7;
    --line:#d9dbe3;
    --navy:#243b6b;
    --blank:#fff3bf;
    --blank-line:#e0a800;
    --ok:#1f7a4d;
    --ng:#b83227;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
  header h1{font-size:15px;font-weight:600;color:var(--navy);letter-spacing:.02em}
  header p{font-size:12px;color:var(--ink-soft);margin-top:4px}

  /* start */
  .sec-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .sec-list label{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    background:#fff;border-radius:var(--radius);font-size:14px;cursor:pointer
  }
  .sec-list label input{width:18px;height:18px;accent-color:var(--navy)}
  .sec-list .cnt{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .opt{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 18px;padding-left:2px}
  .opt input{width:18px;height:18px;accent-color:var(--navy)}
  .lead{font-size:13px;color:var(--ink-soft);line-height:1.6}

  /* buttons */
  button{
    font:inherit;border:0;cursor:pointer;border-radius:var(--radius);padding:14px 16px;font-size:15px;
    font-weight:600;transition:transform .08s ease, opacity .15s ease
  }
  button:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid #f0c040;outline-offset:2px}
  .btn-main{background:var(--navy);color:#fff;width:100%}
  .btn-sub{background:#fff;color:var(--navy);border:1px solid var(--navy);width:100%}
  .btn-ok{background:var(--ok);color:#fff;flex:1}
  .btn-ng{background:var(--ng);color:#fff;flex:1}
  .row{display:flex;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}

  /* quiz */
  .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .meta .num{font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:var(--navy);transition:width .25s ease}
  .sub{font-size:12px;color:var(--navy);font-weight:600;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--navy)}
  .q{
    font-size:17px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;min-height:140px
  }
  .blank{
    display:inline-block;min-width:4.5em;padding:0 .4em;margin:0 .1em;
    background:var(--blank);border-bottom:2px solid var(--blank-line);
    color:transparent;text-align:center;border-radius:3px;line-height:1.6;vertical-align:baseline;
    user-select:none
  }
  .blank.show{color:var(--ink);font-weight:700;background:#fff8dc;min-width:0}
  .ans{
    margin-top:14px;padding:14px 16px;border-radius:var(--radius);background:#eef1f8;
    font-size:14px;color:var(--ink-soft);line-height:1.6
  }
  .ans strong{display:block;font-size:19px;color:var(--navy);margin-top:2px}
  .hidden{display:none}
  .score-line{font-size:13px;color:var(--ink-soft);margin-top:14px;display:flex;gap:14px}
  .score-line b{color:var(--ink)}

  /* result */
  .result{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center}
  .result .big{font-size:48px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
  .result .big small{font-size:18px;color:var(--ink-soft);font-weight:500}
  .result p{font-size:14px;color:var(--ink-soft);margin-top:8px}
  .wrong{margin-top:20px}
  .wrong h2{font-size:14px;color:var(--ng);margin-bottom:8px}
  .wrong ol{padding-left:20px;font-size:13px;line-height:1.6}
  .wrong li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .wrong li b{color:var(--navy)}
  /* weak list */
  .weak-card{background:#fff;border:1px solid var(--ng);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .weak-head{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ng);font-weight:600;margin-bottom:10px}
  .weak-head b{font-size:22px;font-variant-numeric:tabular-nums}
  .weak-card .row button{padding:11px 10px;font-size:14px}

  /* review */
  .rv-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .rv-meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
  .rv-q{font-size:15px;line-height:1.85}
  .rv-a{margin-top:8px;font-size:14px;color:var(--navy);font-weight:700}
  .rv-del{background:#fff;color:var(--ink-soft);border:1px solid var(--line);font-size:12px;font-weight:500;padding:6px 10px;margin-top:10px;width:auto}
  .rv-empty{font-size:14px;color:var(--ink-soft);line-height:1.8;text-align:center;padding:30px 0}
  #printSheet h2{font-size:18px;color:var(--navy);margin-bottom:14px}
  #printSheet .print-note{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
  #printSheet .answer-key{margin-top:24px}
  #printSheet .answer-key h2{margin-bottom:10px}
  #printSheet .answer-key ol{padding-left:24px;font-size:14px;line-height:1.8}
  @media print{
    body{background:#fff}
    .app{max-width:none;padding:0}
    .app > section,.app > header{display:none!important}
    #printSheet{display:block!important}
    #printSheet .rv-item{display:block!important;break-inside:avoid;page-break-inside:avoid;border:0;border-bottom:1px dashed #bbb;border-radius:0;padding:8px 0}
    #printSheet .answer-key{break-before:page;page-break-before:always}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* in-page dialog */
  .dlg-bg{position:fixed;inset:0;background:rgba(20,28,50,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000}
  .dlg{background:#fff;border-radius:var(--radius);max-width:360px;width:100%;padding:20px 18px 16px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
  .dlg p{font-size:14px;line-height:1.7;white-space:pre-wrap;margin-bottom:16px}
  .dlg .row{display:flex;gap:10px}
  .dlg .row button{flex:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>販売士1級 1問1答</h1>
    <p>マーケティング（穴埋め）</p>
  </header>

  <!-- START -->
  <section id="start">
    <p class="lead">出題する節を選び、開始。空欄を頭の中で答えてから「答えを見る」→ 自己採点します。</p>
    <div class="weak-card hidden" id="weakCard">
      <div class="weak-head">苦手リスト <b id="weakCnt">0</b> 問</div>
      <div class="row">
        <button class="btn-sub" id="btnWeakReview">問題集を見る</button>
        <button class="btn-main" id="btnWeakQuiz">苦手だけ出題</button>
      </div>
    </div>
    <div class="sec-list" id="secList"></div>
    <label class="opt"><input type="checkbox" id="shuffle"> 出題順をシャッフルする（オフ＝教科書順）</label>
    <button class="btn-main" id="btnStart">開始する</button>
    <button class="btn-sub hidden" id="btnResume" style="margin-top:10px">前回の続きから再開</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="meta"><span id="secName"></span><span class="num" id="counter"></span></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="sub" id="subName"></div>
    <div class="q" id="qText"></div>
    <div class="ans hidden" id="ansBox">正解<strong id="ansText"></strong></div>
    <div class="score-line"><span>正解 <b id="okCnt">0</b></span><span>不正解 <b id="ngCnt">0</b></span></div>
    <div class="stack">
      <button class="btn-main" id="btnReveal">答えを見る</button>
      <div class="row hidden" id="judgeRow">
        <button class="btn-ng" id="btnNg">× 不正解</button>
        <button class="btn-ok" id="btnOk">○ 正解</button>
      </div>
      <button class="btn-sub" id="btnQuit">中断してトップへ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="result">
      <div class="big"><span id="rOk">0</span><small> / <span id="rTotal">0</span></small></div>
      <p id="rRate"></p>
    </div>
    <div class="wrong" id="wrongBox"></div>
    <div class="stack">
      <button class="btn-main hidden" id="btnRetryWrong">間違えた問題だけ再挑戦</button>
      <button class="btn-sub hidden" id="btnPrintWrong">今回間違えた問題だけ印刷／PDF</button>
      <button class="btn-sub" id="btnResultReview">苦手問題集を見る（<span id="rWeakCnt">0</span>問）</button>
      <button class="btn-sub" id="btnHome">トップへ戻る</button>
    </div>
  </section>
  <!-- REVIEW -->
  <section id="review" class="hidden">
    <div class="meta"><span>苦手問題集</span><span class="num" id="rvCnt"></span></div>
    <label class="opt"><input type="checkbox" id="rvShowAns" checked> 正解を表示する</label>
    <div id="rvList"></div>
    <div class="stack">
      <button class="btn-main" id="btnRvQuiz">この問題集で出題</button>
      <button class="btn-sub" id="btnRvPrint">印刷／PDFで保存</button>
      <button class="btn-sub" id="btnRvClear">苦手リストを全消去</button>
      <button class="btn-sub" id="btnRvHome">トップへ戻る</button>
    </div>
  </section>

  <!-- PRINT ONLY -->
  <section id="printSheet" class="hidden"></section>
</div>

<script>
function uiDialog(msg, withCancel){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="dlg-bg";
    bg.innerHTML='<div class="dlg"><p></p><div class="row">'+(withCancel?'<button class="btn-sub" data-v="0">キャンセル</button>':'')+'<button class="btn-main" data-v="1">OK</button></div></div>';
    bg.querySelector("p").textContent=msg;
    bg.querySelectorAll("button").forEach(b=>b.onclick=()=>{bg.remove();res(b.dataset.v==="1");});
    document.body.appendChild(bg);
  });
}
const uiConfirm = m => uiDialog(m, true);
const uiAlert = m => uiDialog(m, false);

// ---- DATA ----------------------------------------------------------
// s: 節, u: 小見出し, q: 問題文（___ が空欄）, a: 答え
const SECTIONS = {
  1:"第1章 第1節 マーケティング概論",
  2:"第1章 第2節 リテールマーケティング戦略の概論",
  3:"第1章 第3節 リテールマーケティングの課題（STP）",
  4:"第2章 第1節 マーケットセグメンテーションへのライフスタイルアプローチ",
  5:"第2章 第2節 ライフスタイルセグメンテーションの手順と分析",
  6:"第2章 第3節 ライフスタイルアソートメントの実務",
  7:"第3章 第1節 小売業におけるCRMの実践",
  8:"第3章 第2節 主要なリテールマーケティングのタイプ",
  9:"第3章 第3節 コンビニエンスストアにみる革新的マーケティングシステム",
  10:"第4章 第1節 小売業の商圏開発",
  11:"第4章 第2節 商圏形成の実際",
  12:"第4章 第3節 競争と商圏シェア",
  13:"第5章 リージョナルプロモーションの体系",
  14:"第5章 第1節 インストアプロモーション（Push戦略）の実際",
  15:"第5章 第2節 インストアマーチャンダイジング（Put戦略）の実際",
  16:"第5章 第3節 ビジュアルプレゼンテーション（VP）の実際",
  17:"第5章 第4節 クロスマーチャンダイジングとPOP広告の実際",
  18:"第5章 第5節 インバウンドに対するプロモーションの実践"
};
const Q = [
// ===== 第1章 第1節 =====
{s:1,u:"1-1 マーケティングの基本的概念",q:"マーケティングの基本的概念とは、小売業が対___を展開する場合の理念または店舗経営の基本的な考え方や姿勢のことである。",a:"市場活動"},
{s:1,u:"1-1 小売業におけるマーケティングの骨子",q:"小売業は___を追求するが、それは利己主義であってはならない。",a:"利益"},
{s:1,u:"1-1 小売業におけるマーケティングの骨子",q:"短期的な視点からだけでなく、___視点に立ち、小売業の維持・発展を追求する。",a:"中・長期的"},
{s:1,u:"1-1 小売業におけるマーケティングの骨子",q:"小売業はマーケティングの骨子を集約し、___（企業活動の方向性や目標を顧客の欲求・ニーズを満たすこととする、マーケティングの基本的な考え方）を重視してマーケティングの理念を確立する。",a:"顧客志向"},
{s:1,u:"1-2 マーケティングの指導原理",q:"5つの指導原理：___の原理…需要を固定的なものと考えず、小売業の側からの積極的な働きかけによっても拡大し、創造を得る。",a:"需要創造"},
{s:1,u:"1-2 マーケティングの指導原理",q:"5つの指導原理：___の原理…価格以外の他の手段で購買意欲を喚起し、競争条件を有利にする。",a:"非価格競争"},
{s:1,u:"1-2 マーケティングの指導原理",q:"5つの指導原理：___の原理…販売活動を前面に押し出し、中枢に据えて諸活動を統合させる。",a:"販売中枢性"},
{s:1,u:"1-2 マーケティングの指導原理",q:"5つの指導原理：___の原理…小売業が主体性をもって、対市場活動を行う。",a:"主体性維持"},
{s:1,u:"1-2 マーケティングの指導原理",q:"5つの指導原理：___の原理…顧客志向の理念を実現するため、科学的な調査分析の技術を駆使して市場の実態を正確に把握し、マーケティング活動を遂行する。",a:"科学的市場認識"},
{s:1,u:"1-3 生活者の欲求と行動",q:"マーケティングの実施においては、消費者を___として捉えることが肝要であり、リテールマーケティングの担当者は、市場（商圏）を把握する場合、その構成員である特定の___に注目する必要がある。",a:"生活者"},
{s:1,u:"1-3 生活者の欲求と行動",q:"P.コトラーは、消費者行動の特性を把握する場合には、「___」と呼ばれる質問（誰が買うか、何を買うか、なぜ買うか、どんな方法で買うか）をすることによって自己の市場を明確にすることが可能としている。",a:"4つのO"},
{s:1,u:"1-3 生活者の欲求と行動",q:"P.コトラーの「4つのO」と呼ばれる質問は、誰が買うか、何を買うか、なぜ買うか、___買うか、である。",a:"どんな方法で"},
{s:1,u:"1-3 生活者の欲求と行動",q:"小売業は、いわゆる生活者志向を基盤に置いて、___を起点とした狭義的なマーケティングを展開していく。",a:"売場"},
{s:1,u:"1-3 生活者の欲求と行動",q:"人間の行動を促進するものに___があり、マーケティングの分野でも注目され、動機調査として活用されている。",a:"動機"},
{s:1,u:"1-3 生活者の欲求と行動",q:"人間の行動を促進するものに動機があり、マーケティングの分野でも注目され、___として活用されている。",a:"動機調査（モチベーションリサーチ）"},
{s:1,u:"1-3 生活者の欲求と行動",q:"E.J.マッカーシーは、購買行動を起こさせる動機を情緒的動機と___動機に分類している。",a:"合理的"},
{s:1,u:"1-3 生活者の欲求と行動",q:"購買動機を発生させる主原因は___であり、これが顕在化したものがニーズといえる。",a:"欲求"},
{s:1,u:"1-3 生活者の欲求と行動",q:"購買動機を発生させる主原因は欲求であり、これが顕在化したものが___といえる。",a:"ニーズ"},
{s:1,u:"1-4 生活者行動の分析",q:"生活者の購買プロセス：ⅰ）欲求の知覚→ⅱ）問題の認識→ⅲ）___の探索→ⅳ）評価・行動→ⅴ）購買の決定→ⅵ）消費・使用→ⅶ）購入後の評価",a:"情報"},
{s:1,u:"1-4 生活者行動の分析",q:"購買プロセスⅶ）購入後の評価…購入後の評価が___されて次回の購買行動に影響を与える。",a:"フィードバック"},
{s:1,u:"1-4 ライフスタイルの分析",q:"人口統計的要因（___）…年齢・性別・所得・家族構成・学歴・住居地域などで、ほかの要因と比較してターゲットへの到達可能性が高い。",a:"デモグラフィック要因"},
{s:1,u:"1-4 ライフスタイルの分析",q:"社会心理学的要因（___）…生活者の日常の活動や興味・関心によって変化する価値観の差異などで、ほかの要因と比較してターゲットへの到達可能性が低い場合が多い。",a:"サイコグラフィック要因"},
{s:1,u:"1-4 ライフスタイルの分析",q:"生活者の行動様式に現れるタイプやパターンが___である。",a:"ライフスタイル"},
{s:1,u:"1-4 ライフスタイルの分析",q:"今日では、マーケティングサイエンスの進歩により、多変量解析などを行い、複数の___要因を分析することが可能になっている。",a:"質的"},
// ===== 第1章 第2節 =====
{s:2,u:"2-1 リテールマーケティング戦略の体系",q:"リテールマーケティング戦略は、マーケティング部門に限定された戦略ではなく、自社の目的を達成するための___な戦略として実施される。",a:"中核的"},
{s:2,u:"2-1 経営理念の確立",q:"経営理念は、トップをはじめとする___のガイドラインであり、組織に対する従業員の求心力を高め、一体的な企業行動を生み出すうえで不可欠な概念である。",a:"意思決定"},
{s:2,u:"2-1 ドメインの設定",q:"ドメイン（事業領域）の設定とは、___の視点から事業内容を明らかにしようとすることである。",a:"顧客志向"},
{s:2,u:"2-1 市場機会の探索と創出",q:"企業の外部環境は、競争構造や流通構造、関連法規、景気、国際関係、行政、文化などの___と、資源や自然などの生態的環境に大別される。",a:"社会・経済的環境"},
{s:2,u:"2-1 市場機会の探索と創出",q:"企業の外部環境は、社会・経済的環境と、資源や自然などの___に大別される。",a:"生態的環境"},
{s:2,u:"2-1 市場機会の探索と創出",q:"マーケティング環境の外部環境と内部資源を分析する手法として___がある。",a:"SWOT分析"},
{s:2,u:"2-1 マーケティング目標の決定",q:"目標は、実施過程での計画のチェック・アンド・バランスのための基準であり、計画終了時の業績評価と___の基準となる。",a:"差異分析"},
{s:2,u:"2-1 マーケティング目標の決定",q:"目標は実現可能なものでなければならず、組織の活性化をはかる___の要素を持つことも必要である。",a:"動機づけ"},

{s:2,u:"2-1 実施～コントロール",q:"P.コトラーのマーケティングコントロール：___コントロール…商品、販売地域、顧客層、流通チャネルなどの___を定期的に分析評価する。",a:"収益性"},

{s:2,u:"2-1 実施～コントロール",q:"戦略コントロールは、有効性再評価と___からなる。",a:"マーケティング監査"},

{s:2,u:"2-2 市場細分化戦略",q:"小売業は、ねらうべき市場（___）が明らかにされて初めて、それに合わせたマーケティングミックスの構築と標的に向けての効果的なアプローチが可能になる。",a:"標的市場"},

{s:2,u:"2-2 市場細分化の前提条件",q:"P.コトラーの市場細分化の前提条件：___（到達可能性）…選択したセグメントに対してマーケティング努力を集中できる可能性が高いこと。",a:"接近可能性"},
{s:2,u:"2-2 市場細分化の前提条件",q:"P.コトラーの市場細分化の前提条件：___（維持可能性）…独自のマーケティング活動を特別に開発するだけの価値をセグメントが持っていること。",a:"実質性"},
{s:2,u:"2-2 市場細分化の前提条件",q:"P.コトラーの市場細分化の前提条件：___…得られたセグメントを効果的に引きつけられる魅力的なプログラムが実行可能かどうかを判断すること。",a:"実行可能性"},
{s:2,u:"2-2 市場細分化の基準",q:"P.コトラーの市場細分化の基準：___…地域、郡の規模、都市または標準大都市統計地域、人口密度、気候",a:"地理的変数"},
{s:2,u:"2-2 市場細分化の基準",q:"P.コトラーの市場細分化の基準：___…社会階層、ライフスタイル、パーソナリティ",a:"サイコグラフィック変数"},
{s:2,u:"2-2 市場細分化の基準",q:"P.コトラーの市場細分化の基準：___…購買状況、ベネフィット、使用者タイプ、使用率、ロイヤリティ・タイプなど",a:"行動変数"},
{s:2,u:"2-2 市場細分化の基準",q:"P.コトラーの市場細分化の基準：___…年齢、性別、世帯規模、家族のライフサイクル、所得、職業、教育、人種、国籍など",a:"人口統計的変数"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"「4P理論」を提唱した___は、円の中心に標的である顧客を置き、一番外側に環境・制約要因を配置し、顧客を直接囲む円にマーケティングミックスの構成要素である「4P」を配置した。",a:"E.J.マッカーシー"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"4P：___（製品）",a:"Product"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"4P：___（価格）",a:"Price"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"4P：___（販売促進）",a:"Promotion"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"4P：___（場所）",a:"Place"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"4Pの操作にあたって、標的市場のニーズとウォンツに応え、標的とする顧客の___を実現することを究極の目標とする。",a:"満足"},
{s:2,u:"2-2 マーケティングミックスの構築",q:"4Pの企画と操作によって、競争企業のマーケティング手段とは異なる自社の___を確立することに努める。",a:"独創的優位"},
{s:2,u:"2-3 環境分析手法としてのSWOT分析",q:"企業には、自社の資源・能力と競争状況との関係から___（S）と弱み（W）がある。",a:"強み"},
{s:2,u:"2-3 環境分析手法としてのSWOT分析",q:"企業には、自社の資源・能力と競争状況との関係から強み（S）と___（W）がある。",a:"弱み"},
{s:2,u:"2-3 環境分析手法としてのSWOT分析",q:"企業を取り巻く環境状況と競争状況との関係から___（O）と脅威（T）がある。",a:"機会"},
{s:2,u:"2-3 環境分析手法としてのSWOT分析",q:"企業を取り巻く環境状況と競争状況との関係から機会（O）と___（T）がある。",a:"脅威"},
{s:2,u:"2-3 環境分析手法としてのSWOT分析",q:"SWOTの4つを徹底的に分析し、仮説を設定し、これらを統合する戦略的思考が行われて___が策定され、そのうえで市場機会の探索と創出が行われる。",a:"経営戦略"},
{s:2,u:"2-3 環境分析手法としてのSWOT分析",q:"SWOTの4つを分析して経営戦略が策定され、そのうえで___の探索と創出が行われる。",a:"市場機会"},

{s:3,u:"3 リテールマーケティングの課題（STP）",q:"市場において独自優位性を発揮するマーケティング戦略を考えるためのフレームワークとして活用される___は、セグメンテーション、ターゲティング、ポジショニングの3つの頭文字を取って名づけられた分析手法である。",a:"STP分析"},
{s:3,u:"3-1 セグメンテーション",q:"セグメンテーションとは、一定の基準にもとづいて、同じようなニーズや性質を持った集まりごとに市場を___することである。",a:"細分化"},
{s:3,u:"3-1 セグメンテーション",q:"顧客のニーズが多様化、個性化した今日、従来のマスマーケティングに代わって、一人ひとりの顧客を対象とする___が重要となってきている。",a:"パーソナルマーケティング"},
{s:3,u:"3-1 セグメンテーション",q:"___…ある特定市場を複数のセグメントからなる集合体として捉え、それぞれのセグメントに向けてマーケティング活動を行うもの。",a:"セグメントマーケティング"},
{s:3,u:"3-1 セグメンテーション",q:"___…市場において明確なサブニーズを有した小さな特定部分に向けてマーケティング活動を行うもので、セグメントマーケティングよりも顧客ニーズを的確に満たしている。",a:"ニッチマーケティング"},
{s:3,u:"3-1 セグメンテーション",q:"___…個の単位で顧客をねらったマーケティング活動であり、情報通信技術の急速な進展によりマスの効率を生かしながら個別ニーズに応じた対応が可能である。",a:"カスタマイズドマーケティング"},
{s:3,u:"3-2 ターゲティング",q:"ターゲティングとは、___を設定することであり、細分化された下位市場を評価して、どのセグメントをねらうのかについての意思決定である。",a:"標的市場"},
{s:3,u:"3-2 ターゲティング",q:"___マーケティング…市場セグメント間の違いを無視して、共通の商品やサービスを提供していく考え方で、ニーズの共通点に注目するもの。",a:"無差別型"},
{s:3,u:"3-2 ターゲティング",q:"___マーケティング…複数の市場セグメントを取り上げ、それぞれに対して異なる商品やサービスを提供する考え方であり、経営資源を各セグメントに振り分ける必要がある。",a:"差別化型"},
{s:3,u:"3-2 ターゲティング",q:"___マーケティング…1つ、もしくは少数の市場セグメントに注目して、そこに経営資源を集中させる考え方であり、当該市場から高い評価が得られ、高いシェアを獲得できる。",a:"集中型"},
{s:3,u:"3-3 ポジショニング",q:"ポジショニングとは、ターゲティングした市場でどのような___を発揮するかということであり、見込み客のマインド内に商品などをどのように位置づけたらよいかという重要な課題である。",a:"価値"},
{s:3,u:"3-3 ポジショニング",q:"___…顧客側からみて、特徴のない希薄な商品構成や店舗イメージにとどまってしまうミス。",a:"アンダーポジショニング"},
{s:3,u:"3-3 ポジショニング",q:"___…顧客側からみて、ストアブランドのポジションがあまりにも狭く捉えられてしまうミス。",a:"オーバーポジショニング"},
{s:3,u:"3-3 ポジショニング",q:"___…顧客側からみて、ストアブランドのポジションが固定せず、理解困難な状態へと導いてしまうミス。",a:"混乱したポジショニング"},

{s:4,u:"1-1 マーケットセグメンテーション",q:"マーケットセグメンテーション基準の分類枠組みでは、測定指標を「___」と「推測的」に分けている。",a:"客観的"},
{s:4,u:"1-1 マーケットセグメンテーション",q:"マーケットセグメンテーション基準の分類枠組みでは、測定指標を「客観的」と「___」に分けている。",a:"推測的"},

{s:4,u:"1-2 行動ライフスタイルアプローチ",q:"行動ライフスタイルアプローチで評価すべき点ⅰ）___…消費主体を、複数の商品を相互に関連させ、組み合わせて、1つのライフスタイルを形成する主体として把握するという視点。",a:"ライフスタイルアソートメント"},

{s:5,u:"2-1 ライフスタイルセグメンテーションの手順",q:"第2ステップ（調査設計）：戦略変数の選定（___などを実施）",a:"グループインタビュー"},

{s:5,u:"2-1 ライフスタイルセグメンテーションの手順",q:"第4ステップ（単純集計・___）…収集したデータをもとにサンプル全体の度数分布を明らかにするとともに、特定2変数間の関係を調べる。",a:"クロス集計"},

{s:5,u:"2-1 ライフスタイルセグメンテーションの手順",q:"第7ステップ（グループ別クロス分析）…グループ別分類と、「___変数」「人口統計的変数および社会心理的変数」「商品の購買行動、使用行動変数」とのクロス集計を行う。",a:"ライフスタイル"},

{s:6,u:"3-1 ライフスタイルアソートメントの定義",q:"ライフスタイルアソートメントとは「顧客のさまざまな___を想定し、それに必要な商品を選別して取りそろえる。そして、それらを購買促進上のテーマ設定によって組み合わせて、1つの売場にとりまとめて提案するトータルな需要創造活動である。」",a:"生活シーン"},
{s:6,u:"3-1 ライフスタイルアソートメントの定義",q:"ライフスタイルアソートメントとは、顧客の生活シーンを想定し、…1つの売場にとりまとめて提案するトータルな___活動である。",a:"需要創造"},
{s:6,u:"3-1 ライフスタイルアソートメントの定義",q:"ライフスタイルアソートメントは、多様な生活の幅を選択できるような売場づくりを目指すリテールマーケティングの一手法であり、そのための主品種・主品目と関連品種・関連品目の___諸活動である。",a:"統合・編集"},
{s:6,u:"3-1 ライフスタイルアソートメントの定義",q:"ライフスタイルアソートメントに対し、ある生活局面を高級化、ブランド化するのは___である。",a:"ライフスタイルセグメント"},
{s:6,u:"3-1 ライフスタイルアソートメントの定義",q:"伸びている需要を特定の統一した定番スタイルに押し込めるのは、単なる___である。",a:"マーチャンダイジング"},
{s:6,u:"3-2 ライフスタイルアソートメントの実務",q:"小売業は一般に___にもとづく部門別仕入体制をとっている。",a:"生産体系"},
{s:6,u:"3-2 ライフスタイルアソートメントの実務",q:"生産体系別の商品カテゴリーを基軸とすると、生活シーンを基軸とした“需要”カテゴリーが欠落し、___提供型の売場はつくれなくなる。",a:"付加価値"},
{s:6,u:"3-2 スペース生産性の向上策",q:"ライフスタイルアソートメントの実施においては、定番というよりも、主品種に対する___として組み合わせるカテゴリーに位置づけることで、カテゴリー全体のスペース生産性が高まる。",a:"従属品種"},
{s:6,u:"3-2 スペース生産性の向上策",q:"主品種に対する従属品種として組み合わせるカテゴリーに位置づけることで、カテゴリー全体の___が高まる。",a:"スペース生産性"},
{s:6,u:"3-2 スペース生産性の向上策",q:"雑多、かつ、過剰な在庫を抱える棚割を改善するには、___（売場面積当たりの販売効率管理）をベースとしたライフスタイルアソートメントに取り組む必要がある。",a:"スペースマネジメント"},
{s:6,u:"3-2 ライフスタイルアソートメントの展開フロー",q:"展開フローⅰ）需要に合わせた市場標的の設定…「誰の、どのような悩みや欲求」という___を含めた市場性に着眼する。",a:"潜在需要"},
{s:6,u:"3-2 ライフスタイルアソートメントの展開フロー",q:"商品分類としての品種と品目の間に潜在する顧客のニーズやウォンツを顕在化する役割を担っているのが、需要面から捉える___である。",a:"サブカテゴリー"},
{s:6,u:"3-2 ライフスタイルアソートメントの展開フロー",q:"主に定番商品において同時購買される確率の高い商品を近くに陳列し、客単価を向上させる手法は___であり、ライフスタイルアソートメントではない。",a:"クロスマーチャンダイジング"},

{s:7,u:"1-1 CRMとは",q:"CRM（___・マネジメント）とは、顧客一人ひとりの情報の活用によって来店する顧客の利便性と満足度を高め、長期間にわたって顧客との関係を維持することである。",a:"カスタマーリレーションシップ"},
{s:7,u:"1-1 CRMとは",q:"CRMとは、顧客の利便性と満足度を高め、___を築きながら長期間にわたって顧客との関係を維持することである。",a:"友好関係"},
{s:7,u:"1-1 CRMとは",q:"CRMは、小売業にとっての___を最大化する経営戦略といえる。（___＝年間購買額×収益率×継続年数）",a:"顧客生涯価値（LTV）"},
{s:7,u:"1-1 CRMとは",q:"CRMは、顧客の自店に対する___を形成することが求められる。",a:"ロイヤルティ"},
{s:7,u:"1-1 CRMとは",q:"CRMは、通常、___のイニシアティブのもとに進めていくことが重要である。",a:"経営トップ"},
{s:7,u:"1-1 顧客維持の重要性",q:"新規に顧客を獲得することは、___の維持に比べてはるかに高コストである。",a:"既存顧客"},
{s:7,u:"1-1 顧客維持の重要性",q:"すべての顧客が一様に利益をもたらすわけではなく、一部の顧客はほかの顧客よりもはるかに___が高かったり、またその逆もあったりする。",a:"収益性"},
{s:7,u:"1-1 CRMのねらい",q:"CRMのねらい：将来___となりそうな予備軍を発見して獲得する。",a:"優良顧客"},
{s:7,u:"1-1 CRMのねらい",q:"CRMの実践において、既存の優良顧客の分析を行う段階で___の手法が利用される。",a:"データマイニング"},
{s:7,u:"1-1 顧客維持のための取組み",q:"顧客1人当たりの買上金額を向上させるためには、データマイニングを活用した___により、併売傾向が強くみられる商品を組み合わせて提案することで、より確実な効果が期待できる。",a:"バスケット分析"},
{s:7,u:"1-1 顧客維持のための取組み",q:"小売業は、顧客の離反阻止対策として、会員カードやポイントカード保持者に、購買金額に応じた特典を付与する取組みとして___を行っている。",a:"FSP"},
{s:7,u:"1-1 CRMの本質",q:"CRMは、___に蓄積された基本属性や過去の購買実績に応じて顧客を識別（セグメンテーション）することで、顧客と商品・情報の最適化を行う戦略概念である。",a:"顧客データベース"},
{s:7,u:"1-1 CRMの本質",q:"CRMは、顧客データベースに蓄積された基本属性や過去の購買実績に応じて顧客を___（セグメンテーション）することで、顧客と商品・情報の最適化を行う戦略概念である。",a:"識別"},
{s:7,u:"1-1 CRMの本質",q:"CRMは、マーケティングにかかわる投資を質・量の両面から最適化することで、コストを削減すると同時に、収益を増大する総合的___といえる。",a:"顧客戦略"},
{s:7,u:"1-1 ターゲットの絞込み",q:"CRMを成功させるためには、対象とする顧客を誰にするかという___の設定が必要である。",a:"ターゲット"},
{s:7,u:"1-1 ターゲットの絞込み",q:"通常、___特性の顧客情報（年齢・性別・職業・所得など）や、最新購買日・購買頻度・累計購買金額の観点から購買履歴を分析して顧客を絞り込む。",a:"デモグラフィック"},
{s:7,u:"1-1 ターゲットの絞込み",q:"最新購買日・購買頻度・累計購買金額の3つの観点から顧客をランクづけする手法が___である。",a:"RFM分析"},
{s:7,u:"1-1 ターゲットの絞込み",q:"ライフスタイル、消費スタイル、嗜好、購買行動といった個人的な志向によって規定される心理学的特性の分析方法（___分析）も有効であるが、デモグラフィックデータよりも収集しにくい。",a:"サイコグラフィック"},
{s:7,u:"1-2 CRM導入における留意点",q:"CRM導入に失敗する理由ⅰ）顧客データベース構築や管理の目的が抽象的なレベル（___の向上）に設定されている",a:"ロイヤルティ"},
{s:7,u:"1-2 CRM導入における留意点",q:"CRM導入を成功させるための具体的対応ⅱ）特定の媒体やチャネルだけに___を集中する",a:"販促コスト"},
// ===== 第3章 第2節 =====
{s:8,u:"2-1 データベースマーケティング",q:"今日、小売業には、顧客と___しながら顧客の望みや不満を積極的に聞き、二人三脚で販売を進めていく顧客重視型マーケティング体制の確立が求められている。",a:"対話"},
{s:8,u:"2-1 データベースマーケティング",q:"顧客と対話しながら二人三脚で販売を進めていく___型マーケティング体制の代表例がデータベースマーケティングである。",a:"顧客重視"},
{s:8,u:"2-1 データベースマーケティング",q:"データベースマーケティングとは、顧客の属性や___をデータベースとして蓄積し、管理することによって、個々の顧客に合わせたマーケティングに活用していくことである。",a:"購買履歴"},
{s:8,u:"2-1 データベースマーケティング",q:"データベースマーケティングにおいては、___の発見、トライアル客のリピート購入の促進、リピーターのロイヤルカスタマーへの育成などを行うことが目標とされる。",a:"見込み客"},
{s:8,u:"2-1 データベースマーケティング",q:"データベースマーケティングにおいては、見込み客の発見、トライアル客のリピート購入の促進、リピーターの___への育成などを行うことが目標とされる。",a:"ロイヤルカスタマー"},
{s:8,u:"2-1 データベースマーケティング",q:"E.L.ナッシュは、企業にとって最も重要な資産は、___（その小売業の商品を購入したことのある消費者＝購入客）である、としている。",a:"顧客"},
{s:8,u:"2-1 データベースマーケティング",q:"顧客データベースは___を実行するために構築されるものであり、自社への貢献度が高い優良顧客を識別するために不可欠である。",a:"FSP"},
{s:8,u:"2-1 データベースマーケティング",q:"顧客データベースは、自社への貢献度が高い___を識別するために不可欠である。",a:"優良顧客"},
{s:8,u:"2-1 データベースマーケティング",q:"顧客データベースは、___機能を有することによって、効率的、かつ、効果的なマーケティングを可能にする。",a:"顧客識別"},
{s:8,u:"2-1 データベースマーケティング",q:"POSシステムが単品管理の手法だとすれば、顧客データベースは___のための手法である。",a:"個客管理"},
{s:8,u:"2-1 データベースマーケティング",q:"POS情報は“結果”であり、小売業がまず把握しなければならないのは、「顧客がこのように動いたから」という“___情報”である。",a:"原因"},
{s:8,u:"2-1 データベースマーケティング",q:"今日主流のデータベースマーケティングは、従来の購入履歴データベースに加えて、顧客の___データ（家族構成、年収、余暇活動、趣味など）や消費マインドデータをデータベース化した2つのデータベースで構成されている。",a:"プロファイル"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"ロイヤルティマーケティングとは、来店顧客を一人ひとり___し、それらを階層別に分類したうえで、異なるベネフィットを購入金額に応じて提供することによって、優良顧客をつくり出そうとする諸活動のことである。",a:"識別"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"ロイヤルティマーケティングの実践にあたっては、異なる___を提供するためのロイヤルティプログラムの構築が鍵となる。",a:"ベネフィット"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"B.P.ウルフは、「すべての顧客は___ではない。顧客の識別行為をためらってはいけない」として、個客識別マーケティングを提唱している。",a:"平等"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"B.P.ウルフは、一人ひとりが異なる利益または損失を小売店に与えるという、___の根拠の1つである効率とかかわる部分との関連で、顧客を分類している。",a:"ワン・トゥ・ワン"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"B.P.ウルフの顧客分類：___…売上貢献度が上位2割に入る顧客",a:"ルーシー・ロイヤル"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"B.P.ウルフの顧客分類：___…あちこちの小売店で特売品を買い回るチェリーピッカー",a:"シェリー・チェリー"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"B.P.ウルフの顧客分類：___…自分の都合でたまたま来店した顧客",a:"キャロル・コンビニエンス"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"ロイヤルティマーケティングとは、顧客を区分し、___化し、それぞれのランクに対応したアプローチを行うロイヤルティプログラムである。",a:"ランキング"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"顧客ピラミッドでの階層別アプローチ：「利用顧客→___→重要顧客→上客」",a:"戦略顧客"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"顧客ピラミッドでの階層別アプローチ：「利用顧客→戦略顧客→___→上客」",a:"重要顧客"},
{s:8,u:"2-2 ロイヤルティマーケティング",q:"ロイヤルティマーケティングには、___を創造したり、競争他社・他店の顧客を奪ったりすることによって、自社の競争上の立場を有利にしようという意図は希薄である。",a:"新規顧客"},
// ===== 第3章 第3節 =====
{s:9,u:"3 コンビニエンスストア",q:"コンビニエンスストア（CVS）は、旧来の「業種別縦割型流通システムから___システムへ」と、小売業主導で革新することによって生み出された個客対応の利便性提供型店舗と表現できる。",a:"製配販三層統合型マーケティングチャネル"},
{s:9,u:"3 流通面でのベネフィット",q:"CVSは、価格に左右されない___面での価値を顧客に提供している。",a:"ライフスタイル"},
{s:9,u:"3 流通面でのベネフィット",q:"CVSの統合型品ぞろえ：商品の企画開発、計画的小ロット生産、物流コストを抑制する___配送や混載納品システムなど。",a:"多頻度少量"},
{s:9,u:"3 流通面でのベネフィット",q:"CVSの統合型品ぞろえ：___にもとづく補充発注システムなど。CVSマーケティングシステムでは、売場を起点としてPOSシステムによる___で個客ニーズへ対応する。",a:"単品管理"},
{s:9,u:"3 CVSマーケティングシステム",q:"マーケティングシステム型店舗運営…POSデータにもとづく発注と売れ筋中心の___の品ぞろえ",a:"多品種少量"},
{s:9,u:"3 CVSマーケティングシステム",q:"生産・流通システムの革新…製販共同による商品開発、___の短縮化、多頻度少量計画的配送",a:"発注リードタイム"},
{s:9,u:"3 CVSマーケティングシステム",q:"組織構造の統制…___方式による徹底指導",a:"フランチャイズチェーン（FC）"},
{s:9,u:"3 システム型ストアオペレーション",q:"多品種少量在庫による運営…品種数をできるだけ増やすとともに、同一品種内の品目数を絞り込み、さらに1品目当たりの在庫数量を減らして、多くの商品の___（販売効率）を高めること。",a:"回転率"},
{s:9,u:"3 システム型ストアオペレーション",q:"多頻度少量配送は、CVSの売場在庫を常に適正な水準に保つ効果が大きいデリバリーシステムであり、売れ筋商品の___防止を主なねらいとしている。",a:"欠品"},
{s:9,u:"3 革新的流通システムのベネフィット",q:"商品面でのベネフィット…商品開発のロットやサイズの___の実現",a:"小口化"},
{s:9,u:"3 革新的流通システムのベネフィット",q:"時間面でのベネフィット…個客に___の短縮化を提供",a:"買物所要時間"},
// ===== 第4章 第1節 =====
{s:10,u:"1-1 店舗立地の条件",q:"小売業の立地条件は、___と店舗立地に分けて捉える。___…都市の性格、都市計画、人口動態、交通条件、商圏と購買力、地価、競合関係など",a:"商業立地"},
{s:10,u:"1-1 店舗立地の条件",q:"小売業の立地条件のうち、___…近隣条件、敷地の物理的条件、法令規制など",a:"店舗立地"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"現在の商圏の___の妥当性…自店の扱う商品に対する商圏内の消費支出の総額と、自店の占めることができる割合を検討する。",a:"潜在力"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"商圏への___…商圏内の潜在力をどれだけ自店に吸収できるかは、人々が近くを通り過ぎる可能性に依存する。",a:"接近可能性"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___小売店…広告宣伝などによって独自の顧客を吸引するタイプ",a:"顧客創出型"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___小売店…近隣店舗に吸引された顧客がついでに購入していくタイプ",a:"近隣店顧客依存型"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___小売店…通勤者や交通機関利用者がついでに購入するタイプ",a:"通行量依存型"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___…人口増加と所得水準の上昇が期待できる商圏であるかどうか。",a:"成長可能性"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___…住居地（あるいは勤務先）と従来の買物先の小売店または商店街との中間に立地すると、顧客を途中で食い止めることができる。",a:"中間阻止性"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___…同種の商品を扱う一定数の小売店は、散在しているよりも、隣接あるいは近接して立地しているほうが、販売額を増加させる確率が高い。",a:"累積的吸引力"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___…補完関係にある商品を扱う2店舗は、非常に近接している場合には、両店舗をともに利用する顧客の発生率に正比例して販売額を増加させる。",a:"両立性"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"両立性…___にある商品を扱う2店舗は、非常に近接している場合には販売額を増加させる。",a:"補完関係"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"___…ほかの条件が等しければ、競争店ができるだけ少ない立地を選ぶ。",a:"競争回避"},
{s:10,u:"1-1 R.N.ネルソンの立地8原則",q:"立地の___…立地のコストを生産性と関連させて分析する。",a:"経済性"},
{s:10,u:"1-2 商圏の設定",q:"商圏とは、当該小売店の___が及ぶ範囲であって、その需要の一定割合が常時、当該小売店における買物として実現している地域である。",a:"顧客吸引力"},
{s:10,u:"1-2 商圏の設定",q:"商圏とは、現に___として寄与している顧客の分布する地域である。",a:"売上高"},
{s:10,u:"1-3 業種・店舗形態と商圏",q:"商圏の規模（広がり）を決定する要因に、消費者側の___に対する態度と、小売業の経営にとっての成立条件がある。",a:"買物距離"},
{s:10,u:"1-3 業種・店舗形態と商圏",q:"ファッション性の高い衣料品・身の回り品売場、あるいは特別の催事コーナーが___の売場となり、その他の最寄品の売場は、その売場の顧客に対する依存型の売場とみなすことができる。",a:"顧客創出型"},
{s:10,u:"1-4 経営戦略と商圏",q:"小売店の商圏は、その店舗の___と環境条件との組合せによって決定される。",a:"経営戦略"},
{s:10,u:"1-5 商圏モデル",q:"___・第1公式（W.J.ライリー）：2都市はそれらの中間にある小都市、町から、人口に正比例し、距離に反比例して、小売取引を吸引する。",a:"小売引力の法則"},
{s:10,u:"1-5 商圏モデル",q:"小売引力の法則・第1公式の提唱者は___である。",a:"W.J.ライリー"},
{s:10,u:"1-5 商圏モデル",q:"小売引力の法則・第1公式：通常の状態のもとにあっては、2都市はそれらの中間にある小都市、町から、___の持っているある力に正比例し、中間都市からこれらの2都市までの距離に反比例して、小売取引を吸引する。",a:"人口"},
{s:10,u:"1-5 商圏モデル",q:"小売引力の法則・第1公式：2都市は中間の小都市、町から、人口に正比例し、中間都市からこれらの2都市までの___に反比例して、小売取引を吸引する。",a:"距離"},
{s:10,u:"1-5 商圏モデル",q:"小売引力の法則・第2公式、および新・小売引力の法則の提唱者は___である。",a:"P.D.コンヴァース"},
{s:10,u:"1-5 商圏モデル",q:"小売引力の法則・第2公式：中間の町を両都市の___、すなわち、AとB2つの都市の小売商業の影響の等しい境界点とみなす。",a:"小売商圏分岐点"},
{s:10,u:"1-5 商圏モデル",q:"___（P.D.コンヴァース）：商業中心地である都市と、その商圏内または商圏の近くにある消費者の居住する都市は、ほぼ両者の人口に正比例し、慣性因子の2乗に反比例して消費者の居住する都市の小売販売額を分け合う。",a:"新・小売引力の法則"},
{s:10,u:"1-5 商圏モデル",q:"新・小売引力の法則：両者の人口に正比例し、慣性因子の___に反比例して消費者の居住する都市の小売販売額を分け合う。",a:"2乗"},
{s:10,u:"1-5 商圏モデル",q:"ハフの___：多くの利用可能な商業集積がある場合に、そのうちどの商業集積を利用するかという確率は、その商業集積が住民に対して与える効用に比例する。",a:"確率モデル"},

// ---- STATE ---------------------------------------------------------
let deck = [], idx = 0, ok = 0, ng = 0, wrong = [], revealed = false;
const $ = id => document.getElementById(id);
const show = (...ids) => { ["start","quiz","result","review"].forEach(i => $(i).classList.add("hidden")); ids.forEach(i => $(i).classList.remove("hidden")); window.scrollTo(0,0); };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- PROGRESS（途中保存・再開）--------------------------------------
const PKEY = "hanbaishi_mk_progress_v1";
const progressQid = q => q.s + "|" + q.q;

function readProgress(){
  try{
    const st = JSON.parse(localStorage.getItem(PKEY));
    if(!st || !Array.isArray(st.deck) || !st.deck.length) return null;
    if(!Number.isInteger(st.idx) || st.idx < 0 || st.idx >= st.deck.length) return null;
    return st;
  }catch(e){ return null; }
}
function saveProgress(){
  if(!deck.length || idx < 0 || idx >= deck.length) return;
  const st = {
    v: 2,
    deck: deck.map(progressQid),
    idx,
    ok,
    ng,
    wrong: wrong.map(progressQid),
    revealed,
    savedAt: Date.now()
  };
  try{ localStorage.setItem(PKEY, JSON.stringify(st)); }catch(e){}
  refreshResume();
}
function clearProgress(){
  try{ localStorage.removeItem(PKEY); }catch(e){}
  refreshResume();
}
function refreshResume(){
  const btn = $("btnResume");
  if(!btn) return;
  const st = readProgress();
  if(!st){
    btn.classList.add("hidden");
    btn.textContent = "前回の続きから再開";
    return;
  }
  btn.textContent = `前回の続きから再開（${st.idx + 1} / ${st.deck.length}）`;
  btn.classList.remove("hidden");
}
function restoreProgress(){
  const st = readProgress();
  if(!st){ refreshResume(); return; }

  const qmap = new Map(Q.map(q => [progressQid(q), q]));
  const restoredDeck = st.deck.map(id => qmap.get(id));
  if(restoredDeck.some(q => !q)){
    clearProgress();
    uiAlert("問題データが更新されたため、前回の途中データをリセットしました。");
    return;
  }

  deck = restoredDeck;
  idx = st.idx;
  ok = Number.isInteger(st.ok) ? st.ok : 0;
  ng = Number.isInteger(st.ng) ? st.ng : 0;
  wrong = Array.isArray(st.wrong) ? st.wrong.map(id => qmap.get(id)).filter(Boolean) : [];
  revealed = !!st.revealed;
  show("quiz");
  render();
}

window.addEventListener("pagehide", saveProgress);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") saveProgress();
});


// ---- START ---------------------------------------------------------
(function buildStart(){
  const box = $("secList");
  Object.keys(SECTIONS).forEach(k=>{
    const n = Q.filter(q=>q.s==k).length;
    box.insertAdjacentHTML("beforeend",
      `<label><input type="checkbox" name="sec" value="${k}" checked>${SECTIONS[k]}<span class="cnt">${n}問</span></label>`);
  });
})();

$("btnStart").onclick = () => {
  const secs = [...document.querySelectorAll('input[name=sec]:checked')].map(e=>+e.value);
  if(!secs.length){ uiAlert("節を1つ以上選択してください。"); return; }
  let list = Q.filter(q=>secs.includes(q.s));
  startQuiz(list, $("shuffle").checked);
};
$("btnResume").onclick = restoreProgress;

function startQuiz(list, shuffle){
  deck = list.slice();
  if(shuffle){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; } }
  idx=0; ok=0; ng=0; wrong=[]; revealed=false;
  show("quiz"); render();
  saveProgress();
}

// ---- QUIZ ----------------------------------------------------------
function render(){
  const q = deck[idx];
  $("secName").textContent = SECTIONS[q.s];
  $("counter").textContent = `${idx+1} / ${deck.length}`;
  $("barFill").style.width = `${(idx/deck.length)*100}%`;
  $("subName").textContent = q.u;
  $("qText").innerHTML = esc(q.q).replace(/___/g, `<span class="blank">${esc(q.a)}</span>`);
  $("ansBox").classList.add("hidden");
  $("judgeRow").classList.add("hidden");
  $("btnReveal").classList.remove("hidden");
  $("okCnt").textContent = ok; $("ngCnt").textContent = ng;

  if(revealed){
    document.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
    $("ansText").textContent = deck[idx].a;
    $("ansBox").classList.remove("hidden");
    $("btnReveal").classList.add("hidden");
    $("judgeRow").classList.remove("hidden");
  }
  saveProgress();
}

$("btnReveal").onclick = () => {
  revealed = true;
  document.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
  $("ansText").textContent = deck[idx].a;
  $("ansBox").classList.remove("hidden");
  $("btnReveal").classList.add("hidden");
  $("judgeRow").classList.remove("hidden");
  saveProgress();
};
$("btnOk").onclick = () => judge(true);
$("btnNg").onclick = () => judge(false);
function judge(correct){
  if(correct){ ok++; removeWeak(deck[idx]); }
  else { ng++; wrong.push(deck[idx]); addWeak(deck[idx]); }
  idx++;
  revealed = false;
  if(idx >= deck.length) finish(); else render();
}
$("btnQuit").onclick = async () => {
  if(await uiConfirm("中断してトップに戻りますか？\n途中経過は保存され、あとで続きから再開できます。")){
    saveProgress();
    show("start");
    refreshResume();
  }
};


// ---- RESULT --------------------------------------------------------
function finish(){
  clearProgress();
  $("rOk").textContent = ok; $("rTotal").textContent = deck.length;
  $("rRate").textContent = `正答率 ${Math.round(ok/deck.length*100)}%`;
  const wb = $("wrongBox");
  if(wrong.length){
    wb.innerHTML = `<h2>間違えた問題（${wrong.length}問）</h2><ol>` +
      wrong.map(q=>`<li>${esc(q.q).replace(/___/g,"【　　】")}<br><b>→ ${esc(q.a)}</b></li>`).join("") + `</ol>`;
    $("btnRetryWrong").classList.remove("hidden");
    $("btnPrintWrong").classList.remove("hidden");
  } else {
    wb.innerHTML = `<p class="lead" style="text-align:center;margin-top:16px">全問正解。</p>`;
    $("btnRetryWrong").classList.add("hidden");
    $("btnPrintWrong").classList.add("hidden");
  }
  $("rWeakCnt").textContent = weak.length;
  refreshWeak();
  show("result");
}
$("btnRetryWrong").onclick = () => startQuiz(wrong, false);
$("btnPrintWrong").onclick = () => printQuestions(wrong, "今回間違えた問題");
$("btnHome").onclick = () => { show("start"); refreshResume(); };


// ---- WEAK LIST（間違えた問題の蓄積）--------------------------------
const WKEY = "hanbaishi_mk_weak_v1";
const qid = q => q.s + "|" + q.q;
let weak = (function(){ try{ return JSON.parse(localStorage.getItem(WKEY)) || []; }catch(e){ return []; } })();
function saveWeak(){ try{ localStorage.setItem(WKEY, JSON.stringify(weak)); }catch(e){} }
function addWeak(q){ const id = qid(q); if(!weak.includes(id)){ weak.push(id); saveWeak(); } }
function removeWeak(q){ const i = weak.indexOf(qid(q)); if(i >= 0){ weak.splice(i,1); saveWeak(); } }
const weakQs = () => Q.filter(q => weak.includes(qid(q)));

function refreshWeak(){
  const n = weakQs().length;
  $("weakCnt").textContent = n;
  $("weakCard").classList.toggle("hidden", n === 0);
  $("rWeakCnt").textContent = n;
}

// ---- REVIEW（苦手問題集ページ）-------------------------------------
function renderReview(){
  const list = weakQs();
  const showAns = $("rvShowAns").checked;
  $("rvCnt").textContent = `${list.length} 問`;
  if(!list.length){
    $("rvList").innerHTML = `<p class="rv-empty">苦手リストは空です。<br>出題中に「× 不正解」を押した問題が、ここに自動でたまります。</p>`;
    $("btnRvQuiz").classList.add("hidden");
    $("btnRvPrint").classList.add("hidden");
    $("btnRvClear").classList.add("hidden");
  } else {
    $("rvList").innerHTML = list.map((q,i) =>
      `<div class="rv-item">
         <div class="rv-meta">${esc(SECTIONS[q.s])}／${esc(q.u)}</div>
         <div class="rv-q">${esc(q.q).replace(/___/g,"【　　】")}</div>
         ${showAns ? `<div class="rv-a">→ ${esc(q.a)}</div>` : ``}
         <button class="rv-del" data-i="${i}">覚えた（リストから外す）</button>
       </div>`).join("");
    $("btnRvQuiz").classList.remove("hidden");
    $("btnRvPrint").classList.remove("hidden");
    $("btnRvClear").classList.remove("hidden");
    $("rvList").querySelectorAll(".rv-del").forEach(b => {
      b.onclick = () => { removeWeak(list[+b.dataset.i]); renderReview(); refreshWeak(); };
    });
  }
}
function openReview(){ renderReview(); show("review"); }

$("btnWeakReview").onclick = openReview;
$("btnResultReview").onclick = openReview;
$("btnWeakQuiz").onclick = () => {
  const list = weakQs();
  if(!list.length){ uiAlert("苦手リストは空です。"); return; }
  startQuiz(list, $("shuffle").checked);
};
$("btnRvQuiz").onclick = () => startQuiz(weakQs(), false);
$("rvShowAns").onchange = renderReview;
function printQuestions(list, title){
  if(!list.length){ uiAlert("印刷する問題がありません。"); return; }

  const ua = navigator.userAgent;
  const isLine  = /Line\//i.test(ua);
  const isInApp = isLine || /FBAN|FBAV|Instagram|; wv\)|Claude/i.test(ua);
  if (isLine) {
    const u = new URL(location.href);
    u.searchParams.set("openExternalBrowser", "1");
    location.href = u.toString();
    return;
  }
  if (isInApp || typeof window.print !== "function") {
    uiAlert("このアプリ内の画面では印刷できません。\n\nメニューから「Safari／Chromeで開く」を選び、もう一度このボタンを押してください。");
    return;
  }

  $("printSheet").innerHTML =
    `<h2>${esc(title)}（${list.length}問）</h2>` +
    `<p class="print-note">問題編のあとに、解答編を別ページで印刷します。</p>` +
    list.map((q,i) =>
      `<div class="rv-item">
        <div class="rv-meta">問題 ${i+1}　${esc(SECTIONS[q.s])}／${esc(q.u)}</div>
        <div class="rv-q">${esc(q.q).replace(/___/g,"【　　】")}</div>
      </div>`
    ).join("") +
    `<div class="answer-key">
      <h2>解答</h2>
      <ol>${list.map(q => `<li>${esc(q.a)}</li>`).join("")}</ol>
    </div>`;

  window.print();
}
$("btnRvPrint").onclick = () => printQuestions(weakQs(), "苦手問題集");
$("btnRvClear").onclick = async () => {
  if(await uiConfirm(`苦手リスト（${weakQs().length}問）をすべて消去しますか？`)){
    weak = []; saveWeak(); renderReview(); refreshWeak();
  }
};
$("btnRvHome").onclick = () => { show("start"); refreshResume(); };

refreshWeak();
refreshResume();
</script>
</body>
