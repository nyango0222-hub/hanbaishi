<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>販売士1級 1問1答 ― マーチャンダイジング</title>
<style>
  :root{
    --ink:#1b2440;
    --ink-soft:#4a5473;
    --paper:#fafaf7;
    --line:#d9dbe3;
    --navy:#243b6b;
    --blank:#fff3bf;
    --blank-line:#e0a800;
    --ok:#1f7a4d;
    --ng:#b83227;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
  header h1{font-size:15px;font-weight:600;color:var(--navy);letter-spacing:.02em}
  header p{font-size:12px;color:var(--ink-soft);margin-top:4px}

  /* start */
  .sec-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .sec-list label{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    background:#fff;border-radius:var(--radius);font-size:14px;cursor:pointer
  }
  .sec-list label input{width:18px;height:18px;accent-color:var(--navy)}
  .sec-list .cnt{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .opt{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 18px;padding-left:2px}
  .opt input{width:18px;height:18px;accent-color:var(--navy)}
  .lead{font-size:13px;color:var(--ink-soft);line-height:1.6}

  /* buttons */
  button{
    font:inherit;border:0;cursor:pointer;border-radius:var(--radius);padding:14px 16px;font-size:15px;
    font-weight:600;transition:transform .08s ease, opacity .15s ease
  }
  button:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid #f0c040;outline-offset:2px}
  .btn-main{background:var(--navy);color:#fff;width:100%}
  .btn-sub{background:#fff;color:var(--navy);border:1px solid var(--navy);width:100%}
  .btn-ok{background:var(--ok);color:#fff;flex:1}
  .btn-ng{background:var(--ng);color:#fff;flex:1}
  .row{display:flex;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}

  /* quiz */
  .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .meta .num{font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:var(--navy);transition:width .25s ease}
  .sub{font-size:12px;color:var(--navy);font-weight:600;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--navy)}
  .q{
    font-size:17px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;min-height:140px
  }
  .blank{
    display:inline-block;min-width:4.5em;padding:0 .4em;margin:0 .1em;
    background:var(--blank);border-bottom:2px solid var(--blank-line);
    color:transparent;text-align:center;border-radius:3px;line-height:1.6;vertical-align:baseline;
    user-select:none
  }
  .blank.show{color:var(--ink);font-weight:700;background:#fff8dc;min-width:0}
  .ans{
    margin-top:14px;padding:14px 16px;border-radius:var(--radius);background:#eef1f8;
    font-size:14px;color:var(--ink-soft);line-height:1.6
  }
  .ans strong{display:block;font-size:19px;color:var(--navy);margin-top:2px}
  .hidden{display:none}
  .score-line{font-size:13px;color:var(--ink-soft);margin-top:14px;display:flex;gap:14px}
  .score-line b{color:var(--ink)}

  /* result */
  .result{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center}
  .result .big{font-size:48px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
  .result .big small{font-size:18px;color:var(--ink-soft);font-weight:500}
  .result p{font-size:14px;color:var(--ink-soft);margin-top:8px}
  .wrong{margin-top:20px}
  .wrong h2{font-size:14px;color:var(--ng);margin-bottom:8px}
  .wrong ol{padding-left:20px;font-size:13px;line-height:1.6}
  .wrong li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .wrong li b{color:var(--navy)}
  /* weak list */
  .weak-card{background:#fff;border:1px solid var(--ng);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .weak-head{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ng);font-weight:600;margin-bottom:10px}
  .weak-head b{font-size:22px;font-variant-numeric:tabular-nums}
  .weak-card .row button{padding:11px 10px;font-size:14px}

  /* review */
  .rv-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .rv-meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
  .rv-q{font-size:15px;line-height:1.85}
  .rv-a{margin-top:8px;font-size:14px;color:var(--navy);font-weight:700}
  .rv-del{background:#fff;color:var(--ink-soft);border:1px solid var(--line);font-size:12px;font-weight:500;padding:6px 10px;margin-top:10px;width:auto}
  .rv-empty{font-size:14px;color:var(--ink-soft);line-height:1.8;text-align:center;padding:30px 0}
  @media print{
    body{background:#fff}
    .app{max-width:none;padding:0}
    #start,#quiz,#result,.stack,.opt,.rv-del,.meta{display:none!important}
    #review{display:block!important}
    .rv-item{break-inside:avoid;page-break-inside:avoid;border:0;border-bottom:1px dashed #bbb;border-radius:0;padding:8px 0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* in-page dialog */
  .dlg-bg{position:fixed;inset:0;background:rgba(20,28,50,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000}
  .dlg{background:#fff;border-radius:var(--radius);max-width:360px;width:100%;padding:20px 18px 16px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
  .dlg p{font-size:14px;line-height:1.7;white-space:pre-wrap;margin-bottom:16px}
  .dlg .row{display:flex;gap:10px}
  .dlg .row button{flex:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>販売士1級 1問1答</h1>
    <p>マーチャンダイジング（穴埋め）</p>
  </header>

  <!-- START -->
  <section id="start">
    <p class="lead">出題する節を選び、開始。空欄を頭の中で答えてから「答えを見る」→ 自己採点します。</p>
    <div class="weak-card hidden" id="weakCard">
      <div class="weak-head">苦手リスト <b id="weakCnt">0</b> 問</div>
      <div class="row">
        <button class="btn-sub" id="btnWeakReview">問題集を見る</button>
        <button class="btn-main" id="btnWeakQuiz">苦手だけ出題</button>
      </div>
    </div>
    <div class="sec-list" id="secList"></div>
    <label class="opt"><input type="checkbox" id="shuffle"> 出題順をシャッフルする（オフ＝教科書順）</label>
    <button class="btn-main" id="btnStart">開始する</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="meta"><span id="secName"></span><span class="num" id="counter"></span></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="sub" id="subName"></div>
    <div class="q" id="qText"></div>
    <div class="ans hidden" id="ansBox">正解<strong id="ansText"></strong></div>
    <div class="score-line"><span>正解 <b id="okCnt">0</b></span><span>不正解 <b id="ngCnt">0</b></span></div>
    <div class="stack">
      <button class="btn-main" id="btnReveal">答えを見る</button>
      <div class="row hidden" id="judgeRow">
        <button class="btn-ng" id="btnNg">× 不正解</button>
        <button class="btn-ok" id="btnOk">○ 正解</button>
      </div>
      <button class="btn-sub" id="btnQuit">中断してトップへ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="result">
      <div class="big"><span id="rOk">0</span><small> / <span id="rTotal">0</span></small></div>
      <p id="rRate"></p>
    </div>
    <div class="wrong" id="wrongBox"></div>
    <div class="stack">
      <button class="btn-main hidden" id="btnRetryWrong">間違えた問題だけ再挑戦</button>
      <button class="btn-sub" id="btnResultReview">苦手問題集を見る（<span id="rWeakCnt">0</span>問）</button>
      <button class="btn-sub" id="btnHome">トップへ戻る</button>
    </div>
  </section>
  <!-- REVIEW -->
  <section id="review" class="hidden">
    <div class="meta"><span>苦手問題集</span><span class="num" id="rvCnt"></span></div>
    <label class="opt"><input type="checkbox" id="rvShowAns" checked> 正解を表示する</label>
    <div id="rvList"></div>
    <div class="stack">
      <button class="btn-main" id="btnRvQuiz">この問題集で出題</button>
      <button class="btn-sub" id="btnRvPrint">印刷／PDFで保存</button>
      <button class="btn-sub" id="btnRvClear">苦手リストを全消去</button>
      <button class="btn-sub" id="btnRvHome">トップへ戻る</button>
    </div>
  </section>
</div>

<script>
function uiDialog(msg, withCancel){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="dlg-bg";
    bg.innerHTML='<div class="dlg"><p></p><div class="row">'+(withCancel?'<button class="btn-sub" data-v="0">キャンセル</button>':'')+'<button class="btn-main" data-v="1">OK</button></div></div>';
    bg.querySelector("p").textContent=msg;
    bg.querySelectorAll("button").forEach(b=>b.onclick=()=>{bg.remove();res(b.dataset.v==="1");});
    document.body.appendChild(bg);
  });
}
const uiConfirm = m => uiDialog(m, true);
const uiAlert = m => uiDialog(m, false);

// ---- DATA ----------------------------------------------------------
// s: 節, u: 小見出し, q: 問題文（___ が空欄）, a: 答え
const SECTIONS = {
  1:"第1章 第1節 カテゴリーマネジメントの機能と役割",
  2:"第1章 第2節 小売業におけるカテゴリーマネジメントの実際",
  3:"第2章 第1節 商品計画の策定",
  4:"第2章 第2節 商品特性別の商品計画～流行商品と定番商品～",
  5:"第2章 第3節 商品計画と利益管理",
  6:"第2章 第4節 商品予算管理",
  7:"第3章 第1節 販売目標の設定方法と販売計画の策定",
  8:"第3章 第2節 販売計画における予算管理",
  9:"第4章 第1節 仕入計画と仕入予算編成",
  10:"第4章 第2節 在庫投資と管理",
  11:"第5章 第1節 戦略的商品管理としての単品管理",
  12:"第5章 第2節 単品管理の戦略的活用法",
  13:"第6章 第1節 小売業の物流システムと物流センター",
  14:"第6章 第2節 物流におけるABCの考え方"
};
const Q = [
// ===== 第1節 =====
{s:1,u:"1-1 カテゴリーの概念",q:"カテゴリーマネジメントとは、___に合わせて設定した小売業固有のカテゴリーを戦略的ビジネスユニット（SBU）として位置づけ、棚割などの売場づくりや、利益管理、価格設定、プロモーション、ロジスティクスなどを、そのカテゴリー単位で統合化するビジネスプロセスである。",a:"顧客ニーズ"},
{s:1,u:"1-1 カテゴリーの概念",q:"カテゴリーマネジメントとは、顧客ニーズに合わせて設定した小売業固有のカテゴリーを___として位置づけ、棚割などの売場づくりや、利益管理、価格設定、プロモーション、ロジスティクスなどを、そのカテゴリー単位で統合化するビジネスプロセスである。",a:"戦略的ビジネスユニット（SBU）"},
{s:1,u:"1-1 カテゴリーの概念",q:"カテゴリーの概念とは、小売業がターゲットとする顧客層の悩みを解消したり、欲求を満足させたりするために、相関性や___があると明確に判断できる管理可能な商品グループを指す。",a:"代替性"},
{s:1,u:"1-1 カテゴリーの概念",q:"顧客ニーズにもとづいてカテゴリーを定義づけるための手順の第3段階は、主要顧客層から___する段階は、どこに位置するかを決定する。",a:"代替購買"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントは、特定の___をひとかたまりの商品グループとして販売・管理できるという点で、ブランドを重視するメーカーよりも小売業のほうに必要不可欠な戦略的管理手法である。",a:"顧客ニーズ"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントは、特定の顧客ニーズをひとかたまりの商品グループとして販売・管理できるという点で、___を重視するメーカーよりも小売業のほうに必要不可欠な戦略的管理手法である。",a:"ブランド"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの計画プロセスの第1段階は、経営トップによる経営戦略計画の立案のもと、___によって全社的カテゴリー計画を作成する。",a:"マーケティング責任者"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの計画プロセスの第2段階は、___制を採用することによって、個別カテゴリー計画を作成する。",a:"カテゴリーマネジャー"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの計画プロセスの第3段階は、個別カテゴリー計画を店舗の___が実施する。",a:"売場責任者"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの実施にあたっては、小売業と当該カテゴリーの主要メーカーが協働して、カテゴリー別に定めた___の達成、および中・長期的な戦略目標の実現を目指す。",a:"業績目標"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの実施にあたっては、小売業と当該カテゴリーの主要メーカーが協働して、カテゴリー別に定めた業績目標の達成、および中・長期的な___の実現を目指す。",a:"戦略目標"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの取組み手順 ⅰ）___の設定…誰が自店の本当の顧客なのか。",a:"メインターゲット"},
{s:1,u:"1-2 計画プロセスと取組み手順",q:"カテゴリーマネジメントの取組み手順 ⅲ）___の作成…年間どれくらいの売上と利益を確保すべきか。",a:"購買促進企画"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"カテゴリーのグルーピングを行う際、消費者の___の場面を分析し、当該カテゴリーの特徴や戦略についてわかりやすく、ビジュアルに表現することが重要である。",a:"ライフスタイル"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"わざわざ店舗を選択する要因となっている目的来店性の強いカテゴリーで、小売業のイメージを定義する、標的顧客にとって重要なカテゴリーは、___商品群（デスティネーションカテゴリー）である。",a:"計画的購買"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"わざわざ店舗を選択する要因となっている目的来店性の強いカテゴリーで、小売業のイメージを定義する、標的顧客にとって重要なカテゴリーは、計画的購買商品群（___カテゴリー）である。",a:"デスティネーション"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"主要購買者層の日常的欲求に応えられる普遍的カテゴリー（コアカテゴリー）で、継続的来店を促す、顧客にとって欠かすことのできないカテゴリーは、___商品群（ルーティーンカテゴリー）である。",a:"必需的購買"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"主要購買者層の日常的欲求に応えられる普遍的カテゴリー（コアカテゴリー）で、継続的来店を促す、顧客にとって欠かすことのできないカテゴリーは、必需的購買商品群（___カテゴリー）である。",a:"ルーティーン"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"主要購買者層に対して、特定時期に特定商品の主要提案者として適切に商品を提供できるカテゴリー（シーズナルカテゴリー）で、通常、収益よりも集客を意図するカテゴリーは、___商品群（オケージョナルカテゴリー）である。",a:"時期的購買"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"主要購買者層に対して、特定時期に特定商品の主要提案者として適切に商品を提供できるカテゴリー（シーズナルカテゴリー）で、通常、収益よりも集客を意図するカテゴリーは、時期的購買商品群（___カテゴリー）である。",a:"オケージョナル"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"一般の消費者に対して、商品回転率が低い商品に関しても気軽に購入できる便利な小売店（ワンストップショッピングのできる店舗）として認識されるためのカテゴリーで、顧客のついで買いによる買上点数と売上高の増加に貢献するカテゴリーは、___商品群（コンビニエンスカテゴリー）である。",a:"補完的購買"},
{s:1,u:"1-3 カテゴリーマネジメントの機能と役割",q:"一般の消費者に対して、商品回転率が低い商品に関しても気軽に購入できる便利な小売店（ワンストップショッピングのできる店舗）として認識されるためのカテゴリーで、顧客のついで買いによる買上点数と売上高の増加に貢献するカテゴリーは、補完的購買商品群（___カテゴリー）である。",a:"コンビニエンス"},
// ===== 第2節 =====
{s:2,u:"2-1 小売業のカテゴリーマネジメントの取組み",q:"カテゴリーマネジメントとは、個々のブランドや___（ライン）単位の業績ではなく、通常、品種（クラス）単位で構成したカテゴリーや、ライフスタイルのシーンなどで構成したカテゴリーを単位とした業績に焦点を絞り、それらカテゴリーごとに購買促進や利益管理などを行う戦略的ビジネス概念である。",a:"品群"},
{s:2,u:"2-1 小売業のカテゴリーマネジメントの取組み",q:"カテゴリーマネジメントとは、個々のブランドや品群（ライン）単位の業績ではなく、通常、___（クラス）単位で構成したカテゴリーや、ライフスタイルのシーンなどで構成したカテゴリーを単位とした業績に焦点を絞り、それらカテゴリーごとに購買促進や利益管理などを行う戦略的ビジネス概念である。",a:"品種"},

{s:7,u:"1-3 季節変動と月間販売計画の立て方",q:"連環比率法は、月ごとに前月に対する変化率を計算し、その前月比の___を季節変動値とみなす方法である。",a:"平均値"},
{s:7,u:"1-3 季節変動と月間販売計画の立て方",q:"月別の季節指数が求められれば、決定した年間の総販売目標を___で割って月平均販売目標とし、それに各月の季節指数を掛けて月別販売目標を決定することができる。",a:"12"},
{s:7,u:"1-3 季節変動と月間販売計画の立て方",q:"【計算】年間売上高6,144万円、月平均売上高512万円、4月の月間売上高443万円の場合、4月の季節指数は___となる（小数点第2位を四捨五入）。",a:"86.5（443万円÷512万円×100）"},
{s:7,u:"1-3 季節変動と月間販売計画の立て方",q:"従業員に販売目標意識を抱かせ、目標達成に対する貢献意欲を引き出す方法が___である。",a:"目標管理"},
{s:7,u:"1-3 季節変動と月間販売計画の立て方",q:"年間や月間単位の販売管理では消費市場の変化にきめ細かく対応できないため、___を基準とした販売計画書を作成し、それを忠実に実行していくことが重要である。",a:"1週間"},
{s:7,u:"1-3 季節変動と月間販売計画の立て方",q:"月を単位とした販売実績の管理を行う場合、環境変化の激しい今日では、月ごとに毎日の計画達成状況を管理する「___」（数値の推移と累積、移動合計の3つの線を1つのグラフに表したもの）を活用することも必要である。",a:"Zチャート"},
{s:7,u:"1-4 販売割当",q:"販売割当とは、___をもとに販売戦略などを加えて設定した計画販売高（販売目標）をさまざまな基準によって分割し、それぞれに割り当てることである。",a:"販売予測"},

{s:7,u:"1-4 販売割当",q:"【計算】販売高構成比・粗利益率が、A：40.0%・30.0%、B：30.0%・25.0%、C：20.0%・20.0%、D：10.0%・15.0%のとき、Cの粗利益貢献度は___%である。",a:"16.0（4.0÷25.0）"},
{s:7,u:"1-4 販売割当",q:"【計算】販売高構成比・粗利益率が、A：40.0%・30.0%、B：30.0%・25.0%、C：20.0%・20.0%、D：10.0%・15.0%のとき、Dの粗利益貢献度は___%である。",a:"6.0（1.5÷25.0）"},

{s:8,u:"2-4 部門予算の編成",q:"___は、借入金や社債に対する支払利息・割引料などの財務活動に伴う費用にかかわる予算であり、営業外費用とされるものである。",a:"財務予算"},
{s:8,u:"2-4 部門予算の編成",q:"財務予算は、借入金や社債に対する支払利息・割引料などの財務活動に伴う費用にかかわる予算であり、___費用とされるものである。",a:"営業外"},
{s:8,u:"2-4 部門予算の編成",q:"営業収支過不足の把握を中心として、現金収支の管理を行うために作成される過去の実績表および計画表を、総称して___という。",a:"資金繰り表"},
{s:8,u:"2-4 部門予算の編成",q:"資本予算は、中・長期の財務予算であり、予算管理の前提となる長期計画として、設備投資のような中・長期的な資本支出ならびに___を行うための予算である。",a:"資金調達"},
{s:8,u:"2-4 部門予算の編成",q:"当座の資金計画に関する現金収支予算よりも、期間をある程度長くし、広く短期的な財務流動性を検討するために必要となる予算を___といい、正味運転資本の増減要因に関する予算である。",a:"運転資本予算"},
{s:8,u:"2-4 部門予算の編成",q:"当座の資金計画に関する現金収支予算よりも、期間をある程度長くし、広く短期的な財務流動性を検討するために必要となる予算を運転資本予算といい、___の増減要因に関する予算である。",a:"正味運転資本"},
{s:8,u:"2-4 部門予算の編成",q:"___＝流動資産－流動負債＝（固定負債＋自己資本）－固定資産",a:"正味運転資本"},
{s:8,u:"2-4 部門予算の編成",q:"___は、正味運転資本の適正な維持による財務流動性の維持と資本の効率的な運用に貢献することをねらいとする。",a:"運転資本予算"},
{s:8,u:"2-4 部門予算の編成",q:"運転資本予算は、___の適正な維持による財務流動性の維持と資本の効率的な運用に貢献することをねらいとする。",a:"正味運転資本"},
{s:8,u:"2-5 予算による統制",q:"各部門の予算案を統合する___の編成は、手続き的には販売予算を起点として、見積財務諸表の作成に至るまでの一連の計算過程であるといえる。",a:"総合予算"},
{s:8,u:"2-5 予算による統制",q:"予算による統制にあたっては、予算目標の達成に向けて管理者の___をはかる事前的な統制とともに、予算と実績との合理的な比較により管理者の業績評価を適正に行う事後的な統制を有効に機能させることが重要である。",a:"動機づけ"},
{s:8,u:"2-5 予算による統制",q:"予算による統制にあたっては、予算目標の達成に向けて管理者の動機づけをはかる事前的な統制とともに、予算と実績との合理的な比較により管理者の___を適正に行う事後的な統制を有効に機能させることが重要である。",a:"業績評価"},
{s:8,u:"2-5 予算による統制",q:"管理者の___を有効に機能させるためには、管理者の実績を明確に認識して測定する責任会計を確立しなければならない。",a:"業績評価"},
{s:8,u:"2-5 予算による統制",q:"管理者の業績評価を有効に機能させるためには、管理者の実績を明確に認識して測定する___を確立しなければならない。",a:"責任会計"},
{s:8,u:"2-5 予算による統制",q:"予算差異分析の意義は、予算と___の比較により、現状を把握し、目標利益の達成という観点から批判的な判断が得ることにある。",a:"実績"},
{s:8,u:"2-5 予算による統制",q:"予算差異分析の意義は、予算と実績の比較により、現状を把握し、___の達成という観点から批判的な判断が得ることにある。",a:"目標利益"},
{s:8,u:"2-5 予算による統制",q:"有利差異は、収益項目については実績値が予算許容額を___た場合、費用項目については実績値が予算許容額未満になった場合に測定する（逆の場合は不利差異）。",a:"超え"},
{s:8,u:"2-5 予算による統制",q:"有利差異は、収益項目については実績値が予算許容額を超えた場合、費用項目については実績値が予算許容額___になった場合に測定する（逆の場合は不利差異）。",a:"未満"},
{s:8,u:"2-5 予算による統制",q:"予算差異分析の手順 ⅰ）予算と___の比較による差異の測定",a:"実績"},
{s:8,u:"2-5 予算による統制",q:"総合予算差異分析は、損益計算書および貸借対照表における予算と___とを比較し、その差異を算定する。",a:"実績"},
{s:8,u:"2-5 予算による統制",q:"売上高予算差異分析：販売数量差異＝（実際販売数量－予算販売数量）×___",a:"予算販売価格"},
{s:8,u:"2-5 予算による統制",q:"売上高予算差異分析：販売価格差異＝（実際販売価格－予算販売価格）×___",a:"実際販売数量"},
{s:8,u:"2-5 予算による統制",q:"売上総利益差異分析：販売数量差異＝（実際販売数量－予算販売数量）×___",a:"予算単位利益"},
{s:8,u:"2-5 予算による統制",q:"売上総利益差異分析：利益額差異＝（実際単位利益－予算単位利益）×___",a:"実際販売数量"},
{s:8,u:"2-5 予算による統制",q:"売上高予算差異の図で、（実際販売価格－予算販売価格）×実際販売数量にあたる上の帯の部分は___を表す。",a:"販売価格差異"},
{s:8,u:"2-5 予算による統制",q:"売上高予算差異の図で、（実際販売数量－予算販売数量）×予算販売価格にあたる右下の部分は___を表す。",a:"販売数量差異"},
{s:8,u:"2-5 予算による統制",q:"【計算】販売価格：予算380円・実績390円、販売数量：予算200個・実績220個の場合、販売価格差異は___円（有利差異）となる。",a:"2,200円（＝（390円－380円）×220個）"},
{s:8,u:"2-5 予算による統制",q:"【計算】販売価格：予算380円・実績390円、販売数量：予算200個・実績220個の場合、販売数量差異は___円（有利差異）となる。",a:"7,600円（＝（220個－200個）×380円）"},

{s:9,u:"1-2 仕入計画の立て方",q:"第一次産業の産品は、品質条件を一定に絞り込んで仕入数量を増加させたとしても、___による仕入単価の引下げ効果は、工業製品と同様に得られるとは限らない。",a:"数量割引"},
{s:9,u:"1-2 仕入計画の立て方",q:"第二次産業の商品は、無計画に特定品目の仕入数量を増加させると、遊休在庫が増加し、大幅な___（値下販売）を余儀なくされ、また、少量ずつ必要に応じて仕入れる当用仕入も、仕入単価が割高となり発注費用もかさむため、収益性が低下する。",a:"マークダウン"},

{s:9,u:"1-4 仕入予算策定上の留意点",q:"一般に、月初予定（計画）在庫高は、直前の月の___が繰り越されるものであり、変動を考慮し、より適切な月初における在庫の確保を目指して、基準在庫法や百分率変異法などの方法に従って算定する。",a:"月末在庫高"},
{s:9,u:"1-4 仕入予算策定上の留意点",q:"棚卸商品の期末評価のうち時価法は、市場価格が変動した際に、先物取引などで___を得る目的で棚卸商品を保有している場合に適用する。",a:"キャピタル・ゲイン"},
{s:9,u:"1-4 仕入予算策定上の留意点",q:"期末棚卸商品のすべてについて個々の取得原価によって評価する方法を___という。",a:"個別法"},

{s:9,u:"1-4 仕入予算策定上の留意点",q:"棚卸商品の種類や値入率が異なる商品ごとにグループ分けしたものの原価率を求め、他方で棚卸商品を売価で調べておき、その売価に原価率を掛けて棚卸商品の原価を求める方法を___という。",a:"売価還元法"},

{s:9,u:"1-4 仕入予算策定上の留意点",q:"減耗（棚卸減耗）とは、帳簿上では把握されていない在庫高の不足のことであり、実際に___を行った結果、帳簿上の期末在庫高と比較して認識された不足分である。",a:"棚卸（実地棚卸）"},
{s:9,u:"1-4 仕入予算策定上の留意点",q:"減耗（棚卸減耗）とは、帳簿上では把握されていない在庫高の不足のことであり、実際に棚卸（実地棚卸）を行った結果、帳簿上の___と比較して認識された不足分である。",a:"期末在庫高"},
{s:9,u:"1-4 仕入予算策定上の留意点",q:"多くの場合、各期の減耗の合計を求め、それぞれの期の___で割って減耗率を算定し、仕入高予算や在庫高予算に活用する。",a:"純売上高"},

{s:9,u:"1-4 仕入予算策定上の留意点",q:"継続的な取引関係を維持している小売業や大口のユーザーに対して、さまざまなサービスを手厚く提供するとともに、適宜、販売価格を割り引くことを___という。",a:"特定顧客割引"},

{s:9,u:"1-5 月初適正在庫高の決定",q:"週単位供給法（週間供給法）は、当該商品の週当たり売上高予算に、週単位で示した年間平均の___（商品が店内に留まる1週間に対する平均的長さの割合）を掛けて算出する方法である。",a:"商品回転期間"},

// ---- STATE ---------------------------------------------------------
let deck = [], idx = 0, ok = 0, ng = 0, wrong = [];
const $ = id => document.getElementById(id);
const show = (...ids) => { ["start","quiz","result","review"].forEach(i => $(i).classList.add("hidden")); ids.forEach(i => $(i).classList.remove("hidden")); window.scrollTo(0,0); };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


// ---- START ---------------------------------------------------------
(function buildStart(){
  const box = $("secList");
  Object.keys(SECTIONS).forEach(k=>{
    const n = Q.filter(q=>q.s==k).length;
    box.insertAdjacentHTML("beforeend",
      `<label><input type="checkbox" name="sec" value="${k}" checked>${SECTIONS[k]}<span class="cnt">${n}問</span></label>`);
  });
})();

$("btnStart").onclick = () => {
  const secs = [...document.querySelectorAll('input[name=sec]:checked')].map(e=>+e.value);
  if(!secs.length){ uiAlert("節を1つ以上選択してください。"); return; }
  let list = Q.filter(q=>secs.includes(q.s));
  startQuiz(list, $("shuffle").checked);
};

function startQuiz(list, shuffle){
  deck = list.slice();
  if(shuffle){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; } }
  idx=0; ok=0; ng=0; wrong=[];
  show("quiz"); render();
}

// ---- QUIZ ----------------------------------------------------------
function render(){
  const q = deck[idx];
  $("secName").textContent = SECTIONS[q.s];
  $("counter").textContent = `${idx+1} / ${deck.length}`;
  $("barFill").style.width = `${(idx/deck.length)*100}%`;
  $("subName").textContent = q.u;
  $("qText").innerHTML = esc(q.q).replace(/___/g, `<span class="blank">${esc(q.a)}</span>`);
  $("ansBox").classList.add("hidden");
  $("judgeRow").classList.add("hidden");
  $("btnReveal").classList.remove("hidden");
  $("okCnt").textContent = ok; $("ngCnt").textContent = ng;
}

$("btnReveal").onclick = () => {
  document.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
  $("ansText").textContent = deck[idx].a;
  $("ansBox").classList.remove("hidden");
  $("btnReveal").classList.add("hidden");
  $("judgeRow").classList.remove("hidden");
};
$("btnOk").onclick = () => judge(true);
$("btnNg").onclick = () => judge(false);
function judge(correct){
  if(correct){ ok++; removeWeak(deck[idx]); }
  else { ng++; wrong.push(deck[idx]); addWeak(deck[idx]); }
  idx++;
  if(idx >= deck.length) finish(); else render();
}
$("btnQuit").onclick = async () => { if(await uiConfirm("中断してトップに戻りますか？")) show("start"); };


// ---- RESULT --------------------------------------------------------
function finish(){
  $("rOk").textContent = ok; $("rTotal").textContent = deck.length;
  $("rRate").textContent = `正答率 ${Math.round(ok/deck.length*100)}%`;
  const wb = $("wrongBox");
  if(wrong.length){
    wb.innerHTML = `<h2>間違えた問題（${wrong.length}問）</h2><ol>` +
      wrong.map(q=>`<li>${esc(q.q).replace(/___/g,"【　　】")}<br><b>→ ${esc(q.a)}</b></li>`).join("") + `</ol>`;
    $("btnRetryWrong").classList.remove("hidden");
  } else {
    wb.innerHTML = `<p class="lead" style="text-align:center;margin-top:16px">全問正解。</p>`;
    $("btnRetryWrong").classList.add("hidden");
  }
  $("rWeakCnt").textContent = weak.length;
  refreshWeak();
  show("result");
}
$("btnRetryWrong").onclick = () => startQuiz(wrong, false);
$("btnHome").onclick = () => show("start");


// ---- WEAK LIST（間違えた問題の蓄積）--------------------------------
const WKEY = "hanbaishi_md_weak_v1";
const qid = q => q.s + "|" + q.q;
let weak = (function(){ try{ return JSON.parse(localStorage.getItem(WKEY)) || []; }catch(e){ return []; } })();
function saveWeak(){ try{ localStorage.setItem(WKEY, JSON.stringify(weak)); }catch(e){} }
function addWeak(q){ const id = qid(q); if(!weak.includes(id)){ weak.push(id); saveWeak(); } }
function removeWeak(q){ const i = weak.indexOf(qid(q)); if(i >= 0){ weak.splice(i,1); saveWeak(); } }
const weakQs = () => Q.filter(q => weak.includes(qid(q)));

function refreshWeak(){
  const n = weakQs().length;
  $("weakCnt").textContent = n;
  $("weakCard").classList.toggle("hidden", n === 0);
  $("rWeakCnt").textContent = n;
}

// ---- REVIEW（苦手問題集ページ）-------------------------------------
function renderReview(){
  const list = weakQs();
  const showAns = $("rvShowAns").checked;
  $("rvCnt").textContent = `${list.length} 問`;
  if(!list.length){
    $("rvList").innerHTML = `<p class="rv-empty">苦手リストは空です。<br>出題中に「× 不正解」を押した問題が、ここに自動でたまります。</p>`;
    $("btnRvQuiz").classList.add("hidden");
    $("btnRvPrint").classList.add("hidden");
    $("btnRvClear").classList.add("hidden");
  } else {
    $("rvList").innerHTML = list.map((q,i) =>
      `<div class="rv-item">
         <div class="rv-meta">${esc(SECTIONS[q.s])}／${esc(q.u)}</div>
         <div class="rv-q">${esc(q.q).replace(/___/g,"【　　】")}</div>
         ${showAns ? `<div class="rv-a">→ ${esc(q.a)}</div>` : ``}
         <button class="rv-del" data-i="${i}">覚えた（リストから外す）</button>
       </div>`).join("");
    $("btnRvQuiz").classList.remove("hidden");
    $("btnRvPrint").classList.remove("hidden");
    $("btnRvClear").classList.remove("hidden");
    $("rvList").querySelectorAll(".rv-del").forEach(b => {
      b.onclick = () => { removeWeak(list[+b.dataset.i]); renderReview(); refreshWeak(); };
    });
  }
}
function openReview(){ renderReview(); show("review"); }

$("btnWeakReview").onclick = openReview;
$("btnResultReview").onclick = openReview;
$("btnWeakQuiz").onclick = () => {
  const list = weakQs();
  if(!list.length){ uiAlert("苦手リストは空です。"); return; }
  startQuiz(list, $("shuffle").checked);
};
$("btnRvQuiz").onclick = () => startQuiz(weakQs(), false);
$("rvShowAns").onchange = renderReview;
$("btnRvPrint").onclick = () => {
  const ua = navigator.userAgent;
  const isLine  = /Line\//i.test(ua);
  const isInApp = isLine || /FBAN|FBAV|Instagram|; wv\)|Claude/i.test(ua);
  if (isLine) {
    const u = new URL(location.href);
    u.searchParams.set("openExternalBrowser", "1");
    location.href = u.toString();
    return;
  }
  if (isInApp || typeof window.print !== "function") {
    uiAlert("このアプリ内の画面では印刷できません。\n\nメニューから「Safari／Chromeで開く」を選び、もう一度このボタンを押してください。");
    return;
  }
  window.print();
};
$("btnRvClear").onclick = async () => {
  if(await uiConfirm(`苦手リスト（${weakQs().length}問）をすべて消去しますか？`)){
    weak = []; saveWeak(); renderReview(); refreshWeak();
  }
};
$("btnRvHome").onclick = () => show("start");

refreshWeak();
</script>
</body>
</html>
