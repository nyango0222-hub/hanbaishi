<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>販売士1級 1問1答 ― 販売・経営管理</title>
<style>
  :root{
    --ink:#1b2440;
    --ink-soft:#4a5473;
    --paper:#fafaf7;
    --line:#d9dbe3;
    --navy:#243b6b;
    --blank:#fff3bf;
    --blank-line:#e0a800;
    --ok:#1f7a4d;
    --ng:#b83227;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
  header h1{font-size:15px;font-weight:600;color:var(--navy);letter-spacing:.02em}
  header p{font-size:12px;color:var(--ink-soft);margin-top:4px}

  /* start */
  .sec-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .sec-list label{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    background:#fff;border-radius:var(--radius);font-size:14px;cursor:pointer
  }
  .sec-list label input{width:18px;height:18px;accent-color:var(--navy)}
  .sec-list .cnt{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .opt{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 18px;padding-left:2px}
  .opt input{width:18px;height:18px;accent-color:var(--navy)}
  .lead{font-size:13px;color:var(--ink-soft);line-height:1.6}

  /* buttons */
  button{
    font:inherit;border:0;cursor:pointer;border-radius:var(--radius);padding:14px 16px;font-size:15px;
    font-weight:600;transition:transform .08s ease, opacity .15s ease
  }
  button:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid #f0c040;outline-offset:2px}
  .btn-main{background:var(--navy);color:#fff;width:100%}
  .btn-sub{background:#fff;color:var(--navy);border:1px solid var(--navy);width:100%}
  .btn-ok{background:var(--ok);color:#fff;flex:1}
  .btn-ng{background:var(--ng);color:#fff;flex:1}
  .row{display:flex;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}

  /* quiz */
  .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .meta .num{font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:var(--navy);transition:width .25s ease}
  .sub{font-size:12px;color:var(--navy);font-weight:600;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--navy)}
  .q{
    font-size:17px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;min-height:140px
  }
  .blank{
    display:inline-block;min-width:4.5em;padding:0 .4em;margin:0 .1em;
    background:var(--blank);border-bottom:2px solid var(--blank-line);
    color:transparent;text-align:center;border-radius:3px;line-height:1.6;vertical-align:baseline;
    user-select:none
  }
  .blank.show{color:var(--ink);font-weight:700;background:#fff8dc;min-width:0}
  .ans{
    margin-top:14px;padding:14px 16px;border-radius:var(--radius);background:#eef1f8;
    font-size:14px;color:var(--ink-soft);line-height:1.6
  }
  .ans strong{display:block;font-size:19px;color:var(--navy);margin-top:2px}
  .hidden{display:none}
  .score-line{font-size:13px;color:var(--ink-soft);margin-top:14px;display:flex;gap:14px}
  .score-line b{color:var(--ink)}

  /* result */
  .result{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center}
  .result .big{font-size:48px;font-weight:700;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
  .result .big small{font-size:18px;color:var(--ink-soft);font-weight:500}
  .result p{font-size:14px;color:var(--ink-soft);margin-top:8px}
  .wrong{margin-top:20px}
  .wrong h2{font-size:14px;color:var(--ng);margin-bottom:8px}
  .wrong ol{padding-left:20px;font-size:13px;line-height:1.6}
  .wrong li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .wrong li b{color:var(--navy)}
  /* weak list */
  .weak-card{background:#fff;border:1px solid var(--ng);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .weak-head{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ng);font-weight:600;margin-bottom:10px}
  .weak-head b{font-size:22px;font-variant-numeric:tabular-nums}
  .weak-card .row button{padding:11px 10px;font-size:14px}

  /* review */
  .rv-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .rv-meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
  .rv-q{font-size:15px;line-height:1.85}
  .rv-a{margin-top:8px;font-size:14px;color:var(--navy);font-weight:700}
  .rv-del{background:#fff;color:var(--ink-soft);border:1px solid var(--line);font-size:12px;font-weight:500;padding:6px 10px;margin-top:10px;width:auto}
  .rv-empty{font-size:14px;color:var(--ink-soft);line-height:1.8;text-align:center;padding:30px 0}
  #printSheet h2{font-size:18px;color:var(--navy);margin-bottom:14px}
  #printSheet .print-note{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
  #printSheet .answer-key{margin-top:24px}
  #printSheet .answer-key h2{margin-bottom:10px}
  #printSheet .answer-key ol{padding-left:24px;font-size:14px;line-height:1.8}
  @media print{
    body{background:#fff}
    .app{max-width:none;padding:0}
    .app > section,.app > header{display:none!important}
    #printSheet{display:block!important}
    #printSheet .rv-item{display:block!important;break-inside:avoid;page-break-inside:avoid;border:0;border-bottom:1px dashed #bbb;border-radius:0;padding:8px 0}
    #printSheet .answer-key{break-before:page;page-break-before:always}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* in-page dialog */
  .dlg-bg{position:fixed;inset:0;background:rgba(20,28,50,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000}
  .dlg{background:#fff;border-radius:var(--radius);max-width:360px;width:100%;padding:20px 18px 16px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
  .dlg p{font-size:14px;line-height:1.7;white-space:pre-wrap;margin-bottom:16px}
  .dlg .row{display:flex;gap:10px}
  .dlg .row button{flex:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>販売士1級 1問1答</h1>
    <p>販売・経営管理（穴埋め）</p>
  </header>

  <!-- START -->
  <section id="start">
    <p class="lead">出題する節を選び、開始。空欄を頭の中で答えてから「答えを見る」→ 自己採点します。</p>
    <div class="weak-card hidden" id="weakCard">
      <div class="weak-head">苦手リスト <b id="weakCnt">0</b> 問</div>
      <div class="row">
        <button class="btn-sub" id="btnWeakReview">問題集を見る</button>
        <button class="btn-main" id="btnWeakQuiz">苦手だけ出題</button>
      </div>
    </div>
    <div class="sec-list" id="secList"></div>
    <label class="opt"><input type="checkbox" id="shuffle"> 出題順をシャッフルする（オフ＝教科書順）</label>
    <button class="btn-main" id="btnStart">開始する</button>
    <button class="btn-sub hidden" id="btnResume" style="margin-top:10px">前回の続きから再開</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="meta"><span id="secName"></span><span class="num" id="counter"></span></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="sub" id="subName"></div>
    <div class="q" id="qText"></div>
    <div class="ans hidden" id="ansBox">正解<strong id="ansText"></strong></div>
    <div class="score-line"><span>正解 <b id="okCnt">0</b></span><span>不正解 <b id="ngCnt">0</b></span></div>
    <div class="stack">
      <button class="btn-main" id="btnReveal">答えを見る</button>
      <div class="row hidden" id="judgeRow">
        <button class="btn-ng" id="btnNg">× 不正解</button>
        <button class="btn-ok" id="btnOk">○ 正解</button>
      </div>
      <button class="btn-sub" id="btnQuit">中断してトップへ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="result">
      <div class="big"><span id="rOk">0</span><small> / <span id="rTotal">0</span></small></div>
      <p id="rRate"></p>
    </div>
    <div class="wrong" id="wrongBox"></div>
    <div class="stack">
      <button class="btn-main hidden" id="btnRetryWrong">間違えた問題だけ再挑戦</button>
      <button class="btn-sub hidden" id="btnPrintWrong">今回間違えた問題だけ印刷／PDF</button>
      <button class="btn-sub" id="btnResultReview">苦手問題集を見る（<span id="rWeakCnt">0</span>問）</button>
      <button class="btn-sub" id="btnHome">トップへ戻る</button>
    </div>
  </section>
  <!-- REVIEW -->
  <section id="review" class="hidden">
    <div class="meta"><span>苦手問題集</span><span class="num" id="rvCnt"></span></div>
    <label class="opt"><input type="checkbox" id="rvShowAns" checked> 正解を表示する</label>
    <div id="rvList"></div>
    <div class="stack">
      <button class="btn-main" id="btnRvQuiz">この問題集で出題</button>
      <button class="btn-sub" id="btnRvPrint">印刷／PDFで保存</button>
      <button class="btn-sub" id="btnRvClear">苦手リストを全消去</button>
      <button class="btn-sub" id="btnRvHome">トップへ戻る</button>
    </div>
  </section>

  <!-- PRINT ONLY -->
  <section id="printSheet" class="hidden"></section>
</div>

<script>
function uiDialog(msg, withCancel){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="dlg-bg";
    bg.innerHTML='<div class="dlg"><p></p><div class="row">'+(withCancel?'<button class="btn-sub" data-v="0">キャンセル</button>':'')+'<button class="btn-main" data-v="1">OK</button></div></div>';
    bg.querySelector("p").textContent=msg;
    bg.querySelectorAll("button").forEach(b=>b.onclick=()=>{bg.remove();res(b.dataset.v==="1");});
    document.body.appendChild(bg);
  });
}
const uiConfirm = m => uiDialog(m, true);
const uiAlert = m => uiDialog(m, false);

// ---- DATA ----------------------------------------------------------
// s: 節, u: 小見出し, q: 問題文（___ が空欄）, a: 答え
const SECTIONS = {
  1:"第1章 第1節 従業員管理の実務",
  2:"第1章 第2節 従業員の能力把握と人事考課",
  3:"第1章 第3節 職場の教育訓練",
  4:"第2章 第1節 キャッシュフローとキャッシュフロー経営",
  5:"第2章 第2節 戦略的キャッシュフロー経営",
  6:"第2章 第3節 キャッシュフロー・ベースの経営指標",
  7:"第3章 第1節 用途地域と借地借家法",
  8:"第3章 第2節 建物の建築および防火に関する法令",
  9:"第3章 第3節 商業設備などの法知識",
  10:"第4章 第1節 小売業経営におけるリスクマネジメント",
  11:"第4章 第2節 万引防止対策",
  12:"第4章 第3節 トレーサビリティシステムと電子タグ",
  13:"第4章 第4節 小売業のデジタルトランスフォーメーション（DX）への対応"
};
const Q = [
// ===== 第1章 第1節 =====
{s:1,u:"1-1 業務推進と従業員管理",q:"管理者が果たさなければならない役割のことを___という。",a:"管理職能"},
{s:1,u:"1-1 業務推進と従業員管理",q:"従業員管理を推進するうえでの注意点：組織運営の目的・方針を周知徹底する／___を充実させる／従業員間の協力体制を日ごろからつくっておく。",a:"従業員教育"},
{s:1,u:"1-1 業務推進と従業員管理",q:"従業員管理を推進するうえでの注意点：仕事の結果をきちんと公正に___する。",a:"評価"},
{s:1,u:"1-1 業務推進と従業員管理",q:"従業員管理の実行プロセスは、管理過程論の創始者とされる___によると、管理の過程からみて計画→組織化→動機づけ→指令→調整→統制の順となっている。",a:"J.H.ファヨール"},
{s:1,u:"1-1 業務推進と従業員管理",q:"ⅰ）___段階…目標を達成するためのねらいや方法などを体系的にまとめる。この段階で従業員の参画を求める。",a:"計画"},
{s:1,u:"1-1 業務推進と従業員管理",q:"ⅱ）___段階…目標達成をスムーズに実現するためにはどのような組織でやればよいかを決める。この段階で従業員の能力に見合った仕事を与える。",a:"組織化"},
{s:1,u:"1-1 業務推進と従業員管理",q:"ⅲ）___段階…目標達成のために従業員が意欲的に仕事をするように職場環境を整える。この段階で従業員に責任を持たせ、権限を与える。",a:"動機づけ"},
{s:1,u:"1-1 業務推進と従業員管理",q:"ⅳ）___段階…業務を遂行するための方法などについて指令を下す。指令の必要性や重要性をよく理解させる。",a:"指令"},
{s:1,u:"1-1 業務推進と従業員管理",q:"ⅴ）___段階…業務の進行状況と計画のズレを調べて計画を手直ししたりする。よい点は褒め、悪い点は是正するように指導する。",a:"調整"},
{s:1,u:"1-1 業務推進と従業員管理",q:"ⅵ）___段階…職務秩序を守らせたり目標に対する考え方を一致させたりして業務の標準化を図る。職場への帰属意識を高め、仕事上の一定の手続きをとるよう指導する。",a:"統制"},
{s:1,u:"1-2 小集団活動",q:"小集団活動は、日本の組織運営の特質ともなっている___方式や集団主義を基盤として経営組織内で発達してきた。",a:"ボトムアップ"},
{s:1,u:"1-2 小集団活動",q:"小集団活動には___（無欠点運動）サークル、QC（品質管理）サークル、考える小集団などがある。",a:"ZD"},
{s:1,u:"1-2 小集団活動",q:"小集団活動には、ZD（無欠点運動）サークル、___（品質管理）サークル、考える小集団などがある。",a:"QC"},
{s:1,u:"1-2 小集団活動の目的と効用",q:"小集団活動の目的：自分たちの___や体力増進などを目的とした活動（公的組織と非公式組織がある）。",a:"能力開発"},
{s:1,u:"1-2 小集団活動の目的と効用",q:"小集団活動の効用：組織内の___を円滑にして内部の人間関係をよくする。",a:"コミュニケーション"},
{s:1,u:"1-2 小集団活動の目的と効用",q:"小集団活動の効用：従業員の___が高まり、組織が活性化していく。",a:"勤労意欲"},
{s:1,u:"1-2 小集団活動の目的と効用",q:"小集団活動の効用：従業員の___がしやすい。創造的活動が促進される。",a:"能力開発"},
{s:1,u:"1-2 小集団活動の効果的な進め方",q:"小集団活動の効果的な進め方ⅱ）___の選出…集団のメンバーが互選などの形で自主的に選ぶのが好ましい。（ⅰ）適正規模の集団編成は一般に5人以上10人以下）",a:"リーダー"},
{s:1,u:"1-2 小集団活動の効果的な進め方",q:"小集団活動の効果的な進め方ⅴ）活動への___",a:"全員参加"},
{s:1,u:"1-2 小集団活動の効果的な進め方",q:"小集団活動の効果的な進め方ⅷ）活動結果のまとめと___",a:"評価"},
{s:1,u:"1-3 従業員の帰属意識",q:"従業員に自主的、かつ、意欲的に働いてもらうためには、勤労意欲を持たせることと同時に、組織に対する___を抱かせることが必要である。",a:"帰属意識"},
{s:1,u:"1-3 従業員の帰属意識",q:"人が組織に対して帰属意識を抱く条件：その組織に所属することによって、自分の___が満たされる可能性が高い場合。",a:"欲求"},
{s:1,u:"1-3 従業員の帰属意識",q:"人が組織に対して帰属意識を抱く条件：組織内に温かい___が存在する場合。",a:"人間関係"},
// ===== 第1章 第2節 =====
{s:2,u:"2-1 従業員の能力把握",q:"___能力…法律、経済、機械などの知識と記憶力、判断力、推理力、理解力、創造力などの知能",a:"知的"},
{s:2,u:"2-1 従業員の能力把握",q:"___能力…機械や器具を操作する能力のほかに、その基本となる指先の器用さなど",a:"技術的"},
{s:2,u:"2-1 従業員の能力把握",q:"___能力…筋力、視力、聴力などから、温度変化に耐える能力や病気の回復能力など",a:"身体的"},
{s:2,u:"2-1 従業員の能力把握",q:"___能力…注意力、忍耐力などから、協調性、外向性、感受性などの性格的なものまで",a:"精神的"},
{s:2,u:"2-2 人事考課の目的とねらい",q:"人事考課とは、従業員の業務遂行などの勤務内容を、その___と能力などをもとに一定の方法で査定することである。",a:"実績"},
{s:2,u:"2-2 人事考課の目的とねらい",q:"人事考課は、人事配置と___に利用するのが本筋で、昇給や賞与への利用は2次的なものと考えるべきである。",a:"教育"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"評価者だけの評価では個人的な___が入ったり、評価者間で不均衡が生じたりすることがある。",a:"偏見"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"直接の上司を第1次評価者とし、さらにその上司を第2次評価者とする___制度を活用する。",a:"複数評価者"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"職務を遂行するのに必要な能力を調べ、その中で重要な能力を各評価要素に重複しないように決めていくことを___という。",a:"職務分析"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"評価項目：___…職務の達成度、仕事の速さ・正確さなど",a:"業績考課"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"評価項目：___…専門知識、判断力、交渉力、企画力、理解力など",a:"能力考課"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"評価項目：___…規律、勤勉さ、積極性、協調性、責任感など",a:"態度（情意）考課"},
{s:2,u:"2-2 評価者・評価項目・評価期間",q:"一般的には___といった評価項目を設け、総合的な評価を行う。",a:"総合評価"},
{s:2,u:"2-2 人事考課の評価方法",q:"___…勤務成績の状況を、事実を示す資料によって客観的に記録し、評価しようとする方法（係長などが第一線で行う場合に適している）。",a:"記録法"},
{s:2,u:"2-2 人事考課の評価方法",q:"___…あらかじめ業務遂行上必要な基準を作成しておき、その基準と比較して評価する方法（従業員の間に序列をつけなければならない場合には難しい）。",a:"絶対評価法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…満点を基準として、できていないところ、不足しているところを満点から引いていく方式。",a:"減点法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…基準以上をプラス、基準以下をマイナスとして符号をチェックし、総合して評価する方式。",a:"執務基準法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…成績または人物を評価する評語をたくさん用意し、これらを使って評価する方式。",a:"成績評語法、人物評語法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…成績、態度、能力などに関して具体的な多くの評語（短文）を任意に並べ、該当するものを選ぶ方式。",a:"プロブスト法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…評語群を合わせたセットを多数用意し、その中から必ず特定のセットを選ぶ方式。",a:"強制択一法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…要素ごとにその段階の程度を示す目盛りを持った直線的尺度を用意し、該当箇所をチェックする方式。",a:"図式尺度法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…直線的尺度の代わりに段階的能力基準を示す短文を使う方式。",a:"段階択一法"},
{s:2,u:"2-2 人事考課の評価方法",q:"絶対評価法：___…短文の代わりに「S・A・B・C・D」などの符号（評語）を使う方式。",a:"評語評価法"},
{s:2,u:"2-2 人事考課の評価方法",q:"課長などが行う第2次段階での人事考課は、___などが適している。",a:"図式尺度法、段階択一法"},
{s:2,u:"2-2 人事考課の評価方法",q:"___…評価対象者間の優劣を評価し、序列をつけていく方法（主観的になりやすく、多人数の場合には序列がつけにくい）。",a:"相対評価法"},
{s:2,u:"2-2 人事考課の評価方法",q:"相対評価法：___…評価対象者を2人（または数人）ずつ組み、組ごとに優劣を比較していき、順次繰り返して全体の能力の順位を決める方式。",a:"相対比較法"},
{s:2,u:"2-2 人事考課の評価方法",q:"相対評価法：___…要素ごとに標準的人物を選定しておき、この人物を標準にして各人の評価を行う方式。",a:"人物比較法"},
{s:2,u:"2-2 人事考課の評価方法",q:"相対評価法：___…1つの集団ごとに、Aは全体の5%、Bは15%など、あらかじめ評価分布を限定しておく方式。",a:"分布制限法"},
{s:2,u:"2-2 人事考課の評価方法",q:"相対評価法：___…要素ごとに成績に従って評価対象者全員を序列化し、順位を決める方式。",a:"成績順位法"},
{s:2,u:"2-2 人事考課の評価方法",q:"相対評価法：___…総合的に全体をみて概括的に順位づけを行う方式（オーバーオールレイティング）。",a:"総合評価法"},
{s:2,u:"2-2 人事考課の評価方法",q:"相対評価法：___…総合評価をより正確にするために、多数の項目ごとに全体評価を行う方式。",a:"多項目総合評価法"},
{s:2,u:"2-2 人事考課の評価方法",q:"部長クラスが行う第3次段階での人事考課は、___が適している。",a:"総合評価法、多項目総合評価法"},
{s:2,u:"2-2 公正な評価のための留意点",q:"公正な評価のための留意点ⅱ）___にもとづいて評価すること。",a:"事実"},
{s:2,u:"2-2 公正な評価のための留意点",q:"公正な評価のための留意点ⅳ）評価期間の期間に限ることと、当該期間の___にわたること。",a:"全期間"},
{s:2,u:"2-2 公正な評価のための留意点",q:"公正な評価のための留意点ⅵ）先入観や___をなくすこと。",a:"偏見"},
{s:2,u:"2-2 公正な評価のための留意点",q:"公正な評価のための留意点ⅶ）エラーを伴いやすい___に気をつけること。",a:"心理的誤差傾向"},
{s:2,u:"2-2 公正な評価のための留意点",q:"公正な評価のための留意点ⅸ）評価者に対する___を実施すること。",a:"訓練"},
{s:2,u:"2-2 人事考課における主な心理的誤差傾向",q:"___…何か1つ良いと、何もかも良く評価してしまうように、部分的印象で全体評価を行うエラー（対策：評価要素の一つひとつを間違いなく理解すること）。",a:"ハロー効果"},
{s:2,u:"2-2 人事考課における主な心理的誤差傾向",q:"___…種々の思惑から評価が甘くなり、上位にシフトするエラー（対策：評価基準を明確にしていること）。",a:"寛大化傾向"},
{s:2,u:"2-2 人事考課における主な心理的誤差傾向",q:"___…評価するときにあまり優劣をつけず、評価が中央に集まってしまうエラー（対策：従業員を指導・育成するという自覚を高めること）。",a:"中心化（中央化）傾向"},
{s:2,u:"2-2 人事考課における主な心理的誤差傾向",q:"___…自分が几帳面だと普通の人でもだらしなく見えるように、評価者自身の性格や能力や価値基準で評価対象者をみることによって生じるエラー。",a:"対比誤差"},
{s:2,u:"2-2 人事考課における主な心理的誤差傾向",q:"___…評価要素が近くに配列されていたり、時間的に近かったりしていると、各評価要素の評定結果が類似してしまうエラー（対策：人事考課票の見直し）。",a:"近接誤差"},
{s:2,u:"2-2 評価内容における留意点",q:"勤務態度評価…職務遂行に関係する態度に限って評価し、業績と態度との間に対応関係（論理的な関係性）があるような評価をしてしまう___というエラーに気をつける。",a:"論理的誤差"},
{s:2,u:"2-2 評価結果の調整法",q:"___調整法…各評価者と調整者が集まり、討議をしながら評価結果を調整していく方法。",a:"会議式"},
{s:2,u:"2-2 評価結果の調整法",q:"___調整法…あらかじめ平均点を規制したり、正規分布になるように枠をはめる方法。",a:"統計的"},
{s:2,u:"2-2 人事考課の補完",q:"___…従業員自身から自己の能力、適性、意見、希望などを申告させる制度。",a:"自己申告制度"},
{s:2,u:"2-2 人事考課の補完",q:"___…人間の潜在能力や資質が外面の態度や行動として表れやすい状況を心理的配慮のもとに設定し、特別に訓練を受けた観察者が参加者を多面的に観察し、その結果を人事施策や能力開発に活用していく手法。",a:"ヒューマンアセスメント"},
{s:2,u:"2-2 人事考課の補完",q:"ヒューマンアセスメントでは、特別に訓練を受けた___（観察者）が参加者を多面的に観察する。",a:"アセッサー"},
// ===== 第1章 第3節 =====
{s:3,u:"3-1 さまざまな能力開発法",q:"___…上司が部下に対して、業務を通じて計画的に必要な知識、技能、問題解決能力および態度について実施する教育訓練。",a:"OJT"},
{s:3,u:"3-1 さまざまな能力開発法",q:"OJTは、「___教育訓練」ともいわれる。",a:"職場内"},
{s:3,u:"3-1 さまざまな能力開発法",q:"___…集合教育や通信教育、講習会など、業務遂行の過程外で行われる教育（主に人事部の担当になる）。",a:"Off-JT"},
{s:3,u:"3-1 さまざまな能力開発法",q:"Off-JTは、「___教育訓練」ともいわれる。",a:"職場外"},
{s:3,u:"3-1 さまざまな能力開発法",q:"___…長いスパンを見据えて上司のサポートを受けながら、さまざまな知識やスキルを身につけさせ、主体性を持った社員を育成するもの。",a:"OJD"},
{s:3,u:"3-1 さまざまな能力開発法",q:"OJDは、「___能力開発」と訳されている。",a:"職場内"},
{s:3,u:"3-1 さまざまな能力開発法",q:"___…私的な関心事や業務上の関心事を自らの発意にもとづき実践し、自己を確立する過程であり、あらゆる能力、資質向上の基盤となるもの。",a:"自己啓発"},
{s:3,u:"3-2 知識に関する教育",q:"知識に関する教育方法：___…課題を与えて各自に調べさせて報告させたり、皆でその課題について討議させるなどの方法。",a:"講義法"},
{s:3,u:"3-2 知識に関する教育",q:"知識に関する教育方法：___…あらかじめ完全にプログラムされたテキストを用いてステップごとに理解させていく方法。",a:"プログラムド・インストラクション"},
{s:3,u:"3-2 知識に関する教育",q:"知識に関する教育方法：___…抽象的な概念を理解させるためにひな型状況をつくって実証してみせる方法。",a:"デモンストレーション"},
{s:3,u:"3-2 技能に関する教育",q:"技能に関する教育は、教育する技能をいくつかの___に分け、各___がそれぞれ正確に行えるように、実務を通して練習を積ませる。",a:"動作単位"},
{s:3,u:"3-2 技能に関する教育",q:"技能に関する教育方法：実習法…基本的な技能を修得させる段階で中心となる方法。___…理解を深めるために効果的な方法。",a:"講義法"},
{s:3,u:"3-2 技能に関する教育",q:"技能に関する教育方法：___…動作単位を組み合わせた応用動作などに効果的な方法。",a:"討議法"},
{s:3,u:"3-2 態度に関する教育",q:"態度とは、知性と行動とを全体としてコントロールする恒常的な傾向性をいい、___と呼ばれることもある。",a:"心的態度"},
{s:3,u:"3-2 態度に関する教育",q:"態度の教育は、知識（ないし情報）と___の両面を重視した方法が重要である。",a:"感情"},
{s:3,u:"3-2 態度に関する教育",q:"態度の教育は、___の形成と深い関連を持ち、これは他人との接触を通じて形成されることが多いため、集団技法（集団討議法・集団決定法）が有効である。",a:"人格（パーソナリティ）"},
{s:3,u:"3-2 態度に関する教育",q:"集団討議法：___…固定的なルールを設けずに、自由に話し合うもの。",a:"自由討議法"},
{s:3,u:"3-2 態度に関する教育",q:"集団討議法：___…あるテーマについて、あらかじめ選ばれている複数の専門家（パネリスト）が意見を述べた後に、一般の参加者も交えて討議を進めていくもの。",a:"パネル討議法"},
{s:3,u:"3-2 態度に関する教育",q:"集団決定法：___…現実に起こる場面を設定し、複数の人が実際にその役割を演じて、相手の出方や感情、応対の実技などを体得していくもの。",a:"ロールプレーイング（役割演技法）"},
{s:3,u:"3-2 態度に関する教育",q:"集団決定法：___…あらゆる集団帰属関係を切り離した文化的孤島の状況をつくり出し、集団参加へのフラストレーションを利用して気づかせたり、集団の機能についての洞察を行わせたりするもの。",a:"ST（センシティビティ・トレーニング、感受性訓練）"},
{s:3,u:"3-2 態度に関する教育",q:"集団決定法：___…1つの職場を単位としてその職場のトップがリーダーとなり、自分の職場の問題点に焦点を合わせて組織開発を進めるもの。",a:"職場ぐるみ訓練"},
{s:3,u:"3-2 態度に関する教育",q:"集団決定法：___…リーダーシップの行動スタイルを「人間に対する関心」と「業績に対する関心」という2軸で評価し、5類型に分類し、その人のリーダーシップのタイプを確認し、改善するもの。",a:"マネジリアルグリッド"},
{s:3,u:"3-2 態度に関する教育",q:"マネジリアルグリッドの5類型の中では___型（チーム型管理）が最も理想的なリーダー類型であると提唱者（ブレーク＆ムートン）は主張している。",a:"9・9"},
{s:3,u:"3-2 態度に関する教育",q:"日本では、マネジリアルグリッドに似たようなモデルとして三隅二不二氏が___を提した。",a:"PM理論"},
{s:3,u:"3-2 問題解決に関する教育",q:"問題解決の一般的なプロセスは、まず問題点を見出し、次にその問題の発生した___を究明し、最後にその問題の解決手段を考え出すという、3つの段階からなる。",a:"原因"},
{s:3,u:"3-2 問題解決に関する教育",q:"問題解決のための教育方法：___…事例を与えて解決策を出させ、それを集団で討議するもの。",a:"事例研究法（ケーススタディメソッド）"},
{s:3,u:"3-2 問題解決に関する教育",q:"問題解決のための教育方法：___…日常業務に密着した課題を与えて、問題解決のための行動訓練をさせるもの。",a:"課題法（プロジェクト法）"},
{s:3,u:"3-2 問題解決に関する教育",q:"問題解決のための教育方法：___…意思決定が必要となる案件を、一定時間内に大量に処理させる訓練技法（例：多数の未決裁の書類を短時間に問題解決させて、既決箱に入れさせていく）。",a:"インバスケット法（イントレイ法）"},
{s:3,u:"3-2 問題解決に関する教育",q:"問題解決のための教育方法：___…経営のモデルを使って意思決定させ、成績を競わせるもの。",a:"ビジネスゲーム（マネジメントゲーム）"},
{s:3,u:"3-2 創造性に関する教育",q:"創造性の教育に役立つ教育方法：___…数名が集まり、特定のテーマについて思いついたことを自由に話し合い、具体的な方法を見つけ出すもの（基本ルール：批判厳禁、自由奔放、量を求む、便乗発展）。",a:"ブレーンストーミング"},
{s:3,u:"3-2 創造性に関する教育",q:"創造性の教育に役立つ教育方法：___…アナロジー（類推）の論理を利用した流れ図を習得・応用させるもの（市川亀久彌氏の考察）。",a:"等価変換的思考法"},
{s:3,u:"3-2 創造性に関する教育",q:"創造性の教育に役立つ教育方法：___…ブレーンストーミングなどによって得られた発想を整序し、問題解決のヒントや糸口を導き出すもの（川喜田二郎氏の考案）。",a:"KJ法"},
{s:3,u:"3-3 中・長期的人材育成",q:"従業員の中・長期目標に合わせて能力開発を推進する方法を___（CDP：キャリア・ディベロップメント・プログラム）と呼ぶ。",a:"経歴開発計画"},
{s:3,u:"3-3 中・長期的人材育成",q:"CDPとは、企業の人材ニーズと本人の希望とを突き合わせて長期的なキャリア育成プランを作成し、その計画に沿って___や教育訓練を実施する仕組みのことである。",a:"ローテーション（職務異動）"},
{s:3,u:"3-3 中・長期的人材育成",q:"CDPの基本的要素：___の設定…初級、中級、上級、エグゼクティブの4つに分けてキャリアを定義する。",a:"キャリアレベル"},
{s:3,u:"3-3 中・長期的人材育成",q:"CDPの基本的要素：___の設定…その職務からどの職務に異動昇進できるかという経路（パス）を明確にする。",a:"キャリアパス"},
{s:3,u:"3-3 中・長期的人材育成",q:"CDPを行ううえでの留意点ⅱ）従業員が選択した目標や「経路（パス）」が、その適性からみて難しい場合は、管理者が___して、より適したものを選択させる。",a:"説得・指導"},
{s:3,u:"3-4 管理者によるカウンセリング",q:"いかなる場合にも、最終的にはどう行動するか、どう解決するかは従業員自身が決定するように助言していくことから、管理者によるカウンセリングは、一種の___である。",a:"自立教育"},
{s:3,u:"3-4 管理者によるカウンセリング",q:"___…カウンセリングをする管理者が、クライアントに自分の感情的な態度を自由に表現させ、それを通してクライアント自身に今後どのように行動するかを決めさせていく方法（クライアントを中心とした技法）。",a:"非指示的方法"},
{s:3,u:"3-4 管理者によるカウンセリング",q:"___…クライアントにいろいろと質問したり、情報を集めて問題点や原因を考えたり、判断を助けたり、解決法を助言したり勧告したりする方法（カウンセラーを中心とする技法）。",a:"指示的方法"},
{s:3,u:"3-4 管理者によるカウンセリング",q:"カウンセリングを行ううえでの留意点ⅰ）___を守ること　ⅱ）クライアントの選んだ解決法を阻止しないこと",a:"秘密"},
{s:3,u:"3-5 インターンシップへの取組み",q:"インターンシップとは、学校に在籍する学生が、実社会に出て現場で___することであり、業務内容や働くことの理解を深めさせる目的がある。",a:"体験学習"},
{s:3,u:"3-5 インターンシップへの取組み",q:"インターンシップには、短期間で職を離れてしまう“雇用の___”を防ぐ効果がある。",a:"ミスマッチ"},
{s:3,u:"3-5 インターンシップへの取組み",q:"インターンシップの実施プロセスⅴ）___（ⅳ）学生募集と選考の次）",a:"マッチング"},
{s:3,u:"3-5 インターンシップへの取組み",q:"インターンシップの実施プロセスⅷ）研修後の評価・___",a:"フォロー"},
// ===== 第2章 第1節 =====
{s:4,u:"キャッシュフローとキャッシュフロー経営",q:"1990年代初めのバブル崩壊以降、さまざまな環境変化により会計上の利益と___との剥離が顕在化し、これまでの財務諸表にもとづく計数管理に限界がみえてきた。",a:"現金収支"},

{s:4,u:"キャッシュフローとキャッシュフロー経営",q:"キャッシュフロー経営とは、___を経営指標として、___の最大化（企業価値の最大化）を目指す経営手法である。",a:"キャッシュフロー"},

{s:5,u:"収益力向上施策とキャッシュフロー",q:"営業キャッシュフローの構成要素の分析：客数または___を高めて売上高を増加させる。",a:"客単価"},
{s:5,u:"収益力向上施策とキャッシュフロー",q:"営業キャッシュフローの構成要素の分析：仕入価格の引下げなどにより___を下げる。",a:"売上原価"},

{s:5,u:"在庫管理とキャッシュフロー",q:"在庫管理における問題は、会計処理により、キャッシュをいまだ獲得していない商品在庫を貸借対照表上の___として認識してしまうために、損益計算書では商品のキャッシュベースでの収益性を把握できないことである。",a:"資産"},
{s:5,u:"運転資金管理とキャッシュフロー",q:"金融機関から運転資金を確保できない場合、資金ショートが起こり、仮に損益計算書上は利益が確保されていても___のおそれが生じる。",a:"黒字倒産"},

{s:5,u:"キャッシュフロー計算書を読むポイント",q:"財務活動によるキャッシュフローがプラスの場合…営業キャッシュフローでは必要な資金が賄えず、___に依存している。",a:"借入金"},

{s:6,u:"キャッシュフローマージン【収益性】",q:"キャッシュフローマージンは、営業キャッシュフローを用いて___を評価するための経営指標で、売上高から営業キャッシュフローがどの程度の割合でもたらされたかを表す。（＝営業キャッシュフロー÷売上高×100）",a:"収益性"},
{s:6,u:"キャッシュフローマージン【収益性】",q:"営業キャッシュフローは損益計算書の___に相当すると考えられる。",a:"営業利益"},
{s:6,u:"キャッシュフローマージン【収益性】",q:"キャッシュフローマージンは、キャッシュフロー版___といえる。",a:"売上高営業利益率"},
{s:6,u:"営業キャッシュフロー対流動負債比率【支払能力分析】",q:"営業キャッシュフロー対流動負債比率は、財務流動性をキャッシュフローの観点から分析する経営指標であり、キャッシュフロー版___ともいわれる。（＝営業キャッシュフロー÷流動負債×100）",a:"当座比率"},
{s:6,u:"営業キャッシュフロー対長期負債比率【支払能力分析】",q:"営業キャッシュフロー対長期負債比率は、長期負債を営業キャッシュフローでどれだけ賄うことができるかをみる経営指標であり、単に___ともいう。（＝営業キャッシュフロー÷長期負債×100）",a:"キャッシュフロー倍率"},
{s:6,u:"営業キャッシュフロー対長期負債比率【支払能力分析】",q:"営業キャッシュフロー対長期負債比率が___%を超えていれば、営業活動で得られるキャッシュフローで長期負債を返済できる能力があることを示す。",a:"100"},
{s:6,u:"キャッシュフロー版インタレスト・カバレッジ・レシオ【支払能力分析】",q:"キャッシュフロー版インタレスト・カバレッジ・レシオ＝（営業キャッシュフロー＋支払利息額＋___）÷支払利息額（倍）",a:"税金"},
{s:6,u:"営業キャッシュフロー対設備投資比率【投資分析】",q:"営業キャッシュフロー対設備投資比率が___%以上であれば、営業キャッシュフローで設備投資を賄うことができているということになる。（＝営業キャッシュフロー÷設備投資額×100）",a:"100"},
{s:6,u:"1株当たり営業キャッシュフロー【株主・投資家の評価】",q:"1株当たり営業キャッシュフローは、当期純利益を発行済み株式数で割った___（1株当たり当期純利益）と同様に、キャッシュフロー版___といえる。",a:"EPS"},
{s:6,u:"1株当たり営業キャッシュフロー【株主・投資家の評価】",q:"今後の株価を占う手掛かりとして1株当たり営業キャッシュフローの伸びを予想する際は、簡便的に求めるキャッシュフロー（税引き後当期純利益＋___）をもとに予測することが多い。",a:"減価償却費"},
{s:6,u:"株価キャッシュフロー倍率【株主・投資家の評価】",q:"株価キャッシュフロー倍率（___）は、株価を1株当たりキャッシュフローと比較し、株式の投資価値の妥当性（割高か割安か）を評価する経営指標である。",a:"PCFR"},
{s:6,u:"株価キャッシュフロー倍率【株主・投資家の評価】",q:"株価キャッシュフロー倍率は、株式の投資価値を損益計算書の観点から判断する経営指標である___（株価収益率）をキャッシュフローに応用した指標であり、キャッシュフロー版___といえる。",a:"PER"},

{s:7,u:"用途地域の種類（住居系）",q:"___…低層住宅の良好な環境保護のための地域。店舗等との兼用住宅で、店舗等の部分の床面積が50㎡以下、かつ、建築物の延べ面積の2分の1未満のものは建築できる。",a:"第一種低層住居専用地域"},

{s:7,u:"用途地域の種類（住居系）",q:"第二種低層住居専用地域では、床面積の合計が___以内の一定の店舗等は建築できる。",a:"150㎡"},

{s:7,u:"用途地域の種類（住居系）",q:"田園住居地域では、農産物直売所など___を販売する店舗等は建築できる。",a:"農産物"},
{s:7,u:"用途地域の種類（住居系）",q:"___…中高層住宅の良好な環境保護のための地域。",a:"第一種中高層住居専用地域"},

{s:7,u:"用途地域の種類（住居系）",q:"第二種中高層住居専用地域では、当該用途に使用される部分が2階以下、かつ、___以下の店舗等は建築できる。",a:"1,500㎡"},

{s:7,u:"用途地域の種類（商業系）",q:"___…近隣の住宅地の住民に対する日用品の供給を主たる内容とする商業その他の業務の利便を推進するための地域（大規模集客施設の建築可）。",a:"近隣商業地域"},

{s:7,u:"1-2 借地借家法",q:"借地借家法は、___の特別法であり、借地権の存続期間・効力、建物の賃貸借の更新・効力などに関して優先して適用される法律である。",a:"民法"},
{s:7,u:"1-2 借地借家法",q:"借地借家法は、建物所有目的の土地の賃借権（___）の存続期間・効力などに関して優先して適用される法律である。",a:"借地権"},
{s:7,u:"1-2 借地借家法",q:"1992年に改正された借地借家法（新法）では、借地権の存続期間は、建物構造（堅固・非堅固）に関係なく最低___（これ以上の期間は自由）とされた。",a:"30年"},
{s:7,u:"1-2 定期借地権",q:"___…借地期間を50年以上とすることを条件として、契約の更新をしない・建物再築による期間の延長をしない・期間満了による建物の買取請求をしないという3つの特約を公正証書などの書面で契約することで成立する借地権（土地は更地で地主に返還される）。",a:"一般定期借地権"},
{s:7,u:"1-2 定期借地権",q:"一般定期借地権は、借地期間を___以上とすることを条件とする。",a:"50年"},
{s:7,u:"1-2 定期借地権",q:"一般定期借地権の3つの特約のⅰ）は、契約の___をしないことである。",a:"更新"},
{s:7,u:"1-2 定期借地権",q:"一般定期借地権は、3つの特約を___などの書面で契約することで成立する。",a:"公正証書"},
{s:7,u:"1-2 定期借地権",q:"___…もっぱら事業の用に供する建物の所有を目的に、存続期間を10年以上50年未満として契約する場合には、契約の更新、建物再築による期間の延長、期間満了における建物買取請求権が適用されないとする借地権（契約は必ず公正証書で行う）。",a:"事業用定期借地権"},
{s:7,u:"1-2 定期借地権",q:"事業用定期借地権は、存続期間を___以上50年未満として契約する。",a:"10年"},
{s:7,u:"1-2 定期借地権",q:"___…借地権設定後30年以上経過した日に、地主（借地権設定者）が借地人から借地上の建物を買い取ることを約束した借地権。",a:"建物譲渡特約付借地権"},
{s:7,u:"1-2 定期借地権",q:"建物譲渡特約付借地権は、借地権設定後___以上経過した日に、地主が借地人から建物を買い取ることを約束した借地権である。",a:"30年"},
{s:7,u:"1-2 定期借地権",q:"建物譲渡特約付借地権は、特に書面による必要はなく、___でも設定は可能とされる。",a:"口頭"},

{s:8,u:"2-1 建築基準法",q:"建築物の安全・衛生を確保するための基準は、建築物の使用者の生命、健康などを守るための基準で、すべての建築物に適用される（___規定）。",a:"単体"},
{s:8,u:"2-1 建築基準法",q:"市街地の安全・環境を確保するための基準は、良好な市街地環境を確保するための基準で、原則として都市計画区域内の建築物に適用される（___規定）。",a:"集団"},
{s:8,u:"2-1 建ぺい率と容積率",q:"建ぺい率とは、敷地面積に対する___（おおむね1階の床面積）の割合である。",a:"建築面積（建坪）"},
{s:8,u:"2-1 建ぺい率と容積率",q:"容積率とは、敷地面積に対する建物の___（各階の床面積の合計）の割合である。",a:"延べ床面積"},
{s:8,u:"2-1 建ぺい率と容積率",q:"容積率の限度は、都市計画で用途地域に応じて定められたものと、___（敷地が実際に接する道路）の幅員に応じて定められているものがあり、いずれか厳しいほうが適用される。",a:"前面道路"},
{s:8,u:"2-1 建ぺい率の制限",q:"建ぺい率の制限：第一種・第二種低層住居専用地域、田園住居地域、第一種・第二種中高層住居専用地域、工業専用地域は___%のうち都市計画で定める割合。",a:"30、40、50、60"},
{s:8,u:"2-1 建ぺい率の制限",q:"建ぺい率の制限：第一種住居地域、第二種住居地域、準住居地域、準工業地域は___%のうち都市計画で定める割合。",a:"50、60、80"},
{s:8,u:"2-1 建ぺい率の制限",q:"建ぺい率の制限：商業地域は___%。",a:"80"},
{s:8,u:"2-1 敷地と道路",q:"建築基準法でいう「道路」とは、原則として公道などの幅員___以上のものをいい、これらの道路に接していない敷地には、原則として建築物を建てることができない。",a:"4m"},
{s:8,u:"2-1 敷地と道路",q:"都市計画区域および準都市計画区域内の一般の建築物の敷地は、原則として幅員4m以上の道路に間口___以上接していなければならない。",a:"2m"},
{s:8,u:"2-1 敷地と道路",q:"一般の建築物の敷地は、原則として幅員4m以上の道路に間口2m以上接していなければならないことを___という。",a:"接道義務"},
{s:8,u:"2-1 建築物の用途制限",q:"都市計画では、用途地域（全13種類）を定めており、___でその用途地域の中で建てられる建築物の種類や規模を規制している。",a:"建築基準法"},
{s:8,u:"2-1 建築物の用途制限",q:"市街地の各地域に適した類似の用途の建築物を集め、同時に地域にふさわしくない用途のものを取り除いて、市街地の___な利用をはかろうとするのが用途制限である。",a:"合理的"},
{s:8,u:"2-1 建築物の用途制限",q:"土地利用計画に沿って、市街地の各地域に適した類似の用途の建築物を集め、市街地の合理的な利用をはかろうとするのが___である。",a:"用途制限"},
{s:8,u:"2-1 建築物の用途制限",q:"店舗等で延べ床面積が10,000㎡超の建築物（大規模集客施設）が建築できる用途地域は、___の3つに限定されている。",a:"近隣商業地域、商業地域、準工業地域"},
{s:8,u:"2-1 高さ制限",q:"___…前面道路の幅員により、また緩和措置によって道路境界線から建物を後退して建てる距離により、道路から一定の範囲内で建築物の各部分の高さを制限するもの（都市計画区域と準都市計画区域のすべての区域に適用）。",a:"道路斜線制限"},
{s:8,u:"2-1 高さ制限",q:"___…隣地境界線からの水平距離による建築物の高さの制限。",a:"隣地斜線制限"},
{s:8,u:"2-1 高さ制限",q:"___…北側の隣地の日照確保に配慮するための高さの制限。北側隣地境界線を起点として「高さ」と「斜線の勾配（角度）」によって規制される。",a:"北側斜線制限"},
{s:8,u:"2-1 高さ制限",q:"北側斜線制限は、低層住居専用地域（第一種・第二種）と中高層住居専用地域（第一種・第二種）、___にのみ適用される。",a:"田園住居地域"},
{s:8,u:"2-1 高さ制限",q:"___…低層住居専用地域（第一種・第二種）と田園住居地域で決められている建築物の高さの限度で、10mまたは12m以内のいずれかが規定されている。",a:"絶対高さ制限"},
{s:8,u:"2-1 広告塔・広告板",q:"高さ___を超える独立の広告塔、広告板、その他政令で定める工作物には、建築基準法の規定が準用される。",a:"4m"},
{s:8,u:"2-1 広告塔・広告板",q:"美観維持と危害防止のために屋外広告物に対する規制があり、制限の具体的内容は条例に定めるところにより___が決定する。",a:"都道府県知事"},
{s:8,u:"2-1 店舗建築の確認申請",q:"都市計画区域または準都市計画区域と___（都市計画区域および準都市計画区域外の景観計画区域において、景観の保全を図るために指定される区域）に指定された区域内で建築物を建築しようとするときは、建築確認を受けなければならない。",a:"準景観地区"},
{s:8,u:"2-1 店舗建築の確認申請",q:"建築物を建築しようとするときには、原則としてその規模に関係なく、あらかじめ___（または指定確認検査機関）による建築確認を受けなければならない。",a:"建築主事"},
{s:8,u:"2-1 店舗建築の確認申請",q:"建築物を建築しようとするときには、あらかじめ建築主事（または指定確認検査機関）による___を受けなければならない。",a:"建築確認"},
{s:8,u:"2-1 店舗建築の確認申請",q:"百貨店やスーパーマーケットなど特殊建築物の建築では、新築の場合でその用途に供する床面積の合計が___を超える場合、建築主事の確認を受けなければならない。",a:"200㎡"},
{s:8,u:"2-1 店舗建築の確認申請",q:"特殊建築物の大規模な改築、修繕、模様替え、___などを行う場合には、工事着手前に建築主事の確認を受けなければならない。",a:"用途変更"},
{s:8,u:"2-2 防火に関する法令",q:"___…防火、消火、避難などの観点から建物の構造、内装、防火設備などを規制。",a:"建築基準法"},
{s:8,u:"2-2 防火に関する法令",q:"___…店舗の防火管理体制の強化、消防用設備の整備などを規定。",a:"消防法"},
{s:8,u:"2-2 店舗に関する主な規制",q:"構造計算が必要な建築物：高さが60m以下の建築物のうち、木造で高さが___を超えているか、軒の高さが9mを超える建築物。",a:"13m"},
{s:8,u:"2-2 店舗に関する主な規制",q:"構造計算が必要な建築物：木造で高さが13mを超えているか、軒の高さが___を超える建築物。",a:"9m"},
{s:8,u:"2-2 店舗に関する主な規制",q:"構造計算が必要な建築物：鉄骨造で地階を除く階数が___以上の建築物。",a:"4（階）"},
{s:8,u:"2-2 店舗に関する主な規制",q:"構造計算が必要な建築物：鉄筋コンクリート造または鉄骨鉄筋コンクリート造で高さが___を超える建築物。",a:"20m"},
{s:8,u:"2-2 店舗に関する主な規制",q:"主要構造部を耐火構造などにしなければならない建築物：床、屋根、階段以外の主要構造部に可燃材料を用いた建築物で、延べ面積が___を超えているか、高さが16mを超えているか、地階を除いて階数が4以上の場合。",a:"3,000㎡"},
{s:8,u:"2-2 店舗に関する主な規制",q:"主要構造部を耐火構造などにしなければならない建築物：延べ面積が3,000㎡を超えているか、高さが___を超えているか、地階を除いて階数が4以上の場合。",a:"16m"},
{s:8,u:"2-2 店舗に関する主な規制",q:"防火地域内…3階以上（地階を含む）または延べ面積が___を超える建築物は、耐火建築物か延焼防止建築物にしなければならない。",a:"100㎡"},
{s:8,u:"2-2 店舗に関する主な規制",q:"防火地域内…3階以上（地階を含む）または延べ面積が100㎡を超える建築物は、耐火建築物か___にしなければならない。",a:"延焼防止建築物"},
{s:8,u:"2-2 店舗に関する主な規制",q:"準防火地域内…地階を除く階数が4以上または延べ面積が___を超える建築物は耐火建築物か延焼防止建築物にしなければならない。",a:"1,500㎡"},
{s:8,u:"2-2 店舗に関する主な規制",q:"防火地域内にある看板や広告塔などで、建築物の屋上に設けるものや高さが___を超えるものは、主要な部分を不燃材料としなければならない。",a:"3m"},
{s:8,u:"2-2 店舗に関する主な規制",q:"床面積が1,500㎡を超える物品販売業を営む店舗では、各階の売場から避難階段または地上に通じる直通階段を___つ以上設けなければならない。",a:"2"},
{s:8,u:"2-2 店舗に関する主な規制",q:"3階以上の階に売場を設ける場合は、各階の売場および屋上広場に通じる直通階段を2つ以上設け、避難階段か___としなければならない。",a:"特別避難階段"},
{s:8,u:"2-2 店舗に関する主な規制",q:"排煙設備の設置：不特定多数の人が利用する大規模な特殊建築物、階数が___以上で延べ面積が500㎡を超える建築物には、原則として排煙設備の設置が義務づけられている。",a:"3（階）"},
{s:8,u:"2-2 店舗に関する主な規制",q:"排煙設備の設置：階数が3以上で延べ面積が___を超える建築物には、原則として排煙設備の設置が義務づけられている。",a:"500㎡"},
{s:8,u:"2-2 店舗に関する主な規制",q:"建築設備としての昇降機には、エレベーター、エスカレーター、___の3種類がある。",a:"小荷物専用昇降機"},
{s:8,u:"2-2 店舗に関する主な規制",q:"避雷設備の基準：高さが___を超える建築物には、避雷設備を設置しなければならない。",a:"20m"},
{s:8,u:"2-2 消防用設備の整備",q:"政令で定める「消防用の設備」「消防用水」「消火活動上必要な設備」を___という。",a:"消防用設備"},
{s:8,u:"2-2 消防用設備の整備",q:"___…消火器、屋内消火栓設備、スプリンクラー設備など。",a:"消火設備"},
{s:8,u:"2-2 消防用設備の整備",q:"___…自動火災報知設備、ガス漏れ火災警報設備、漏電火災警報器など。",a:"警報設備"},
{s:8,u:"2-2 消防用設備の整備",q:"___…避難器具、誘導灯、誘導標識、避難はしごなど。",a:"避難設備"},
{s:8,u:"2-2 防火管理者の選任と職務",q:"防火管理者は、店舗建物についての___を作成し、それにもとづいて消火、通報および避難訓練を実施する。",a:"消防計画"},
{s:8,u:"2-3 バリアフリー法",q:"2006年に施行されたバリアフリー法は、___と交通バリアフリー法を統合・拡充した法律である。",a:"ハートビル法"},
{s:8,u:"2-3 バリアフリー法",q:"バリアフリー法では、学校、病院、劇場、ホテルなど多数の人が利用する建築物を___と定めている。",a:"特定建築物"},
{s:8,u:"2-3 バリアフリー法",q:"バリアフリー法では、不特定多数の人または主として高齢者、障がい者などが利用する特定建築物を___と定めている。",a:"特別特定建築物"},
{s:8,u:"2-3 バリアフリー法",q:"床面積の合計が___以上の特別特定建築物を建築（新築・増築・改築）、用途変更する場合は、建築物移動等円滑化基準（義務基準）に適合することを義務づけている。",a:"2,000㎡"},
{s:8,u:"2-3 バリアフリー法",q:"床面積の合計が2,000㎡以上の特別特定建築物を建築、用途変更する場合は、___（義務基準）に適合することを義務づけている。",a:"建築物移動等円滑化基準"},
{s:8,u:"2-3 バリアフリー法",q:"車いす使用者同士がすれ違うことができる十分な廊下幅員の確保など、___（誘導基準）を満たす特定建築物の建築主は、計画の所管行政庁の認定を受けることができる。",a:"建築物移動等円滑化誘導基準"},
{s:8,u:"2-3 バリアフリー法",q:"建築物移動等円滑化誘導基準を満たし認定されると___となり、シンボルマークを表示できるほか、容積率の特例など各種の支援措置を受けられる。",a:"認定特定建築物"},
{s:8,u:"2-3 バリアフリー法",q:"2018年に改正された改正バリアフリー法に新たな基本理念が掲げられ、「___の除去」に資することを位置づけた。",a:"社会的障壁"},
{s:8,u:"2-3 バリアフリー法",q:"2018年の改正バリアフリー法では、誰もが分け隔てられることのない「___の実現」を位置づけた。",a:"共生社会"},
// ===== 第3章 第3節 =====
{s:9,u:"3-1 リースの効用と特色",q:"リースのメリット：リース料金を税務上___処理することができる。",a:"損金（経費）"},
{s:9,u:"3-1 リースの効用と特色",q:"リースのデメリット：___が契約条項上禁止されている。",a:"中途解約"},
{s:9,u:"3-1 リースの効用と特色",q:"リースは、経済的な実態からは、融資を受けて元金と利息の合計をリース料として返済するという___に近い性格が見受けられる。",a:"金融取引"},
{s:9,u:"3-1 リースとレンタルの相違点",q:"リースは特定のユーザーとの長期的、かつ、___な使用契約である。",a:"専属的"},
{s:9,u:"3-1 リースとレンタルの相違点",q:"レンタルは不特定多数の使用者との短期的、かつ、___な使用契約である。",a:"短期的"},
{s:9,u:"3-1 リースとレンタルの相違点",q:"リース物件の保守・修理などの費用は通常、___の負担であるが、レンタルの場合はレンタル業者が負担する。",a:"ユーザー（借り手、顧客）"},
{s:9,u:"3-1 リースとレンタルの相違点",q:"リースのユーザーは、低率のリース料で再リース契約や、リース終了時に低額で___することができる。",a:"買取り"},
{s:9,u:"3-2 リース契約",q:"リース契約（取引）には、大きく分けて___とオペレーティングリース取引がある。",a:"ファイナンスリース取引"},
{s:9,u:"3-2 リース契約",q:"___…ファイナンスリース取引の2つの条件を満たさないリースで、いわゆるレンタルもこれに含まれる。",a:"オペレーティングリース取引"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引の条件ⅰ）中途解約不能：___…リース期間中の解約ができない契約、あるいは実質的に不可能。",a:"ノンキャンセラブル"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引の条件ⅱ）___…リースによって調達した資産の経済的利益と使用に際して必要になるコストを借り手が負担する。",a:"フルペイアウト"},
{s:9,u:"3-2 リース契約",q:"___ファイナンスリース取引…リース契約上の諸条件に照らしてリース物件の所有権が借り手に移転すると認められるもの。",a:"所有権移転"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引は、リース資産の所有権が借り手に移転するかどうかで、所有権移転ファイナンスリース取引と___ファイナンスリース取引に分類される。",a:"所有権移転外"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引は、実質的には___で資産を購入したのと同様になる。",a:"分割払い"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引は、貸借対照表にリース資産を___として計上する。",a:"有形固定資産"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引は、リース資産を有形固定資産として計上し、___を行う。",a:"減価償却"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引は、リース料の総額を評価して___として計上する。",a:"負債"},
{s:9,u:"3-2 リース契約",q:"ファイナンスリース取引は、多くの場合、リース業者とユーザー間で___の免責特約が締結され、リース業者はリース物件の品質等の不適合があった場合の責任を負担せず、保守責任も負わない。",a:"契約不適合責任"},
{s:9,u:"3-2 その他のリース取引",q:"___リース…リース会社がリース物件の保守・管理・修繕などを行うリースで、煩雑な管理を伴う自動車のリースに多くみられる。",a:"メンテナンス"},
{s:9,u:"3-2 その他のリース取引",q:"___リース…税金を含めたいっさいの付帯費用をユーザーが負担するため、リース料は安くなる。",a:"ネット"},
{s:9,u:"3-2 リース契約の成立過程",q:"リース契約は、表面上はユーザーとリース業者との___の形式をとる。",a:"賃貸借契約"},
{s:9,u:"3-2 リース契約の成立過程",q:"ファイナンスリースの実体は、リース業者による長期与信を目的とした___に類似した契約である。",a:"金融取引"},
{s:9,u:"3-2 リース契約の成立過程",q:"リース物件に___があれば、ユーザーは直ちにメーカー（販売会社）とリース業者に通知しなければならない。",a:"契約内容不適合"},
{s:9,u:"3-3 ソフトウェアリース",q:"ソフトウェアを利用するには、ソフトウェアのメーカー（使用権設定者）と___を締結し、使用権を獲得する方法がある。",a:"使用権許諾契約"},

// ---- STATE ---------------------------------------------------------
let deck = [], idx = 0, ok = 0, ng = 0, wrong = [], revealed = false;
const $ = id => document.getElementById(id);
const show = (...ids) => { ["start","quiz","result","review"].forEach(i => $(i).classList.add("hidden")); ids.forEach(i => $(i).classList.remove("hidden")); window.scrollTo(0,0); };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- PROGRESS（途中保存・再開）--------------------------------------
const PKEY = "hanbaishi_km_progress_v1";
const progressQid = q => q.s + "|" + q.q;

function readProgress(){
  try{
    const st = JSON.parse(localStorage.getItem(PKEY));
    if(!st || !Array.isArray(st.deck) || !st.deck.length) return null;
    if(!Number.isInteger(st.idx) || st.idx < 0 || st.idx >= st.deck.length) return null;
    return st;
  }catch(e){ return null; }
}
function saveProgress(){
  if(!deck.length || idx < 0 || idx >= deck.length) return;
  const st = {
    v: 2,
    deck: deck.map(progressQid),
    idx,
    ok,
    ng,
    wrong: wrong.map(progressQid),
    revealed,
    savedAt: Date.now()
  };
  try{ localStorage.setItem(PKEY, JSON.stringify(st)); }catch(e){}
  refreshResume();
}
function clearProgress(){
  try{ localStorage.removeItem(PKEY); }catch(e){}
  refreshResume();
}
function refreshResume(){
  const btn = $("btnResume");
  if(!btn) return;
  const st = readProgress();
  if(!st){
    btn.classList.add("hidden");
    btn.textContent = "前回の続きから再開";
    return;
  }
  btn.textContent = `前回の続きから再開（${st.idx + 1} / ${st.deck.length}）`;
  btn.classList.remove("hidden");
}
function restoreProgress(){
  const st = readProgress();
  if(!st){ refreshResume(); return; }

  const qmap = new Map(Q.map(q => [progressQid(q), q]));
  const restoredDeck = st.deck.map(id => qmap.get(id));
  if(restoredDeck.some(q => !q)){
    clearProgress();
    uiAlert("問題データが更新されたため、前回の途中データをリセットしました。");
    return;
  }

  deck = restoredDeck;
  idx = st.idx;
  ok = Number.isInteger(st.ok) ? st.ok : 0;
  ng = Number.isInteger(st.ng) ? st.ng : 0;
  wrong = Array.isArray(st.wrong) ? st.wrong.map(id => qmap.get(id)).filter(Boolean) : [];
  revealed = !!st.revealed;
  show("quiz");
  render();
}

window.addEventListener("pagehide", saveProgress);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") saveProgress();
});


// ---- START ---------------------------------------------------------
(function buildStart(){
  const box = $("secList");
  Object.keys(SECTIONS).forEach(k=>{
    const n = Q.filter(q=>q.s==k).length;
    box.insertAdjacentHTML("beforeend",
      `<label><input type="checkbox" name="sec" value="${k}" checked>${SECTIONS[k]}<span class="cnt">${n}問</span></label>`);
  });
})();

$("btnStart").onclick = () => {
  const secs = [...document.querySelectorAll('input[name=sec]:checked')].map(e=>+e.value);
  if(!secs.length){ uiAlert("節を1つ以上選択してください。"); return; }
  let list = Q.filter(q=>secs.includes(q.s));
  startQuiz(list, $("shuffle").checked);
};
$("btnResume").onclick = restoreProgress;

function startQuiz(list, shuffle){
  deck = list.slice();
  if(shuffle){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; } }
  idx=0; ok=0; ng=0; wrong=[]; revealed=false;
  show("quiz"); render();
  saveProgress();
}

// ---- QUIZ ----------------------------------------------------------
function render(){
  const q = deck[idx];
  $("secName").textContent = SECTIONS[q.s];
  $("counter").textContent = `${idx+1} / ${deck.length}`;
  $("barFill").style.width = `${(idx/deck.length)*100}%`;
  $("subName").textContent = q.u;
  $("qText").innerHTML = esc(q.q).replace(/___/g, `<span class="blank">${esc(q.a)}</span>`);
  $("ansBox").classList.add("hidden");
  $("judgeRow").classList.add("hidden");
  $("btnReveal").classList.remove("hidden");
  $("okCnt").textContent = ok; $("ngCnt").textContent = ng;

  if(revealed){
    document.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
    $("ansText").textContent = deck[idx].a;
    $("ansBox").classList.remove("hidden");
    $("btnReveal").classList.add("hidden");
    $("judgeRow").classList.remove("hidden");
  }
  saveProgress();
}

$("btnReveal").onclick = () => {
  revealed = true;
  document.querySelectorAll(".blank").forEach(b=>b.classList.add("show"));
  $("ansText").textContent = deck[idx].a;
  $("ansBox").classList.remove("hidden");
  $("btnReveal").classList.add("hidden");
  $("judgeRow").classList.remove("hidden");
  saveProgress();
};
$("btnOk").onclick = () => judge(true);
$("btnNg").onclick = () => judge(false);
function judge(correct){
  if(correct){ ok++; removeWeak(deck[idx]); }
  else { ng++; wrong.push(deck[idx]); addWeak(deck[idx]); }
  idx++;
  revealed = false;
  if(idx >= deck.length) finish(); else render();
}
$("btnQuit").onclick = async () => {
  if(await uiConfirm("中断してトップに戻りますか？\n途中経過は保存され、あとで続きから再開できます。")){
    saveProgress();
    show("start");
    refreshResume();
  }
};


// ---- RESULT --------------------------------------------------------
function finish(){
  clearProgress();
  $("rOk").textContent = ok; $("rTotal").textContent = deck.length;
  $("rRate").textContent = `正答率 ${Math.round(ok/deck.length*100)}%`;
  const wb = $("wrongBox");
  if(wrong.length){
    wb.innerHTML = `<h2>間違えた問題（${wrong.length}問）</h2><ol>` +
      wrong.map(q=>`<li>${esc(q.q).replace(/___/g,"【　　】")}<br><b>→ ${esc(q.a)}</b></li>`).join("") + `</ol>`;
    $("btnRetryWrong").classList.remove("hidden");
    $("btnPrintWrong").classList.remove("hidden");
  } else {
    wb.innerHTML = `<p class="lead" style="text-align:center;margin-top:16px">全問正解。</p>`;
    $("btnRetryWrong").classList.add("hidden");
    $("btnPrintWrong").classList.add("hidden");
  }
  $("rWeakCnt").textContent = weak.length;
  refreshWeak();
  show("result");
}
$("btnRetryWrong").onclick = () => startQuiz(wrong, false);
$("btnPrintWrong").onclick = () => printQuestions(wrong, "今回間違えた問題");
$("btnHome").onclick = () => { show("start"); refreshResume(); };


// ---- WEAK LIST（間違えた問題の蓄積）--------------------------------
const WKEY = "hanbaishi_km_weak_v1";
const qid = q => q.s + "|" + q.q;
let weak = (function(){ try{ return JSON.parse(localStorage.getItem(WKEY)) || []; }catch(e){ return []; } })();
function saveWeak(){ try{ localStorage.setItem(WKEY, JSON.stringify(weak)); }catch(e){} }
function addWeak(q){ const id = qid(q); if(!weak.includes(id)){ weak.push(id); saveWeak(); } }
function removeWeak(q){ const i = weak.indexOf(qid(q)); if(i >= 0){ weak.splice(i,1); saveWeak(); } }
const weakQs = () => Q.filter(q => weak.includes(qid(q)));

function refreshWeak(){
  const n = weakQs().length;
  $("weakCnt").textContent = n;
  $("weakCard").classList.toggle("hidden", n === 0);
  $("rWeakCnt").textContent = n;
}

// ---- REVIEW（苦手問題集ページ）-------------------------------------
function renderReview(){
  const list = weakQs();
  const showAns = $("rvShowAns").checked;
  $("rvCnt").textContent = `${list.length} 問`;
  if(!list.length){
    $("rvList").innerHTML = `<p class="rv-empty">苦手リストは空です。<br>出題中に「× 不正解」を押した問題が、ここに自動でたまります。</p>`;
    $("btnRvQuiz").classList.add("hidden");
    $("btnRvPrint").classList.add("hidden");
    $("btnRvClear").classList.add("hidden");
  } else {
    $("rvList").innerHTML = list.map((q,i) =>
      `<div class="rv-item">
         <div class="rv-meta">${esc(SECTIONS[q.s])}／${esc(q.u)}</div>
         <div class="rv-q">${esc(q.q).replace(/___/g,"【　　】")}</div>
         ${showAns ? `<div class="rv-a">→ ${esc(q.a)}</div>` : ``}
         <button class="rv-del" data-i="${i}">覚えた（リストから外す）</button>
       </div>`).join("");
    $("btnRvQuiz").classList.remove("hidden");
    $("btnRvPrint").classList.remove("hidden");
    $("btnRvClear").classList.remove("hidden");
    $("rvList").querySelectorAll(".rv-del").forEach(b => {
      b.onclick = () => { removeWeak(list[+b.dataset.i]); renderReview(); refreshWeak(); };
    });
  }
}
function openReview(){ renderReview(); show("review"); }

$("btnWeakReview").onclick = openReview;
$("btnResultReview").onclick = openReview;
$("btnWeakQuiz").onclick = () => {
  const list = weakQs();
  if(!list.length){ uiAlert("苦手リストは空です。"); return; }
  startQuiz(list, $("shuffle").checked);
};
$("btnRvQuiz").onclick = () => startQuiz(weakQs(), false);
$("rvShowAns").onchange = renderReview;
function printQuestions(list, title){
  if(!list.length){ uiAlert("印刷する問題がありません。"); return; }

  const ua = navigator.userAgent;
  const isLine  = /Line\//i.test(ua);
  const isInApp = isLine || /FBAN|FBAV|Instagram|; wv\)|Claude/i.test(ua);
  if (isLine) {
    const u = new URL(location.href);
    u.searchParams.set("openExternalBrowser", "1");
    location.href = u.toString();
    return;
  }
  if (isInApp || typeof window.print !== "function") {
    uiAlert("このアプリ内の画面では印刷できません。\n\nメニューから「Safari／Chromeで開く」を選び、もう一度このボタンを押してください。");
    return;
  }

  $("printSheet").innerHTML =
    `<h2>${esc(title)}（${list.length}問）</h2>` +
    `<p class="print-note">問題編のあとに、解答編を別ページで印刷します。</p>` +
    list.map((q,i) =>
      `<div class="rv-item">
        <div class="rv-meta">問題 ${i+1}　${esc(SECTIONS[q.s])}／${esc(q.u)}</div>
        <div class="rv-q">${esc(q.q).replace(/___/g,"【　　】")}</div>
      </div>`
    ).join("") +
    `<div class="answer-key">
      <h2>解答</h2>
      <ol>${list.map(q => `<li>${esc(q.a)}</li>`).join("")}</ol>
    </div>`;

  window.print();
}
$("btnRvPrint").onclick = () => printQuestions(weakQs(), "苦手問題集");
$("btnRvClear").onclick = async () => {
  if(await uiConfirm(`苦手リスト（${weakQs().length}問）をすべて消去しますか？`)){
    weak = []; saveWeak(); renderReview(); refreshWeak();
  }
};
$("btnRvHome").onclick = () => { show("start"); refreshResume(); };

refreshWeak();
refreshResume();
</script>
